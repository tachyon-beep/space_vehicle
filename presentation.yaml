# The channels that exist for one cabin only.
#
# The vehicle has two crewed compartments and they cannot equalise between undocking and docking, so
# a channel about a cabin's air is about one cabin. Most are paired — the same quantity published
# twice, once per compartment — and the registry's own ids are the evidence: `eclss.cabin_temp_c` and
# `eclss.lm_cabin_temp_c` are one quantity in two rooms with no shared air between them.
#
# A channel that is *not* paired is therefore a claim, and until round 68 it was an implicit one: the
# two CO2 exposure averages were published for the cabin the crew leave and none for the one they
# live in, and nothing could tell that from a channel that is legitimately single because its subject
# is. `check_cabin_pairing` holds this list to the registry exactly, so a new unpaired channel is
# refused until it is either paired or explained here.
