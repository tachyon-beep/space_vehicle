# channels.yaml — the canonical point dictionary.
#
# Why this file exists as its own artifact, and not as `points` inside each domain:
# the corpus's worst structural failure is that eight documents name the same object
# eight ways (corpus-review.md §5). A single registry is the fix, and a per-domain
# `points` file then *references* it instead of forking it. This is a deliberate
# addition to the five-file factoring in simulator-design.md:128-134; the design did not
# anticipate that the sources would disagree about names, and a registry is cheaper than
# eight reconciliations.
#
# Rows marked apollo are apollo_diode.md's catalogue verbatim — identifiers, units,
# ranges, precisions and rates included — because it is the only document making a claim
# about a vehicle. Rows marked chosen are additions this project needs and apollo lacks;
# each states why. Rows marked derived are computed from other channels listed in
# `inputs`.
#
# `layer` is apollo's A/I distinction (apollo_diode.md:34-38) plus the SERVICE_STATE kind
# eclss_diode.md:65 adds:
#   measurement — a direct instrument reading, authoritative about the report only
#   estimate    — derived from readings or a model; wrong-without-a-sensor-failing is normal
#   service     — the vehicle's own state (commanded position, mode); not a physical claim
# `max_decision_age_ms` is the maximum age at which a sample may still be used as the
# basis of a decision. The concept was declared here from `communcations_diode.md:265`
# and the *mechanism* was missing until `mission_diode.md` arrived: it supplies the
# freshness calculation (:1227-1262), the per-guard dependency manifest, and the
# invariant that makes the whole thing load-bearing —
#
#     Invariant D: RequiredTelemetryStale  =>  not HazardousEffect
#
# The rule below is derived rather than tabulated, because the table it replaces was
# unsatisfiable. It said P1 = 100 ms; `cw.master_alarm`, `cw.active_lights` and
# `cw.alert_[id]_state` are all P1 and all publish at 1 Hz, so a 100 ms requirement on a
# 1000 ms channel marks every sample stale and the guard can never pass. Nineteen of the
# fifty channels a threshold watches were in that position. The number was authored as
# though the executive read the service's internal value, and a *published* channel is a
# mirror of it:
#
#   **the maximum age of a mirror is one publish period**, because a value older than one
#   period is a value the publisher was obliged to refresh and did not. The effective
#   value is the channel's own `max_decision_age_ms` if declared, else `1000 / rate_hz`.
#
# Two consequences worth stating, because they are what a fleet has to know:
#
#   - Where a hazard needs a decision faster than the point is published, the decision is
#     **not the agent's to make**. It belongs to a service-owned interlock evaluated at the
#     service's own rate, and `mission_diode.md:245` says so in the same words: a display
#     or a mirror must not become the primary fast hazard detector. So the vehicle's
#     interlocks do not wait for the mirror, and `max_decision_age_ms` bounds *the fleet's*
#     view rather than the vehicle's protection.
#   - A channel that publishes only on events has no period and must declare a value, or
#     the executive cannot tell a fresh sample from one that will never arrive. The linter
#     refuses a threshold whose point resolves to no age at all.
#
# `quality` lists which canonical quality codes this point may carry.

schema_version: 1
source: docs/deep_research/apollo_diode.md
vocabulary: docs/deep_research/integration/reconciliation/02-canonical-vocabulary.md

defaults:
  decision_age_ms: "one publish period: 1000 / rate_hz, per the rule in the header"
  quality_allowed: [GOOD, SUSPECT, STALE, SATURATED, OUT_OF_RANGE, INVALID, UNKNOWN, SUBSTITUTED]
  # A silently biased sensor stays GOOD (apollo_diode.md:688). Quality is assigned only by a
  # function that cannot see the simulator's fault state (simulator-design.md:496-508).

power:

  - id: power.dc_bus_a_v
    unit: V
    layer: measurement
    precision: 0.05
    rate_hz: 10
    priority: P2
    range: [27.0, 30.5]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<26.5 for 0.5 s", "fall >1 V/s"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:73"
  - id: power.dc_bus_b_v
    unit: V
    layer: measurement
    precision: 0.05
    rate_hz: 10
    priority: P2
    range: [27.0, 30.5]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<26.5 for 0.5 s", "fall >1 V/s"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:74"
  - id: power.bus_a_current_a
    unit: A
    layer: measurement
    precision: 0.2
    rate_hz: 5
    priority: P2
    range: [10, 120]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["> configured bus capacity", "step >20 A"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:75"
  - id: power.source_1_current_a
    unit: A
    layer: measurement
    precision: 0.2
    rate_hz: 2
    priority: P3
    range: [0, 80]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["unexpected zero", "overload"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:76"
  - id: power.battery_soc_pct
    unit: "%"
    layer: estimate
    precision: 0.1
    rate_hz: 0.2
    priority: P4
    range: [40, 100]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<30", "<15", "predicted depletion <2 h"]
    inputs: [power.bus_a_current_a, power.battery_temp_c]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:77"
  - id: power.battery_temp_c
    unit: degC
    layer: measurement
    precision: 0.1
    rate_hz: 1
    priority: P3
    range: [10, 40]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: [">45", "rise >2 degC/min"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:78"
  - id: power.bus_tie_state
    unit: "enum[open,closed,tripped]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P3
    events: ["unintended trip", "unintended change"]
    event_class: notification
    provenance:
      basis: apollo
      ref: "apollo_diode.md:79"
  - id: power.load_margin_w
    unit: W
    layer: estimate
    precision: 10
    rate_hz: 1
    priority: P3
    range: [250, null]
    range_kind: scale
    events: ["<100", "negative"]
    inputs: [power.dc_bus_a_v, power.bus_a_current_a]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:80"
  - id: "power.lcl_[n]_state"
    unit: "enum[closed,tripped,retrying,latched]"
    layer: service
    precision: exact
    rate_hz: 2
    on_event: true
    priority: P2
    events: ["trip", "second trip within the recovery dwell"]
    event_class: alarm
    provenance:
      basis: chosen
      reason: "apollo's power table has no per-load protection state; electrical_diode.md:254 supplies one controlled reclose then latch, which is the right hysteresis for a latched discrete and is adopted (review-findings.md #7)"
      note: >-
        the fourth member is `latched` and it was `open` until the linter's state/channel binding
        refused the mismatch — `lcl_tripped` holds `latched`, and the two words are not the same
        statement. `tripped` is the transient that a controlled reclose may clear; `latched` is the
        position it holds when the reclose failed. A channel that published `open` for both would
        have made an LCL that is about to reclose indistinguishable from one that never will, and
        the difference is the whole reason electrical_diode.md:254 specifies a reclose at all
  - id: "power.lcl_[n]_current_a"
    unit: A
    layer: measurement
    precision: 0.05
    rate_hz: 5
    priority: P3
    range: [0, null]
    range_kind: scale
    events: ["> 110 % of rating", "> 200 % hard short"]
    event_class: alarm
    provenance:
      basis: chosen
      reason: "electrical_diode.md:254 gives an LCL a 110-125 % limit and a >200 % hard-short trip; a per-load current is what makes an overloaded load distinguishable from a failed bus, which is the difference between the F-PWR-01 and F-PWR-06 signatures"
  - id: power.load_shed_class
    unit: "enum[none,P3,P2,P1,P0]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P1
    events: ["any shed", "any restore"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:48"
      note: "apollo lists breaker/load shedding as a principal operator control and gives the bus event condition; the four priority classes are chosen, from the P0-P3 factoring in electrical_diode.md:847"

eclss:

  - id: eclss.cabin_pressure_psia
    unit: psia
    layer: measurement
    precision: 0.01
    rate_hz: 2
    priority: P3
    range: [4.8, 5.2]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<4.5 caution", "<3.5 emergency", "fast leak"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:88"
      note: "conflict register C-04: eclss_diode.md:734 deletes this; apollo wins deliberately"
  - id: eclss.cabin_temp_c
    unit: degC
    layer: measurement
    precision: 0.1
    rate_hz: 0.2
    priority: P4
    range: [21.1, 23.9]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<10", ">30", "rapid trend"]
    event_class: realised_by
    event_thresholds: [csm_cabin_low, csm_cabin_high]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:89"
  - id: eclss.co2_pp_mmhg
    unit: mmHg
    layer: measurement
    precision: 0.1
    rate_hz: 0.5
    priority: P3
    range: [0, 5]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: [">7.6 caution"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:90"
      note: "instantaneous alarm; the 1-hour-average 3 mmHg limit is a different statistic and lives on the derived point below (C-05)"
  - id: eclss.co2_pp_1h_avg_mmhg
    unit: mmHg
    layer: estimate
    precision: 0.1
    rate_hz: 0.1
    priority: P4
    range: [0, 3]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: [">3 sustained"]
    inputs: [eclss.co2_pp_mmhg]
    event_class: alarm
    provenance:
      basis: chosen
      reason: "eclss_diode.md:735 adopts NASA's one-hour-average ppCO2 limit of 3 mmHg; it needs its own channel or the instantaneous alarm and the exposure limit contaminate one another"
  - id: eclss.pp_o2_mmhg
    unit: mmHg
    layer: measurement
    precision: 0.1
    rate_hz: 0.5
    priority: P3
    range: [236.02, 256.71]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<200 hypoxia", ">300 fire risk"]
    event_class: alarm
    provenance:
      basis: chosen
      reason: >-
        `eclss_diode.md:46` makes ppO2 the primary controlled variable and apollo has no such channel;
        a cabin-pressure channel alone cannot express a dilution or a fire risk. The band is derived,
        not chosen — and **it was derived wrong for as long as it has existed**: it read 248-269
        because "the cabin sits at 4.8-5.2 psia of essentially pure oxygen, and 5 psia is 258.6
        mmHg", which is the *total* pressure band. The cabin is 9.209 mmHg of water vapour and 3.0
        mmHg of carbon dioxide away from essentially pure
        (`atmosphere_model.check.partial_pressures_mmhg`), so 4.8 psia is 236.02 mmHg of oxygen and
        5.2 psia is 256.71 — the mixture's own band, which `check_cabin_pressure_closure` evaluates.
        The first version of this channel carried a sea-level 140-180 — the value a mixed atmosphere
        at 14.7 psia gives — the kind of error a range check would not catch and a fire-risk
        threshold would. A band on a derived quantity is only as good as the derivation behind it,
        which is why `check_cabin_pressure_closure` recomputes this one from the gas stocks rather
        than reading it back. The 9.209 mmHg of water vapour the band subtracts is itself a
        conflict — a suit-circuit dew point against the LM cabin heat exchanger's own absolute
        humidity, which reads 3 to 3.5 mmHg higher — and it is recorded as **C-25** in
        `../integration/reconciliation/01-conflict-register.md` rather than quietly substituted,
        because the share moves this band, the LM's two thresholds and the four-gas closure
        together.

  - id: eclss.lm_cabin_temp_c
    unit: degC
    layer: measurement
    precision: 0.1
    rate_hz: 0.2
    priority: P3
    events: ["<10", ">30", "rapid trend"]
    event_class: realised_by
    event_thresholds: [lm_cabin_low, lm_cabin_high]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:94"
      note: >-
        the LM compartment's temperature, under the naming pattern apollo uses for its own cabin
        channel and at apollo's rate and precision. It exists because the two compartments are
        separate conserved masses with separate ECLSS units (`apollo_diode.md:1071`) and one
        temperature channel cannot describe both — and because the crew positions already assumed
        it: the LM commander and the LM pilot list a cabin temperature among the things they can
        perceive, and until this channel existed the only one they could have been reading was the
        *other* spacecraft's

  - id: eclss.o2_supply_pressure_psi
    unit: psi
    layer: measurement
    precision: 1
    rate_hz: 0.5
    priority: P3
    range: [750, 950]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["low pressure", "fall >5 psi/min"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:91"
      note: "C-06: eclss_diode.md:736 removes this; apollo wins"
  - id: eclss.lm_cabin_pressure_psia
    unit: psia
    layer: measurement
    precision: 0.01
    rate_hz: 2
    priority: P3
    range: [4.8, 5.2]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<4.5 caution", "<3.5 emergency", "fast leak"]
    event_class: alarm
    provenance:
      basis: historical
      source: >-
        the LM cabin runs at about the same 5 psia as the CSM (NR), and it is a *separate*
        channel because from undocking to docking the two compartments cannot equalise. A single
        cabin-pressure channel would have made the LM's atmosphere unobservable for exactly the
        phase in which the crew are living in it.
  - id: eclss.lm_co2_pp_mmhg
    unit: mmHg
    layer: measurement
    precision: 0.1
    rate_hz: 0.5
    priority: P3
    range: [0, 5]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: [">7.6 caution"]
    event_class: alarm
    provenance:
      basis: historical
      source: >-
        the LM's own CO2 channel. Apollo 13's improvised cartridge kept this below 1 mmHg, and
        it is the channel that constrains how long a surface stay can be extended — a different
        constraint from the CSM's, because the LM's absorber is a cartridge rather than a bed.
  - id: eclss.lm_co2_pp_1h_avg_mmhg
    unit: mmHg
    layer: estimate
    precision: 0.1
    rate_hz: 0.1
    priority: P4
    range: [0, 3]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: [">3 sustained"]
    inputs: [eclss.lm_co2_pp_mmhg]
    event_class: alarm
    provenance:
      basis: chosen
      reason: >-
        NASA's one-hour-average ppCO2 limit of 3 mmHg, at the LM's own compartment. It is a separate
        channel for the reason the instantaneous one is: from undocking to docking the two
        atmospheres share no air, so an exposure average computed from the CSM's CO2 says nothing
        about the air a surface crew are breathing. **It did not exist until round 68**, and the gap
        was the sharpest kind — the exposure limit is the statistic that governs how long a surface
        stay can be extended, and it was published for the cabin the crew leave rather than the one
        they live in
  - id: eclss.lm_pp_o2_mmhg
    unit: mmHg
    layer: measurement
    precision: 0.1
    rate_hz: 0.5
    priority: P3
    inputs: [eclss.lm_cabin_pressure_psia]
    range: [236.02, 256.71]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<200 hypoxia", ">300 fire risk"]
    event_class: alarm
    provenance:
      basis: derived
      relation: >-
        as the CSM compartment, and by the same subtraction: 4.8-5.2 psia of *total* pressure less
        the 12.209 mmHg of water vapour and carbon dioxide the cabin model declares is **236.02 to
        256.71 mmHg** of oxygen. It read 248-269 — the total pressure band — and **four numeric
        declarations carried it**: this channel's `range`, the CSM's twin, and this compartment's
        hypoxia and fire-risk thresholds. Two prose entries in `points.yaml`, the CSM threshold's
        `point_units` and the domain file's own header comment said it too, and this entry's
        `relation` repeated the wrong derivation. **Eight places, one wrong subtraction**, which is
        what an un-recomputed derived value does when it is copied instead of calculated: each copy
        is a reader that cannot disagree with the others.

  - id: eclss.suit_loop_flow_cfm
    unit: ft3/min
    layer: measurement
    precision: 0.5
    rate_hz: 1
    priority: P3
    range: [32, 38]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<20"]
    event_class: alarm
    provenance:
      basis: historical
      source: >-
        `csm_ecs_study_guide.pdf` **PDF p. 39** (printed p. 3-9), section III, and the CSM's own suit
        compressor: "Compressor output is dependent on the mode of operation. In normal space
        operations, the operating compressor delivers approximately **35 cubic feet per minute** of
        suit gas at a pressure rise of 10 inches of water within the conditions of 4.93 psia and 80
        F. Under emergency operating conditions, the operating compressor delivers approximately
        **34.5 cubic feet per minute** suit gas at a pressure rise of 6.9 inches of water". The band
        is that design point with the width the earlier recommendation carried: the centre moved from
        30 to the published 35 and the half-width stayed 3, because the width is a judgement about
        normal variation and the centre is now a citation. **Conflict C-27** in
        `../integration/reconciliation/01-conflict-register.md` is the record of both ranges; the
        `<20` event below is apollo's either way
  - id: eclss.absorber_capacity_pct
    unit: "%"
    layer: estimate
    precision: 1
    rate_hz: 0.1
    priority: P4
    range: [20, 100]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<20", "predicted breakthrough <1 h"]
    inputs: [eclss.co2_pp_mmhg]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:93"
      note: >-
        capacity must be a percentage OF a named quantity, and the quantity is the CSM element's 72
        man-hour rating (vehicle.yaml#consumables). The note here used to read "the corpus never
        says of what (corpus-review.md §6)", which was true when it was written and stopped being
        true when `vehicle.yaml#consumables.co2_removal` landed with the ratings in it — a debt
        that outlived its own answer is worse than no note, because it tells the next reader to
        stop looking
  - id: eclss.lm_absorber_capacity_pct
    unit: "%"
    layer: estimate
    precision: 1
    rate_hz: 0.1
    priority: P4
    range: [20, 100]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<20", "predicted breakthrough <1 h"]
    inputs: [eclss.lm_co2_pp_mmhg]
    event_class: alarm
    provenance:
      basis: historical
      source: >-
        the LM's own absorber, as a percentage of its 41 man-hour primary cartridge
        (vehicle.yaml#consumables.co2_removal, NR and PSR). It is a separate channel for the same
        reason `eclss.lm_cabin_pressure_psia` is: from undocking to docking the two compartments
        share no air, so one capacity channel would have left the LM's absorber unobservable for
        exactly the phase in which the crew are breathing from it. The apollo event is the same
        <20 % because the threshold is a fraction of a rating, not a property of either cartridge
  - id: eclss.leak_rate_g_s
    unit: g/s
    layer: estimate
    precision: 0.01
    rate_hz: 0.2
    priority: P4
    range: [0, null]
    range_kind: scale
    events: ["sustained above configured threshold"]
    inputs: [eclss.cabin_pressure_psia, eclss.o2_supply_pressure_psi]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:94"
      note: "THE slow-leak channel; a fixed-point stock with quantum q cannot represent a flow below q/dt, which would delete this phenomenon silently (review-findings.md #1)"
  - id: eclss.cabin_regulator_state
    unit: "enum[primary,emergency,isolated,closed]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P3
    events: ["unexpected mode"]
    event_class: notification
    provenance:
      basis: apollo
      ref: "apollo_diode.md:95"
      note: >-
        `closed` is the fourth member and it was missing until the linter's state/channel binding
        caught it: `cabin_regulator_position` can take four values and the channel published
        three, so the vehicle could be in a configuration its own telemetry could not report. It
        is the most consequential of the four — a closed regulator is a cabin isolated from its
        supply, which is the configuration Apollo 13 flew after the tank failure and the one a
        crew reaches for when the leak is downstream of the regulator rather than in the cabin

thermal:

  - id: thermal.coolant_supply_c
    unit: degC
    layer: measurement
    precision: 0.1
    rate_hz: 2
    priority: P3
    range: [2.8, 7.2]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: [">10", "<1"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:101"
      note: "Apollo-anchored band; water-glycol leaving the evaporator was 37-45 F (apollo_diode.md:97)"
  - id: thermal.coolant_return_c
    unit: degC
    layer: measurement
    precision: 0.1
    rate_hz: 2
    priority: P3
    range: [5, 15]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: [">20"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:102"
  - id: thermal.primary_flow_l_min
    unit: L/min
    layer: measurement
    precision: 0.01
    rate_hz: 2
    priority: P3
    range: [1.3, 1.7]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<0.8", "zero flow"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:103"
      note: "around the Apollo order of ~24 gal/h"
  - id: thermal.pump_1_state
    unit: "enum[off,on,stalled]"
    layer: service
    precision: exact
    rate_hz: 2
    on_event: true
    priority: P3
    events: ["commanded-on but zero flow"]
    event_class: notification
    provenance:
      basis: apollo
      ref: "apollo_diode.md:104"
      note: "only publishable if the vehicle really has such a diagnostic; the more interesting pair is pump_commanded + pump_current + flow (apollo_diode.md:109)"
  - id: thermal.pump_1_commanded
    unit: bool
    layer: service
    precision: exact
    rate_hz: 2
    priority: P3
    provenance:
      basis: apollo
      ref: "apollo_diode.md:109"
  - id: thermal.pump_1_current_a
    unit: A
    layer: measurement
    precision: 0.05
    rate_hz: 2
    priority: P3
    range: [0, 8]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["current with no flow"]
    event_class: realised_by
    event_thresholds: [pump_no_flow]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:109"
      note: "the evidence pair that lets an agent infer a stall rather than read one"
  - id: thermal.avionics_plate_c
    unit: degC
    layer: measurement
    precision: 0.1
    rate_hz: 1
    priority: P3
    range: [10, 45]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: [">50"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:105"
  - id: thermal.comm_amp_c
    unit: degC
    layer: measurement
    precision: 0.1
    rate_hz: 1
    priority: P3
    range: [10, 55]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: [">60", "fast rise"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:106"
  - id: thermal.radiator_rejection_w
    unit: W
    layer: estimate
    precision: 10
    rate_hz: 0.2
    priority: P4
    range: [null, null]
    events: ["capacity < generated heat"]
    inputs: [thermal.coolant_supply_c, thermal.coolant_return_c, thermal.primary_flow_l_min]
    event_class: realised_by
    event_thresholds: [thermal_no_progress]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:107"
  # The `[id]` covers the zones apollo does not name: `csm_avionics`, `csm_service`, `lm_descent`
  # and `radiator`. The two **cabins** are excluded, and the exclusion is the fix for a
  # duplication the linter's `from` check surfaced: `thermal.zone_csm_cabin_t` and
  # `eclss.cabin_temp_c` were one cabin temperature published twice under two names, produced by
  # one state and read by two sets of thresholds. The reconciliation's oldest problem — two names
  # for one object — arriving somewhere new, and it survived because the two points named their
  # sources differently: one a state, the other a coupling node.
  #
  # The resolution follows vocabulary §3: apollo's name wins where apollo has one. Apollo names
  # the cabin temperature and does not name a zone family, so the cabins are
  # `eclss.cabin_temp_c` and `eclss.lm_cabin_temp_c`, and this family is what the *chosen*
  # six-zone decomposition needs for the zones apollo is silent about.
  - id: "thermal.zone_[id]_t_c"
    unit: degC
    layer: measurement
    precision: 0.1
    rate_hz: 1
    priority: P3
    range: [null, null]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    events: ["> configured limit"]
    event_class: alarm
    provenance:
      basis: chosen
      reason: "thermal_diode.md names zero points and only sensor classes (:165-181); a zone temperature is the minimum a thermal zone needs and the six-zone decomposition is supplied in vehicle.yaml"
  - id: thermal.loop_transport_c
    unit: degC
    layer: measurement
    precision: 0.1
    rate_hz: 1
    priority: P3
    range: [0, 30]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["> 20"]
    event_class: realised_by
    event_thresholds: [coolant_return_high]
    provenance:
      basis: chosen
      reason: "the temperature that has just arrived from the far end of the loop. It exists as its own channel because the transport delay is what separates 'the pump stalled just now' from 'the pump has been degrading for an hour' (review-findings.md #12), and a lumped network that mixes instantaneously cannot express the difference"
  - id: thermal.radiator_inlet_c
    unit: degC
    layer: measurement
    precision: 0.1
    rate_hz: 1
    priority: P3
    range: [15, 30]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["> 35"]
    event_class: alarm
    provenance:
      basis: historical
      source: "TN D-6718 and NR: radiator inlet 73-75 F = 22.8-23.9 C in lunar orbit"
  - id: thermal.evaporator_rejection_w
    unit: W
    layer: estimate
    precision: 10
    rate_hz: 0.2
    priority: P4
    range: [0, 2345]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["saturated at rated capacity"]
    inputs: [thermal.coolant_supply_c, res.water_cooling_kg]
    event_class: realised_by
    event_thresholds: [thermal_no_progress]
    provenance:
      basis: historical
      source: "NR: the CSM evaporator rejects about 8,000 Btu/hr = 2,345 W and consumes water to do it. That consumption is why the thermal domain and the water stock are coupled rather than adjacent"
  - id: "thermal.heater_[bank]_duty"
    unit: "%"
    layer: service
    precision: 1
    rate_hz: 1
    priority: P3
    range: [0, 100]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: scale
    events: ["duty above zero with the zone above its limit"]
    event_class: alarm
    provenance:
      basis: chosen
      reason: "thermal_diode.md:191-207 makes heater banks the TCS's main actuation and its :765-772 hard-limit table includes 'do not blindly command heating and cooling simultaneously'. Neither is checkable without a commanded-duty channel"
  - id: "thermal.pump_[n]_speed_rpm"
    unit: rpm
    layer: measurement
    precision: 10
    rate_hz: 2
    priority: P3
    range: [0, 12000]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["commanded on and speed zero", "speed falling with constant command"]
    event_class: realised_by
    event_thresholds: [flow_low, pump_no_flow]
    provenance:
      basis: chosen
      reason: "the pump's spin-up lag is one of the two first-order lags on the flagship cycle, and a flow channel alone cannot distinguish a pump that is slowing from a loop that is blocked"

gnc:

  - id: "gnc.attitude_q[0..3]"
    unit: dimensionless
    layer: estimate
    precision: 1.0e-5
    rate_hz: 10
    priority: P2
    range: [null, null]
    events: ["invalid norm", "estimate unavailable"]
    inputs: [gnc.body_rate_xyz_deg_s, gnc.imu_alignment_error_deg]
    event_class: realised_by
    event_thresholds: [nav_integrity_degraded]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:117"
      note: "normalised quaternion; gnc_diode.md:368 requires rejecting non-normalised quaternions and gives no tolerance, so the tolerance is declared here or the check is unimplementable"
  - id: gnc.body_rate_xyz_deg_s
    unit: deg/s
    layer: measurement
    precision: 0.001
    rate_hz: 10
    priority: P2
    range: [-0.5, 0.5]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["outside current mode limits"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:118"
  - id: gnc.position_xyz_km
    unit: km
    layer: estimate
    precision: 0.01
    rate_hz: 2
    priority: P3
    range: [null, null]
    events: ["covariance invalid", "source invalid"]
    inputs: [gnc.velocity_xyz_m_s, gnc.radar_altitude_m, gnc.nav_position_sigma_m]
    event_class: realised_by
    event_thresholds: [estimator_divergence]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:119"
      note: "mission dependent in apollo; supplied by mission.yaml"
  - id: gnc.velocity_xyz_m_s
    unit: m/s
    layer: estimate
    precision: 0.01
    rate_hz: 2
    priority: P3
    range: [null, null]
    events: ["source invalid"]
    event_class: realised_by
    event_thresholds: [nav_integrity_degraded]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:120"
  - id: gnc.nav_position_sigma_m
    unit: m
    layer: estimate
    precision: 1
    rate_hz: 1
    priority: P3
    range: [null, null]
    events: ["> phase-specific tolerance"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:121"
      note: "the channel that makes IMU degradation visible before it matters"
  - id: gnc.nav_velocity_sigma_m_s
    unit: m/s
    layer: estimate
    precision: 0.001
    rate_hz: 1
    priority: P3
    range: [null, null]
    events: ["> phase-specific tolerance"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:122"
  - id: gnc.imu_alignment_error_deg
    unit: deg
    layer: estimate
    precision: 0.001
    rate_hz: 1
    priority: P3
    range: [0, 0.2]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: [">0.5"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:123"
      note: "gnc_diode.md has bias states but no alignment-error channel and no alignment function (:314 has only REQUEST_NAV_REACQUIRE)"
  - id: gnc.radar_altitude_m
    unit: m
    layer: measurement
    precision: 0.5
    rate_hz: 5
    priority: P3
    range: [0, 15000]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["invalid", "dropout", "disagreement"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:124"
  - id: gnc.radar_range_rate_m_s
    unit: m/s
    layer: measurement
    precision: 0.05
    rate_hz: 5
    priority: P3
    range: [null, null]
    events: ["implausible jump"]
    event_class: realised_by
    event_thresholds: [innovation_rejected]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:125"
  - id: gnc.guidance_mode
    unit: "enum[coast,burn,landing,rendezvous,alignment,free_drift]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P2
    events: ["unexpected transition"]
    event_class: notification
    provenance:
      basis: apollo
      ref: "apollo_diode.md:126"
      note: "gnc_diode.md:1341-1351 has no lunar phases; the enum is apollo's"
  - id: gnc.estimator_rejection_reason
    unit: "enum[none,innovation,stale,out_of_range,redundancy]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P3
    events: ["any rejection"]
    event_class: alarm
    provenance:
      basis: chosen
      reason: "gnc_diode.md:511-512 separates a datum's quality from whether the estimator used it; without this channel an agent cannot tell 'the sensor is bad' from 'the filter is ignoring a good sensor'"

  # ------------------------------------------------------------------------------------
  # The navigation-integrity ladder, and the two states behind it. `gnc_diode.md:666-691` is
  # the source, and its own summary of why the ladder is a channel rather than a number is
  # the best sentence in the document: **"a high covariance can therefore be an operational
  # state transition, not merely a number in telemetry."**
  #
  # The vehicle publishes `gnc.nav_position_sigma_m` and has since the registry was written —
  # and a sigma alone cannot say whether the vehicle is navigating, coasting on gyros, or lost.
  # Those are three different vehicles with three different correct responses, and F-10's
  # chain turns on exactly that ambiguity.
  # ------------------------------------------------------------------------------------

  - id: gnc.nav_integrity
    unit: "enum[nominal,degraded,coasting,invalid,reacquire]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P0
    max_decision_age_ms: 1000
    events: ["integrity change"]
    event_class: alarm
    provenance:
      basis: historical
      source: "gnc_diode.md:666-691 — the navigation-integrity state machine, NOMINAL / DEGRADED / COASTING / INVALID / REACQUIRE"
      note: >-
        the ladder, published because every other GNC channel describes a *quantity* and this one
        describes whether the quantities mean anything. `coasting` is the value that earns the
        channel: no absolute update, the estimator propagating on gyros alone, still flying and
        no longer being corrected — a vehicle that is fine now and will not be in twenty minutes,
        which no sigma reports as a distinct condition. `reacquire` is separate from `invalid` for
        the same reason `degraded` is separate from `nominal`: the vehicle is doing something
        about it, and a fleet that cannot see the difference will intervene in a recovery that is
        already under way
  - id: "gnc.gyro_bias_xyz_deg_s"
    unit: deg/s
    layer: estimate
    precision: 1e-05
    rate_hz: 1
    priority: P3
    events: ["bias growing"]
    event_class: alarm
    provenance:
      basis: historical
      source: "gnc_diode.md:815-825 — the error-state vector includes `b_g`, and :825 notes WMAP estimated attitude and gyro bias errors together"
      note: >-
        the estimated gyro bias, which is the quantity that separates the two ways a rate
        measurement can be wrong. A gyro with a bias reports a rate the vehicle is not
        experiencing, and the filter estimates the bias by comparing the gyro against everything
        else — so a *growing* bias estimate is the instrument drifting and a *steady* one is the
        vehicle having been correctly calibrated. The channel matters most in the state this
        domain adds: a coasting vehicle is one whose only measurement is the gyro, and a bias
        that was tolerable with star sightings is not tolerable without them
  - id: gnc.maneuver_state
    unit: "enum[idle,target_loaded,plan_valid,plan_invalid,armed,executing,verifying,complete]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P1
    provenance:
      basis: historical
      source: "gnc_diode.md:628-663 — the maneuver state machine"
      note: >-
        where a maneuver is in its own lifecycle, and it is a *fourth* state machine on a vehicle
        that already has the canonical command chain (V-02), the propulsion engines' machines and
        the mission posture machine. It is worth the duplication because it answers a question
        none of them can: `plan_valid` and `plan_invalid` are the outcome of the trajectory
        generator's feasibility evaluation (`gnc_diode.md:753` — a segment is marked valid only
        after being checked against velocity, acceleration, jerk, pointing, keep-out and
        actuator-authority limits), and a burn that is *requested* and *not flyable* is a
        different situation from a burn that is requested and merely waiting. The propulsion
        domain's guards ask whether the engine can do it; this asks whether the trajectory can
  - id: gnc.trajectory_residual_m
    unit: m
    layer: estimate
    precision: 0.1
    rate_hz: 1
    priority: P2
    provenance:
      basis: historical
      source: "gnc_diode.md:658-660 — VERIFYING, whose two exits are 'terminal tolerances pass' and 'correctable residual'"
      note: >-
        how far the achieved state is from the planned one at the end of a maneuver, and it is
        the only channel on the vehicle that reports an outcome rather than a condition. The
        state machine's two exits are the interesting part: a residual inside tolerance is
        `complete`, and a residual outside it *but correctable* returns to planning rather than
        failing. Publishing the residual is what lets a fleet tell a burn that went well from one
        that went well enough, which is the difference between a mission that has margin left and
        one that is spending it
  - id: "gnc.coast_elapsed_s"
    unit: s
    layer: estimate
    precision: 1
    rate_hz: 1
    priority: P2
    max_decision_age_ms: 1000
    events: ["coast limit approaching"]
    event_class: alarm
    provenance:
      basis: historical
      source: "gnc_diode.md:684-686 — COASTING, whose exits are a validated reacquisition and 'coast limit / covariance limit'"
      note: >-
        how long the estimator has been propagating without an absolute update. It is the clock
        on `gnc.nav_integrity`'s `coasting` state and the input to its limit, and it is published
        rather than left to be inferred because the inference is exactly what a fleet gets wrong:
        a coasting vehicle looks completely normal — the attitude is right, the rates are right,
        the sigma is growing slowly — and the only thing that says how much time is left is a
        number nobody can compute from the other channels. Apollo 13's crew flew a large part of
        a mission on a platform that had not been aligned since a burn, and the elapsed time was
        the fact that governed what they could still do

