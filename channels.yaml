    rate_hz: 1
    on_event: true
    priority: P1
    events: ["assert", "clear", "latch"]
    event_class: alarm
    provenance:
      basis: historical
      source: >-
        crew_diode.md:393-445's alert lifecycle, adopted at simulator-design.md:544-550. It is a
        channel rather than an internal state because acknowledgement moves it and does not clear
        it: a fleet that cannot see which alerts are acknowledged cannot distinguish an alarm
        somebody is working from one nobody has noticed.
  - id: "cw.decision_output_[alert]"
    unit: "enum[NONE,ADVISORY_ONLY,CREW_ACTION_REQUIRED,REQUEST_SAFE_ACTION]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P1
    events: ["any transition away from NONE"]
    event_class: notification
    provenance:
      basis: historical
      source: >-
        crew_diode.md:470-474, published as a channel because the caution/warning system's output
        is advisory and an agent has to be able to tell an advisory from a request. `NONE` is the
        value the design's summary omits (corpus-review.md §8) and it is the one that keeps an
        ordinary state from reading as an advisory.
  - id: cw.acknowledged
    unit: "list[alarm_id]"
    layer: service
    precision: exact
    rate_hz: 0
    on_event: true
    max_decision_age_ms: 2000
    priority: P1
    events: ["acknowledged", "cleared"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:223"
      note: >-
        acknowledgement is not a clear predicate (crew_diode.md:433), and it declares a 2000 ms
        heartbeat for the same reason `structure.stage_state` does: the list changes only when a
        person presses a button, so its published form is silent by default. Without a heartbeat
        the `ack_is_not_clear` guard cannot tell an unacknowledged alarm from a publisher that
        has stopped, and the two want opposite responses — one is a crew who have not looked at
        the panel, the other is a panel that is no longer reporting.
  - id: controls.switches
    unit: "map[switch_id,bool]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P3
    provenance:
      basis: apollo
      ref: "apollo_diode.md:224"
      note: "crew-only surface; the GM reads it, agents observe it"
  - id: controls.breakers
    unit: "map[breaker_id,enum[in,out,tripped]]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P3
    provenance:
      basis: apollo
      ref: "apollo_diode.md:225"
  - id: crew.available
    unit: bool
    layer: service
    precision: exact
    rate_hz: 0.2
    priority: P4
    provenance:
      basis: apollo
      ref: "apollo_diode.md:226"
  - id: crew.workload
    unit: "enum[low,medium,high]"
    layer: estimate
    precision: exact
    rate_hz: 0.1
    priority: P4
    provenance:
      basis: apollo
      ref: "apollo_diode.md:227"
      note: "coarse on purpose; no synthetic psychology"
  - id: "crew.location_[id]"
    unit: "enum[csm_commander,csm_navigator,csm_lower_equipment_bay,lm_commander,lm_pilot,tunnel,surface_eva]"
    layer: service
    precision: exact
    rate_hz: 0.05
    on_event: true
    priority: P4
    provenance:
      basis: chosen
      reason: >-
        apollo publishes what a crew member can *do* (`crew.available`, :226) and how loaded
        they are (`crew.workload`, :227) and never where they are; but `crew_positions` in this
        file makes the position the third argument of the perception function
        (`simulator-design.md:392-403`, D-06), so who is at which station is the index into the
        bound rather than decoration. Without it a fleet cannot tell whether a report came from
        the seat with the cabin panel or from the tunnel, and that distinction is most of what a
        crew report means. The enum's members are exactly the `crew_positions` ids, which the
        linter enforces, because a position nobody can be in and a person with no position are
        the same defect seen from two sides. Rate is on-event and slow: a crew member moves
        between modules a few times an hour, and the channel exists to make a report's geometry
        resolvable rather than to track motion

# --------------------------------------------------------------------------------------
# Mission-level state. apollo publishes four fields of it inside every frame — `seq`,
# `met_s`, `phase` and the `quality` map (apollo_diode.md:600-627) — and the phase is the
# one every verb's `allowed_phases` is written against, so it is odd that it had no entry
# in this registry: thirteen domains gate on a quantity with no published form.
#
# `mission_diode.md` supplies the half that was missing. C-22 fixed the phase *set* and the
# phase *durations*; it said nothing about the execution posture, and the posture is the
# axis an abort lives on. The document's state machine (:300-347) is INIT, SAFE, STANDBY,
# PREPARE, EXECUTE, HOLD, RECOVERY, COMPLETE, ABORTING, ABORTED, and two of its invariants
# are the reason the axis has to exist at all:
#
#   Invariant E: AbortLatched => no hazardous action is permitted.
#   Invariant J: ABORTED is terminal; it never returns to EXECUTE without a new mission.
#
# Invariant J is the one that bites. A vehicle whose only terminal states are "the phase
# ladder ran out" has no way to say *this mission is over and did not succeed* — and a
# post-abort vehicle that looks like a vehicle between phases is a vehicle a fleet will try
# to fly again.
# --------------------------------------------------------------------------------------

mission:

  - id: mission.met_s
    unit: s
    layer: service
    precision: 0.001
    rate_hz: 1
    priority: P2
    # The one channel the `mission_time` convention is about: monotonic, and it cannot jump
    # backward. The citation is what says where that rule is declared — the plant's MET is an
    # integer tick count from the epoch, so monotonicity is a property of the counter rather than a
    # check on the values, and saying so is the declaration's job rather than a reader's guess.
    mission_time_source: "vehicle.yaml:conventions.mission_time"
    provenance:
      basis: apollo
      ref: "apollo_diode.md:605"
      note: >-
        mission elapsed time from `met_epoch_utc`, which is the only clock the vehicle's own
        results are stamped with (apollo_diode.md:227, diode-contract.md:226-228). It is
        published as a number rather than as a formatted string because every timestamp in the
        record is derived from it, and a formatted time is a presentation of a quantity rather
        than the quantity.
  - id: mission.phase
    unit: "enum[translunar_coast,lunar_orbit,descent,surface,ascent_rendezvous,lunar_orbit_docked,transearth_coast,entry]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P0
    max_decision_age_ms: 1000
    events: ["phase change"]
    event_class: frame
    provenance:
      basis: apollo
      ref: "apollo_diode.md:609"
      note: >-
        apollo's `phase` field, whose value set was authored in `mission.yaml` (C-22). P0 and
        explicitly aged because the phase is a term in the authorization predicate of *every*
        verb on the vehicle: `allowed_phases` is checked at effect time, so a stale phase is
        not a stale reading, it is an action taken in the wrong part of the mission. The
        members are the phase ids verbatim, and the linter refuses a mismatch — the same
        discipline the crew station vocabulary gets, for the same reason.
  - id: mission.phase_entry_seq
    unit: count
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P2
    provenance:
      basis: historical
      source: "mission_diode.md:214 — `mission.phase_entry_seq`, a state entry sequence"
      note: >-
        which entry into the current phase this is, so that a fleet returning after a telemetry
        gap can tell "still in descent" from "left descent and came back". The document's
        requirement (:168) is that a returning agent must distinguish state evolution from a
        static snapshot, and a phase name alone cannot: the LM leaves `lunar_orbit` for
        `descent` once, but a mission that has been held and resumed has re-entered phases, and
        a bare enum reads the same either way.
  - id: mission.posture
    unit: "enum[init,safe,standby,prepare,execute,hold,recovery,complete,aborting,aborted]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P0
    max_decision_age_ms: 1000
    events: ["posture change"]
    event_class: notification
    provenance:
      basis: historical
      source: "mission_diode.md:300-347 — the formal mission state machine S = {INIT, SAFE, STANDBY, PREPARE, EXECUTE, HOLD, RECOVERY, COMPLETE, ABORTING, ABORTED}"
      note: >-
        where the mission is in its *execution* rather than in its timeline. The two axes are
        independent on purpose: `phase` says the vehicle is in descent, `posture` says whether
        the mission is executing, held, aborting or over, and a descent that has been held for
        a fault is a different situation from one that is running — which a phase enum cannot
        express and a fleet must be able to see. `complete` and `aborted` are both terminal and
        they are different states on purpose (mission_diode.md:309): a vehicle that succeeded
        and a vehicle that was abandoned have the same hardware and opposite meanings.
  - id: mission.posture_entry_seq
    unit: count
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P2
    provenance:
      basis: historical
      source: "mission_diode.md:214, generalised from the phase entry sequence to the posture"
      note: "how many times the mission has changed posture, which is how a hold-and-resume cycle becomes visible rather than invisible."
  - id: mission.abort_latched
    unit: bool
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P0
    max_decision_age_ms: 1000
    events: ["abort latched"]
    event_class: realised_by
    event_thresholds: [emergency_assert]
    provenance:
      basis: historical
      source: "mission_diode.md:215 and :1303 — `safety.abort_latched`, and invariant E: AbortLatched => no hazardous action is permitted"
      note: >-
        latched, published, and dominant. Invariant E makes it the one condition that overrides
        every other transition, and the point of publishing it is that a fleet which cannot see
        the latch will read every subsequent refusal as a fault in the vehicle rather than as
        the vehicle protecting itself. It is deliberately *not* clearable through any agent
        verb: the abort latch is set by the safety kernel and cleared by a new mission, which
        is invariant J and the reason `abort_latched` is not in any command's argument schema.

# --------------------------------------------------------------------------------------
# The GM/crew sensor. Crew are a query-capable instrument, and their reply is bounded by
# what a person standing in a module with specific readouts could perceive — not by what
# the GM knows (simulator-design.md:392-403). `perceivable` lists the channels a crew
# member in that position can honestly report on; it is the missing third argument of
# review-findings.md #4's perception function, and the design's claim that crew_diode
# supplies it is wrong (corpus-review.md §8, conflict register D-06).
# --------------------------------------------------------------------------------------
crew_positions:

  # The channel-level perception bound: which published channels a crew member standing in a
  # position could read out loud. The *display* contract is richer — panels, displayed
  # precisions, procedures — and lives in `domains/crew/components.yaml#display_contract`,
  # whose readouts the linter cross-checks against these lists. Two artifacts on purpose:
  # this one says what is perceptible, that one says what an instrument in front of a person
  # actually shows, and the difference between them is where a leak in a crew line would hide.

  - id: csm_commander
    perceivable: [eclss.cabin_pressure_psia, eclss.cabin_temp_c, eclss.co2_pp_mmhg,
                  eclss.pp_o2_mmhg, eclss.suit_loop_flow_cfm, structure.cabin_dp_psi,
                  cw.master_alarm, cw.active_lights, controls.switches, controls.breakers,
                  power.dc_bus_a_v, power.bus_tie_state, structure.hatch_state]
    not_perceivable: [thermal.avionics_plate_c, thermal.comm_amp_c, prop.chamber_pressure_pct,
                      power.load_margin_w, eclss.lm_cabin_pressure_psia]
    note: >-
      the left seat, with the main display panel and the cabin controls in reach. The cabin
      temperature here is the **CSM's** — `eclss.cabin_temp_c` and `eclss.lm_cabin_temp_c` are
      two channels because they are two compartments, and a crew member reads the one they are
      sitting in. Can hear a
      bang, smell a smell, feel a draught, notice frost on a panel; can read the bus voltage
      off the panel and cannot read a coldplate temperature at all.
  - id: csm_navigator
    perceivable: [gnc.guidance_mode, "gnc.attitude_q[0..3]", gnc.body_rate_xyz_deg_s,
                  gnc.nav_position_sigma_m, gnc.radar_altitude_m, avionics.computer_mode,
                  avionics.program_alarm_code, cw.master_alarm, cw.active_lights,
                  controls.switches, controls.breakers]
    not_perceivable: [eclss.cabin_pressure_psia, thermal.avionics_plate_c,
                      prop.chamber_pressure_pct, power.battery_soc_pct]
    note: >-
      the right seat, with the guidance and navigation displays. `apollo_diode.md:1044` makes
      the LM pilot an engineering officer monitoring both spacecraft, and on this vehicle the
      right seat is the one that can see the state vector and cannot see the cabin.
  - id: csm_lower_equipment_bay
    perceivable: [controls.breakers, controls.switches, power.dc_bus_a_v, power.dc_bus_b_v,
                  "power.lcl_[n]_state", cw.active_lights, structure.hatch_state]
    not_perceivable: [gnc.guidance_mode, eclss.co2_pp_mmhg, thermal.comm_amp_c,
                      comm.snr_db]
    note: >-
      below the floor, where the breakers are. A crew member here can act on the electrical
      system directly and cannot see any of the displays the other two seats are reading —
      which is the geometry that makes a two-person diagnosis different from a one-person one.
  - id: lm_commander
    perceivable: [eclss.lm_cabin_pressure_psia, eclss.lm_cabin_temp_c, eclss.lm_co2_pp_mmhg,
                  eclss.lm_pp_o2_mmhg, eclss.suit_loop_flow_cfm, structure.hatch_state,
                  structure.docking_latches, cw.master_alarm, cw.active_lights,
                  controls.switches, controls.breakers, prop.dps_throttle_pct,
                  prop.chamber_pressure_pct, gnc.radar_altitude_m, structure.accel_xyz_g]
    not_perceivable: [power.dc_bus_a_v, thermal.comm_amp_c, prop.pressurant_pressure_psi,
                      eclss.cabin_pressure_psia]
    note: >-
      the LM commander's position: the descent and landing displays. Apollo 11's commander flew
      the final approach by hand with the radar and the throttle in front of him, and the
      not-perceivable list is the important half — the CSM's cabin pressure is another
      vehicle's.
  - id: lm_pilot
    perceivable: [eclss.lm_cabin_pressure_psia, eclss.lm_co2_pp_mmhg, eclss.suit_loop_flow_cfm,
                  gnc.nav_position_sigma_m, gnc.radar_range_rate_m_s,
                  avionics.exec_margin_pct, avionics.program_alarm_code, cw.master_alarm,
                  cw.active_lights, controls.switches]
    not_perceivable: [structure.accel_xyz_g, prop.dps_throttle_pct, power.dc_bus_a_v,
                      comm.snr_db]
    note: >-
      the LM pilot's position: systems and navigation, callouts to the commander, and no access
      to the flight controls. `apollo_diode.md:1044` is explicit that the pilot kept the
      commander informed about systems status and navigational information.
  - id: tunnel
    perceivable: [structure.hatch_state, structure.docking_latches, structure.cabin_dp_psi,
                  cw.active_lights]
    not_perceivable: [thermal.coolant_supply_c, power.battery_soc_pct, eclss.co2_pp_mmhg]
    note: >-
      a transit position, not a station: nothing is readable here that is not a discrete, and a
      crew member in the tunnel is a sensor with almost no coverage exactly when they are
      between two vehicles.
  - id: surface_eva
    perceivable: [eclss.suit_loop_flow_cfm, cw.master_alarm, structure.hatch_state,
                  structure.accel_xyz_g]
    not_perceivable: [eclss.lm_cabin_pressure_psia, thermal.coolant_supply_c,
                      prop.chamber_pressure_pct, comm.snr_db]
    note: >-
      outside, on a suit, with no displays at all. The suit's own flow and the alarm light are
      the entire instrumentation, and everything else the crew member reports is a human
      observation — which is the coverage that no channel on this vehicle provides.

open_debts:
  - "**`service` covers two things a fault treats differently.** The layer holds both a *decision* (`rcs.mode`, `power.load_shed_class`, `controls.switches`: something the crew or an agent set, which no physical mechanism writes) and a *conclusion* (`avionics.sensor_health_[class]`, `avionics.redundancy_disagreement`, `avionics.computer_mode`: something the vehicle computed, which a fault moves immediately), and the split across the fault line is what shows it: **most of the registry's `service` channels are perturbed and a quarter of them are not.** The counts are `coverage` above rather than here, because they were here and two of the three were wrong. The epistemic mapping is right that both are \"an A with a different subject\" for the contract's purposes, and the contract is not where the difference bites; fault injection is. What would separate them is a field — `origin: commanded | derived` — and until it exists the only way to say a channel is untouchable by any fault is to list it in a `coverage.unperturbed`, which is what all eleven domains now do."
  - "**Half of the LM's atmosphere registry gap is closed; the other half is now a question rather than a list.** `eclss.lm_absorber_capacity_pct` exists as of round 42, because the vehicle turned out to have two absorbers sharing one counter and the LM's was unobservable — the counter split (`coupling.yaml:absorber_capacity_lm`) and the channel followed it. `lm_cabin_regulator_state` still does not exist, and the reason has changed. It is no longer that the registry has no room: it is that the corpus publishes ONE `cabin_regulator_state` (apollo_diode.md:95) with no vehicle qualifier and says nothing about how the LM's pressure control is built — a two-position regulator like the CSM's, a relief valve, or a continuous bleed. ECL-13, ECL-14 and ECL-19 are injectable without it, because their effect on pressure and ppO2 is observable; what is missing is the easy diagnosis, so on the LM a regulator fault has to be inferred from its signature where the CSM reads a mode. Adding the channel now would mean inventing the mechanism; the question that closes it is which of the three the LM's cabin pressure control is."
  - "**`range_kind` is declared and the check it enables is written; what remains is the judgement
    inside it.** 58 channels carry the field — 43 `band`, 15 `scale` — and the values were
    assigned by evidence rather than by taste: a range with an alarm strictly inside it cannot be a
    band, so it is a scale. **That rule reads the alarms; a second one reads the values**, and round
    33 found the case that passed the first and failed the second: `prop.dps_throttle_pct` declared
    the band `[10, 60]` while its own state's declared starting value is 0 — the actuator parks at
    its closed stop — so the band reported a healthy parked engine as out of range, and it is a scale
    now. What neither rule can see is a channel whose range is a band *and wrong*, and one was found
    that way. `thermal.zone_[id]_t_c` declared `[5, 40]` while four of its thresholds
    asserted inside it and `lm_descent_freeze` asserted below minus five — because the channel is a
    six-zone template and no single band describes six zones: the cabins live at 10-30 and the
    descent stage freezes below zero. A template channel's per-instance bands are its thresholds'
    business, and the range is unbounded now to say so. The judgement still owed is the 58
    assignments themselves: they are derived, they are right as far as the evidence reaches, and a
    reader who disagrees with one is disagreeing with a derivation rather than with an author."
  - "A channel template's instantiations are inferred rather than declared. `ChannelIndex` compiles `thermal.zone_[id]_t_c` to a regex whose wildcard is unbounded, so `thermal.zone_1_true_t_c` resolves to it — the wildcard absorbs `1_true` and the literal `_t_c` then matches. The same over-permissiveness makes `power.lcl_1_old_state` resolve to `power.lcl_[n]_state`, which means every \"is this a registered channel?\" check in the linter is weaker than it reads. Bounding the wildcard is not the fix and cannot be: `res.recon_[resource]_kg` has to match `water_cooling`, so a placeholder may contain underscores, and then `[id]` matching `1_true` is indistinguishable from `[id]` matching `csm_cabin`. What would fix it is each registry entry naming the values its placeholders take — which turns a template from a pattern into an enumeration, and is a decision about the registry's shape rather than a patch. Found by a `not_published` entry that was correctly withheld and wrongly reported as registered."
  - "Precision and rate for every channel marked chosen or derived must be confirmed against the plant once it exists; apollo's values are adopted verbatim and need no confirmation."
  - "No channel yet carries the crew's own speech; whether dialogue is a channel at all is D-07 and is John's call."
  - "gnc.position_xyz_km and gnc.velocity_xyz_m_s are published at 2 Hz with 0.01 km precision, but the initial state they start from is not set: mission.yaml owes a parking-orbit or post-TLI position and velocity in EARTH_J2000, and a perilune for the descent phase."
  - "structure.docking_latches is declared a count; it needs the actual latch count per docking interface or the F-15 and rendezvous chains cannot distinguish a partial dock from a full one."

# --------------------------------------------------------------------------------------
# The registry's coverage, as data rather than as the sentence it used to be. The claim
# below was prose in `open_debts` and two of its three numbers had drifted — it said
# "Twelve of the 22" when fifteen of twenty is what the policy says, and it said faults
# perturb 117 `layer: service` channels when they perturb 42. Nothing read it, so nothing
# could notice, which is the folder's recurring finding arriving at its own registry.
#
# Prose cannot be checked, so the numbers move here and `check_layer_coverage` compares
# each one to the policy. The `open_debts` entry keeps the reasoning and drops the counts.
# --------------------------------------------------------------------------------------
coverage:
  # How many registered channels no fault in any domain perturbs, and the layer split on
  # both sides of that line. `service` is the layer that made the claim worth writing: it
  # holds both a *decision* (`rcs.mode`: something the crew or an agent set, which no
  # physical mechanism writes) and a *conclusion* (`avionics.computer_mode`: something the
  # vehicle computed, which a fault moves immediately), so a third of it is untouchable and
  # two thirds of it is the first thing a fault moves.
  unperturbed: 20
  unperturbed_service_layer: 15
  perturbed_service_layer: 42
  provenance:
    basis: derived
    relation: "counted over `channels.yaml`'s registered ids against every `perturbs` list in the eleven `domains/*/fault_policy.yaml`. Exact id matching, which is also the rule `check_fault_coverage` uses per domain: a fault that names a template perturbs the template, and a fault that names one instance of a template is a fault that named a channel this registry does not have"
    note: "the third number is the one that had drifted furthest — 117 against an actual 42 — and it drifted in the direction that made the argument look stronger. The `service` layer is 57 channels of the registry's 148, so 'so are 117 of the ones faults do perturb' was never arithmetically possible; a count with no reader does not have to be plausible"
