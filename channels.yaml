    range_kind: scale
    events: ["20", "10", "5"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:140"
  - id: prop.accumulated_dv_m_s
    unit: m/s
    layer: estimate
    precision: 0.01
    rate_hz: 10
    priority: P2
    range: [0, null]
    range_kind: scale
    events: ["burn cutoff target reached", "divergence from target"]
    inputs: [structure.accel_xyz_g, prop.thrust_pct_estimated]
    event_class: realised_by
    event_thresholds: [thrust_discrepancy]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:141"
      note: "C-12: mps cuts off on duration, plan or GNC request and never accumulates dv, so this channel would have no producer without adding the cutoff path"
  - id: prop.sps_burn_count
    unit: count
    layer: service
    precision: 1
    rate_hz: 0.2
    priority: P3
    range: [0, 50]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["> 40 of the 50 qualified restarts"]
    event_class: alarm
    provenance:
      basis: historical
      source: "the AJ10-137 report: the SPS was qualified for 50 restarts and Apollo 11 used 5. A count against a qualified life is a resource with a hard limit, which is what turns 'we can fix this with a burn' into a decision with a price"
  - id: prop.dps_throttle_pct
    unit: "%"
    layer: service
    precision: 0.5
    rate_hz: 10
    priority: P2
    range: [0, 100]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: scale
    events: ["commanded into the 65-92.5 % non-operating region"]
    event_class: alarm
    provenance:
      basis: historical
      source: >-
        the DPS experience report: 10.5 % to 92.5 % with 65-92.5 % a NON-OPERATING region. **That is
        an operating band and this is not a band**: the actuator parks at its closed stop, 0 %,
        whenever the engine is off — which is where the state's declared `initial` is, and what round
        33's check found. A band that excludes the vehicle's own starting value reports a healthy
        parked engine as out of range, so the range is the full percentage scale and the *operating*
        band stays where it belongs:
        `domains/propulsion/components.yaml#components[dps].operating_band_pct` and
        `non_operating_band_pct`, which the event above is judged against
  - id: prop.cutoff_mode
    unit: "enum[duration,plan,gnc_request,dv_target,abort,depletion]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P2
    events: ["abort", "depletion"]
    event_class: notification
    provenance:
      basis: apollo
      ref: "apollo_diode.md:141"
      note: "apollo publishes accumulated_dv_m_s with a 'burn cutoff target / divergence' event, which requires a cutoff that is by delta-v. main_propulsion_diode.md:645 gives only duration, plan and GNC request, so this channel is where the fourth trigger becomes visible — and it is the one a fleet will reach for when a burn is going wrong"
  - id: prop.leak_state
    unit: "enum[nominal,suspect,corroborating,confirmed,isolated,uncontained]"
    layer: service
    precision: exact
    rate_hz: 0.5
    on_event: true
    priority: P3
    events: ["leak confirmed"]
    event_class: alarm
    provenance:
      basis: chosen
      reason: "main_propulsion_diode.md:695-702's evidence-counting leak FSM is a genuine addition to apollo: it distinguishes 'one sensor said something' from 'three agree', which is exactly the corroboration the RCS pressure-switch chain needs (apollo_diode.md:333)"

rcs:

  - id: rcs.mode
    unit: "enum[auto,manual,free_drift]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P2
    events: ["unexpected mode"]
    event_class: notification
    provenance:
      basis: apollo
      ref: "apollo_diode.md:147"
      note: "C-16: rcs_diode.md:365 has ATT_HOLD/TRACK/FREE_DRIFT and no AUTO or MANUAL at all"
  - id: "rcs.quad_[a-d]_feed_pressure_pct"
    unit: "% nominal"
    layer: measurement
    precision: 0.2
    rate_hz: 2
    priority: P3
    range: [95, 105]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<90"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:148"
      note: "C-17: rcs_diode.md:242 uses Pa absolute and names no quads"
  - id: "rcs.thruster_[n]_valve"
    unit: bool
    layer: service
    precision: exact
    rate_hz: 10
    priority: P2
    events: ["stuck-on signature", "stuck-off signature"]
    event_class: realised_by
    event_thresholds: [rcs_uncommanded_rate]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:149"
  - id: "rcs.thruster_[n]_pressure_switch"
    unit: bool
    layer: measurement
    precision: exact
    rate_hz: 10
    priority: P2
    events: ["disagrees with acceleration"]
    event_class: realised_by
    event_thresholds: [rcs_uncommanded_rate]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:150"
      note: "a bad switch must not read as a failed thruster (apollo_diode.md:143)"
  - id: rcs.propellant_remaining_pct
    unit: "%"
    layer: estimate
    precision: 0.1
    rate_hz: 0.5
    priority: P4
    range: [0, 100]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: scale
    events: ["25", "10"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:151"
  - id: rcs.total_impulse_ns
    unit: N*s
    layer: estimate
    precision: 1
    rate_hz: 1
    priority: P3
    range: [0, null]
    range_kind: scale
    events: ["excessive use rate"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:152"
      note: "monotonically rising; rcs_diode.md:247 matches it exactly"
  - id: rcs.deadband_deg
    unit: deg
    layer: measurement
    precision: 0.01
    rate_hz: 1
    priority: P3
    events: ["configuration change"]
    on_event: true
    event_class: notification
    provenance:
      basis: apollo
      ref: "apollo_diode.md:153"
      note: "keep both this telemetry and rcs_diode.md:377's SET_CONTROL_PROFILE verb"

  # ------------------------------------------------------------------------------------
  # Reaction control, as an attitude-and-wrench *service* rather than a thruster bus
  # (rcs_diode.md:9). apollo's seven points say what the thrusters are doing; these say
  # whether the service could do what it was asked, which is a different question and the
  # one a fleet in trouble actually has. Vocabulary §3 renames `acs.*` to `rcs.*` and keeps
  # rcs_diode's `mass_sigma` as its own point, so the sigma appears here and not as a
  # tolerance on the percentage.
  # ------------------------------------------------------------------------------------

  - id: rcs.propellant_sigma_pct
    unit: "%"
    layer: estimate
    precision: 0.1
    rate_hz: 1
    priority: P4
    events: ["uncertainty widening"]
    event_class: alarm
    provenance:
      basis: chosen
      reason: >-
        vocabulary §3 keeps rcs_dode.md:246's `mass_sigma` as a separate point rather than a
        tolerance, and rcs_dode.md:1063 makes the reserve judgement explicitly net of it
        ("estimated mass minus uncertainty/reserve below configured margin"). A remaining
        percentage with no uncertainty cannot support that judgement: 12 % remaining is
        comfortable at ±1 % and a coin toss at ±8 %, and the vehicle would be publishing the
        same number for both
  - id: rcs.attitude_error_deg
    unit: deg
    layer: estimate
    precision: 0.01
    rate_hz: 5
    priority: P3
    events: ["out of band"]
    event_class: alarm
    provenance:
      basis: chosen
      reason: >-
        rcs_dode.md:219 makes the attitude error a derived telemetry and :726 requires the
        allocator to let the mission layer distinguish "target not reached because guidance
        changed" from "target is physically unachievable". Neither is expressible without the
        error: the target is a request, the attitude is an estimate, and *their difference* is
        the only evidence that the request was granted. It is also the input the phase-plane
        latch switches on (rcs_dode.md:668), which is what makes the deadband a state rather
        than a number
  - id: "rcs.thruster_[n]_health"
    unit: "enum[ok,suspect,failed_off,failed_on,isolated]"
    layer: service
    precision: exact
    rate_hz: 2
    on_event: true
    priority: P1
    provenance:
      basis: chosen
      reason: >-
        rcs_dode.md:241 has `health` as an FDIR conclusion over the per-thruster evidence, and
        :949-952 makes the sequence the point: one discrepant switch must reach `suspect` and
        must not reach `failed_off` without corroboration. `failed_off` and `failed_on` are
        separate values because they have opposite consequences — one costs control authority,
        the other keeps spending propellant and can leave the vehicle with a rate it cannot
        damp — and a single `failed` would make F-04 and the no-response chain the same
        reading. The probe threshold `rcs.thruster_[n]_pressure_switch` is apollo's; this is
        the conclusion drawn from it
  - id: "rcs.thruster_[n]_pulse_width_us"
    unit: us
    layer: service
    precision: exact
    rate_hz: 0
    on_event: true
    priority: P2
    provenance:
      basis: chosen
      reason: >-
        rcs_dode.md:233 publishes the commanded pulse width per pulse and :234 publishes the
        *effective* width beside it, which is the distinction that turns "the valve was
        commanded" into "the valve was open for this long". The commanded width is what the
        minimum-pulse interlock is checked against; without it a fleet can see that a thruster
        is being pulsed and not how, which is the whole content of the minimum-impulse
        problem. Rate is `0` because a pulse has no cadence — it is an event or it did not
        happen
  - id: "rcs.thruster_[n]_residual_ns"
    unit: N*s
    layer: service
    precision: 1e-4
    rate_hz: 1
    priority: P3
    provenance:
      basis: chosen
      reason: >-
        the unexecuted-impulse accumulator `r_i` of rcs_dode.md:800-825, published because a
        residual that never clears is the *only* evidence of the failure mode the vehicle's
        owed per-thruster command floor creates: if the applicable floor is larger than
        the widths the controller keeps requesting, the accumulator grows, every requested
        pulse is refused as illegally short, and the thruster never fires — without a valve
        fault, a switch disagreement or a health conclusion. This channel is that fault's
        entire detection surface, and publishing it is what makes an unknown minimum impulse
        bit a *bounded* problem rather than a silent one
  - id: "rcs.thruster_[n]_impulse_ns"
    unit: N*s
    layer: estimate
    precision: 0.01
    rate_hz: 1
    priority: P3
    provenance:
      basis: chosen
      reason: >-
        rcs_dode.md:238's per-pulse impulse estimate with uncertainty, and the quantity the
        low-thrust fault is defined against: :950 detects it as realized impulse
        "systematically below model". `rcs.total_impulse_ns` cannot carry that, because a
        single derated thruster disappears into a total that sixteen others are also moving
  - id: rcs.allocation_status
    unit: "enum[feasible,constrained,infeasible]"
    layer: service
    precision: exact
    rate_hz: 2
    on_event: true
    priority: P1
    provenance:
      basis: chosen
      reason: >-
        rcs_dode.md:722 requires the allocator to publish an allocation status so that
        "target is physically unachievable with the current actuators" is distinguishable
        from "guidance changed". `constrained` is the middle value and the useful one: the
        request was met with a degraded actuator set, which is a fact about the vehicle that
        a boolean cannot express and that a fleet needs before it commits to a burn
  - id: rcs.allocation_residual
    unit: normalized
    layer: estimate
    precision: 0.01
    rate_hz: 2
    priority: P3
    events: ["above configured wrench residual"]
    event_class: alarm
    provenance:
      basis: chosen
      reason: >-
        `acs.allocation_residual[6]` (rcs_dode.md:230) reduced to the weighted scalar its own
        feasibility test uses (:1055, `weighted_residual > WRENCH_RESIDUAL_MAX(mode)`). The
        six-vector is the allocator's internal state; the scalar is the same quantity the
        threshold watches, and publishing both would be publishing one thing twice
  - id: rcs.control_authority_margin
    unit: normalized
    layer: estimate
    precision: 0.05
    rate_hz: 1
    priority: P2
    events: ["below configured authority minimum"]
    event_class: alarm
    provenance:
      basis: chosen
      reason: >-
        rcs_dode.md:231 and :1056 make the authority margin the trigger for the safe-hold
        ladder, and :889 makes it the thing FDIR recomputes *before* the mission layer decides
        anything. It is the one number that says how much attitude control is left, in the
        sense a propellant gauge says how much Δv is left — and unlike the residual it is a
        margin, so it degrades *before* a request fails rather than after
  - id: rcs.safety_state
    unit: "enum[nominal,rate_damp,safe_hold,fault_safe]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P0
    provenance:
      basis: chosen
      reason: >-
        rcs_dode.md:867-887's safe-mode ladder, published because the ladder's last rung is a
        trap a fleet walks into: :889 is explicit that "FAULT_SAFE does not mean fire
        nothing", and a passive no-fire state can be *less* safe than rate damping or a
        sun acquisition. A fleet that reads safe-mode entry as quiescence will stand down on
        a vehicle that is still firing. The values are the ladder's, and `attitude_hold` is
        deliberately not one of them: vocabulary §4 makes ATT_HOLD and TRACK *targets*
        (rcs_dode.md:365), so "what am I pointing at" is an argument to a verb and this enum
        is only "how degraded is the service".

comms:

  - id: comm.link_mode
    unit: "enum[sband_high,sband_low,vhf,none]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P2
    events: ["loss", "change"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:161"
  - id: comm.carrier_lock
    unit: bool
    layer: measurement
    precision: exact
    rate_hz: 10
    priority: P2
    range: [true, true]
    events: ["lock loss"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:162"
  - id: comm.hga_pointing_error_deg
    unit: deg
    layer: estimate
    precision: 0.01
    rate_hz: 5
    priority: P2
    range: [0, 2]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: [">2 warning", "scan limit"]
    inputs: ["gnc.attitude_q[0..3]", gnc.position_xyz_km]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:163"
  - id: comm.snr_db
    unit: dB
    layer: estimate
    precision: 0.1
    rate_hz: 2
    priority: P2
    range: [8, 30]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["<8 degraded", "<3 loss"]
    inputs: [comm.hga_pointing_error_deg, comm.tx_power_w]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:164"
  - id: comm.telemetry_rate_bps
    unit: bit/s
    layer: service
    precision: 1
    rate_hz: 1
    on_event: true
    priority: P3
    range: [1600, 51200]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["mode change"]
    event_class: notification
    provenance:
      basis: apollo
      ref: "apollo_diode.md:165"
      note: "1600 and 51200 are Apollo's reduced and normal rates (apollo_diode.md:7)"
  - id: comm.rx_frame_loss_pct
    unit: "%"
    layer: estimate
    precision: 0.01
    rate_hz: 1
    priority: P3
    range: [0, 0.5]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: [">2"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:166"
  - id: comm.antenna
    unit: "enum[high_gain,omni_a,omni_b,sband_steerable]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P3
    events: ["unexpected switch"]
    event_class: notification
    provenance:
      basis: apollo
      ref: "apollo_diode.md:167"
  - id: comm.tx_power_w
    unit: W
    layer: measurement
    precision: 0.1
    rate_hz: 1
    priority: P3
    range: [0, 100]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["low output", "high draw"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:168"
      note: "36 W bare and 72 W with the power amplifier (apollo_diode.md:157); a real electrical load, not an abstract link"

  # ------------------------------------------------------------------------------------
  # The two channels the blackout needs. `apollo_diode.md:903` supplies the property —
  # "behind the Moon there was no direct LM-Earth contact; telemetry could be routed/stored
  # through other links and later replayed" — and `:901` supplies the fidelity rule that goes
  # with it: "when communications degrade, the simulator should actually have to choose which
  # data arrives. Do not merely set comm.degraded=true while delivering every telemetry field
  # normally." So the blackout is a *state* and the recorder is a *stock*, and neither is a
  # quality flag.
  # ------------------------------------------------------------------------------------

  - id: comm.blackout_state
    unit: "enum[clear,occulted]"
    layer: service
    precision: exact
    rate_hz: 0.2
    on_event: true
    priority: P2
    provenance:
      basis: apollo
      ref: "apollo_diode.md:903"
      note: >-
        whether the Moon is between the vehicle and Earth. `occulted` is a *planned* condition
        and the domain deliberately raises no alarm on it: a blackout every orbit that announced
        itself as a fault would teach a fleet to ignore communications alarms, which is the
        failure F-11's third order depends on. What is alarming is a link loss the geometry does
        not predict, and that is `snr_db`'s and `carrier_lock`'s business. Published because the
        difference between "the vehicle is behind the Moon" and "the vehicle has stopped
        transmitting" is the whole content of a comms fault, and a fleet that cannot see the
        first will spend every orbit diagnosing the second
  - id: comm.recorder_fill_pct
    unit: "%"
    layer: estimate
    precision: 0.1
    rate_hz: 0.2
    priority: P3
    events: ["above 80"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:903"
      note: >-
        how much of the on-board record is held and not yet transmitted. This is the channel that
        makes a blackout survivable rather than merely survivable in principle: the vehicle
        stores what it cannot send and replays it, so an occulted vehicle is a vehicle whose
        *evidence is late* rather than one whose evidence is gone. It is a stock rather than a
        flag for the reason apollo gives at :901 — a degraded link must actually choose what
        arrives — and the choice is visible here: a fleet that spends its bandwidth on channels
        it does not need fills the recorder, and the fill percentage is what tells it so

avionics:

  - id: avionics.computer_mode
    unit: "enum[idle,run,standby,failed]"
    layer: service
    precision: exact
    rate_hz: 2
    on_event: true
    priority: P2
    events: ["restart", "mode change"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:176"
  - id: avionics.exec_margin_pct
    unit: "%"
    layer: estimate
    precision: 1
    rate_hz: 2
    priority: P3
    range: [20, null]
    range_kind: scale
    events: ["<10"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:177"
      note: "apollo supplies the only number here; avionics_diode.md contributes inequalities but no compute-margin value at all"
  - id: avionics.program_alarm_code
    unit: code
    layer: service
    precision: exact
    rate_hz: 0
    on_event: true
    max_decision_age_ms: 2000
    priority: P1
    events: ["any non-null"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:178"
      note: >-
        the third event-driven state on the vehicle and the third to declare a heartbeat, for
        the reason the first two did: an alarm that is republished only when it changes cannot
        distinguish "no alarm standing" from "the computer stopped publishing", and those want
        opposite responses. Also, unlike the other two, a code is a *value* — Apollo 11's 1202
        and 1201 are the same class of alarm with different correct responses, which is why the
        channel carries the code rather than a boolean
  - id: avionics.imu_power
    unit: bool
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P2
    range: [true, true]
    events: ["unexpected loss"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:179"
  - id: avionics.telemetry_frame_sync
    unit: bool
    layer: measurement
    precision: exact
    rate_hz: 10
    priority: P2
    range: [true, true]
    events: ["sync loss"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:180"
  - id: avionics.sensor_bus_errors_s
    unit: count/s
    layer: measurement
    precision: 1
    rate_hz: 1
    priority: P3
    range: [0, 0]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    #
    # A scale, not a band: an error *count* has no acceptable operating region to be inside of, and
    # the alarm is `>0` on a span whose floor is zero. A band needs width and this one has none.
    range_kind: scale
    events: [">0"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:181"
  - id: avionics.instrumentation_power_w
    unit: W
    layer: measurement
    precision: 0.1
    rate_hz: 1
    priority: P3
    range: [null, null]
    events: ["excessive", "zero"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:182"
      note: "the instrument-power fault is the one that destroys evidence rather than hardware (apollo_diode.md:342)"
  - id: avionics.clock_offset_ms
    unit: ms
    layer: estimate
    precision: 1
    rate_hz: 1
    priority: P3
    range: [null, null]
    events: [">100"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:183"
  - id: avionics.oldest_sample_age_ms
    unit: ms
    layer: estimate
    precision: 1
    rate_hz: 1
    priority: P2
    range: [0, null]
    range_kind: scale
    events: ["older than 2x the slowest rate in the active profile"]
    inputs: [avionics.telemetry_frame_sync]
    event_class: alarm
    provenance:
      basis: chosen
      reason: "a number without an age is a number an agent will reason about as if it were now (diode-contract.md:244). Per-point age exists as a field; this channel is the publisher's single honest statement that part of the picture is old, and it is how an instrumentation-power fault becomes visible before an agent trusts a frozen value (apollo_diode.md:342)"
  - id: avionics.redundancy_disagreement
    unit: count
    layer: service
    precision: 1
    rate_hz: 1
    priority: P2
    range: [0, null]
    range_kind: scale
    events: ["any"]
    event_class: alarm
    provenance:
      basis: chosen
      reason: "avionics_diode.md:390-411's redundant_vote is one of the only two mechanisms allowed to assign SUSPECT; a count of disagreements is the evidence behind it and the fastest way for an agent to discover that two sensors have parted company"

  # ------------------------------------------------------------------------------------
  # The instrument diagnostics. `avionics_diode.md` is an aircraft ICD — ARINC 429/664,
  # GNSS, elevons, DO-178C — and `corpus-review.md` §1 dismisses it accordingly. What it
  # also contains, at `:371-509`, is nine diagnostic *functions* in executable form, and
  # they are the most reusable code in the corpus: a quality-assignment function whose
  # signature provably cannot see the simulator's fault state, a redundancy vote, an
  # innovation test, a CUSUM drift detector, an actuator-tracking rule, and a command
  # authorization chain with an ordering argument. Three of the four channels below exist
  # because a diagnostic with no published evidence is a diagnostic nobody can audit.
  # ------------------------------------------------------------------------------------

  - id: "avionics.sensor_health_[class]"
    unit: "enum[good,suspect,fault]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P1
    provenance:
      basis: historical
      source: "avionics_diode.md:371-388 — `sensor_health`, whose `bad_count >= trip_count` branch returns FAULT"
      note: >-
        the *conclusion*, and deliberately not a quality code: `FAULT` is refused as a quality
        (`design.md:211-214`, the linter's rejected-name table), because a quality says how much
        to trust one sample and a health conclusion says what the vehicle has decided about an
        instrument. Publishing them as one channel would collapse exactly the distinction the
        design spends a section on, so `quality` travels on the frame and this travels beside it.
        Per class rather than per sensor: apollo's instrumentation had 277 analogue channels
        (`:184-186`), and 277 health flags is a log, not evidence
  - id: "avionics.drift_statistic_[group]"
    unit: normalized
    layer: estimate
    precision: 0.01
    rate_hz: 1
    priority: P2
    events: ["detected"]
    event_class: alarm
    provenance:
      basis: historical
      source: "avionics_diode.md:420-428 — `cusum_rule`, a positive and a negative accumulator with an allowance and a decision threshold"
      note: >-
        the single most useful thing in `avionics_diode.md`, and the reason it is worth reading
        past its first page. A CUSUM accumulator is the *only* detector on this vehicle for a
        drift whose per-sample size is below the instrument's own precision — and
        `plant.md` §4 states that requirement in the strongest possible terms: the nominal cabin
        leak is 0.023 kg/h, below `eclss.leak_rate_g_s`'s 0.01 g/s quantum, and it "must still
        happen". A threshold cannot see that leak. A trend test cannot see it. A cumulative sum
        of (sample − expectation) against an allowance can, and the published statistic is what
        lets a fleet watch the evidence accumulate rather than waiting for an alarm
  - id: "avionics.drift_state_[group]"
    unit: "enum[good,drift_detected]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P1
    provenance:
      basis: historical
      source: "avionics_diode.md:420-428 — the DRIFT_DETECTED return"
      note: >-
        the conclusion the statistic crosses into. `drift_detected` is a *latched* state and the
        only way out is a reset verb, because the property being reported — a systematic bias —
        does not become untrue when the statistic is reset. The two channels together are how a
        fleet can tell "the instrument has drifted" from "the vehicle's model of the instrument
        has drifted", which is the question `simulator-design.md:379-386` says a quality code
        must never answer
  - id: avionics.time_sync_state
    unit: "enum[sync,degraded,unsync]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P1
    events: ["integrity change"]
    event_class: alarm
    provenance:
      basis: historical
      source: "avionics_diode.md:474-483 — `time_health`, whose three returns are SYNC, DEGRADED and UNSYNC"
      note: >-
        `avionics.clock_offset_ms` is apollo's and carries the number; this carries the verdict,
        and the verdict is what gates a command. `avionics_diode.md:496-508` requires a
        *time-trusted* clock before an irreversible action may execute — `require(vehicle.
        time_quality == SYNC, "TIME_UNTRUSTED")` — and an offset with no verdict leaves that
        gate to be re-derived by whoever reads the number, differently each time

consumables:

  - id: res.o2_remaining_kg
    unit: kg
    layer: estimate
    precision: 0.01
    rate_hz: 0.2
    priority: P4
    range: [null, null]
    events: ["reserve threshold"]
    event_class: alarm
    provenance:
      basis: apollo
