  - id: res.main_propellant_kg
    unit: kg
    layer: estimate
    precision: 0.1
    rate_hz: 0.2
    priority: P4
    range: [null, null]
    events: ["reserve threshold"]
    event_class: realised_by
    event_thresholds: [prop_reserve_20]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:197"
  - id: res.rcs_propellant_kg
    unit: kg
    layer: estimate
    precision: 0.05
    rate_hz: 0.2
    priority: P4
    range: [null, null]
    events: ["reserve threshold"]
    event_class: realised_by
    event_thresholds: [rcs_reserve_25]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:198"
  - id: res.battery_energy_wh
    unit: Wh
    layer: estimate
    precision: 1
    rate_hz: 0.2
    priority: P4
    range: [null, null]
    events: ["time to empty"]
    event_class: realised_by
    event_thresholds: [battery_reserve_30]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:199"
  - id: "res.ledger_[resource]_kg"
    unit: kg
    layer: estimate
    precision: 0.01
    rate_hz: 0.2
    priority: P4
    range: [null, null]
    events: ["ledger reaches its reserve floor"]
    event_class: realised_by
    event_thresholds: [o2_reserve_20, water_reserve_20, h2_reserve_20, cooling_water_reserve, prop_reserve_20, rcs_reserve_25]
    provenance:
      basis: chosen
      reason: "consumables_diode.md:55-65 defines the ledger as the accounting model's own prediction, separate from any observation. It has to be published as its own channel, because the residual below is only evidence if both of its terms are visible — a residual published alone is a diagnosis, and design.md:211-214 forbids publishing those"
  - id: "res.recon_[resource]_kg"
    unit: kg
    layer: estimate
    precision: 0.01
    rate_hz: 0.2
    priority: P3
    range: [null, null]
    events: ["sustained beyond the configured tolerance"]
    # `delta_recon = observed - ledger`, and the observation side was `res.[resource]_kg` — a name
    # the registry has never declared. The ledger is a template and the observations are not: the
    # six resources publish their amounts under names of their own (`o2_remaining_kg`,
    # `water_potable_kg`, `battery_energy_wh`), so there is no `res.[resource]_kg` to point at and
    # there cannot be one. The residual's two terms are both named now, which is what the row's own
    # note demands of it — "the residual is only evidence if both of its terms are visible" — and
    # the first check to read a value in this field is what found the missing one.
    inputs: ["res.ledger_[resource]_kg", "res.o2_remaining_kg", "res.h2_remaining_kg",
             "res.water_potable_kg", "res.water_cooling_kg", "res.main_propellant_kg",
             "res.rcs_propellant_kg", "res.battery_energy_wh"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "consumables_diode.md:55-65"
      note: "delta_recon = observed - ledger, published as a pair with the observation and never reconciled silently. It is how a slow leak first becomes visible, and hiding it deletes the exact inference the experiment exists to observe (simulator-design.md:250-252)"
  - id: "res.status_[resource]"
    unit: "enum[NORMAL,WATCH,RESTRICTED,CRITICAL,EXHAUSTED,UNKNOWN,UNCONFIGURED]"
    layer: service
    precision: exact
    rate_hz: 0.2
    on_event: true
    priority: P3
    events: ["any transition toward CRITICAL"]
    event_class: notification
    provenance:
      basis: historical
      source: "consumables_diode.md:284: the status enum is the corpus's own, including UNCONFIGURED, which is the fail-safe state that stops a missing limit resolving to a fabricated typical value"
  - id: res.time_to_limit_s
    unit: s
    layer: estimate
    precision: 10
    rate_hz: 0.1
    priority: P4
    range: [null, null]
    events: ["< configured planning horizon"]
    inputs: [res.o2_remaining_kg, res.water_potable_kg, res.battery_energy_wh, res.main_propellant_kg]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:200"
      note: "the single most useful inferred quantity in the vehicle and the one most likely to be trusted past its age; consensus: the ledger-versus-observation pair means the forecast must never silently reconcile"

structure:

  - id: "structure.arm_state_[event]"
    unit: "enum[none,armed,expired,consumed]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P2
    events: ["armed", "expired without an execute"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:487-509"
      note: >-
        the state of the arm/commit pattern, which is the only place on this vehicle where it is
        used (conflict C-16). It has to be published because the token's whole purpose is to make
        an irreversible command deliberate: an agent that cannot see whether an event is armed,
        whether the arm has expired, or whether the token was already consumed is an agent that
        cannot tell a deliberate act from an accidental one.
  - id: "structure.event_count_[event]"
    unit: count
    layer: service
    precision: 1
    rate_hz: 0.2
    priority: P2
    events: ["any increment of an irreversible event"]
    on_event: true
    event_class: notification
    provenance:
      basis: apollo
      ref: "apollo_diode.md:509"
      note: >-
        a successful staging, jettison or pyro event increments the vehicle configuration
        permanently and can never be undone by another command. Counting them is how the record
        says what the vehicle *is* rather than what it was told: the configuration is a
        consequence of the count, not of the last command.
  - id: structure.cabin_dp_psi
    unit: psi
    layer: measurement
    precision: 0.01
    rate_hz: 2
    priority: P3
    range: [null, null]
    events: ["high", "low"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:206"
  - id: structure.hatch_state
    # Per hatch, because a single value could not say which one — and the LM's hatch opens onto the
    # lunar surface while the CSM's is the tunnel's other end, so "a hatch is open" is not the
    # question a fleet is asking. `mission.yaml#objectives.surface_mission` names this channel as
    # part of what settles an EVA, and it can now settle *which* hatch rather than that one moved.
    unit: "map[hatch_id,enum[closed,latched,open]]"
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P2
    events: ["incompatible with pressure"]
    event_class: notification
    provenance:
      basis: apollo
      ref: "apollo_diode.md:207"
  - id: structure.docking_latches
    unit: count
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P2
    events: ["latch disagreement"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:208"
  - id: structure.leak_estimate_g_s
    unit: g/s
    layer: estimate
    precision: 0.01
    rate_hz: 0.2
    priority: P4
    range: [0, null]
    range_kind: scale
    events: ["rising leak"]
    event_class: realised_by
    event_thresholds: [leak_rate_rising]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:209"
  - id: structure.accel_xyz_g
    unit: g
    layer: measurement
    precision: 0.001
    rate_hz: 10
    priority: P2
    range: [-0.001, 0.001]
    # `band` is an acceptable operating region and every alarm fires outside it; `scale` is the
    # quantity's full span, and a reserve alarm inside it is normal. The two are indistinguishable
    # from the numbers alone, which is why this is declared rather than inferred.
    range_kind: band
    events: ["uncommanded impulse"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:210"
  - id: structure.stage_state
    unit: "enum[docked,undocked,separated,abandoned]"
    layer: service
    precision: exact
    rate_hz: 0
    on_event: true
    max_decision_age_ms: 1000
    priority: P1
    events: ["irreversible change"]
    event_class: notification
    provenance:
      basis: apollo
      ref: "apollo_diode.md:211"
      note: >-
        an event-driven *state*, so it declares a heartbeat: 1000 ms, chosen. The value itself
        never goes stale in the usual sense — the configuration is monotone and a sample from a
        minute ago is still a true reading of what the vehicle was — and that is exactly why the
        age matters, because the hazard is acting on the state *before* the change rather than
        after it. F-15 is premature staging: separating a stage that has already separated, or
        venting through a hatch whose state has moved on. A monotone quantity whose published
        form arrives only on change cannot distinguish "nothing has happened" from "the
        publisher has stopped", and a fleet cannot tell those apart either.
  - id: "structure.pyro_continuity_[n]"
    unit: bool
    layer: measurement
    precision: exact
    rate_hz: 0.2
    priority: P3
    range: [true, true]
    events: ["lost continuity"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:212"
  - id: structure.relief_valve_state
    unit: bool
    layer: service
    precision: exact
    rate_hz: 1
    on_event: true
    priority: P3
    range: [false, false]
    events: ["unexpected opening"]
    event_class: alarm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:213"

