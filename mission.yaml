# --------------------------------------------------------------------------------------
# The landing site, and the one thing it decides that nothing else does.
#
# **What the site sets is whether the LM can be heard at all while it is on the surface.** The
# Earth sits near the sub-Earth point — selenographic (0, 0), wandering within the libration
# envelope — so from a site at (lat, lon) the Earth's elevation is 90 deg minus the angular
# distance to that point. Above the horizon, the link is there for the whole stay; below it,
# there is no link at any time. There is no in-between at this timescale: libration moves the
# sub-Earth point at 0.075 deg/h at its fastest, so across the 21.5 h `surface` phase the
# elevation changes by **at most 1.6 deg**. The LM is therefore either in contact throughout or
# in contact never, and that is a property of where it landed rather than a time series.
#
# **The choice is `chosen` and the corpus cannot check it.** `apollo_diode.md:1206` asks that the
# scenario "avoid matching all historical labels closely enough to permit that shortcut", which
# is a constraint on the *site* as much as on the faults — a fleet that recognises Tranquillity
# Base has been handed the answer. But the corpus carries no coordinates for any site, flown or
# otherwise, so there is nothing to check a choice against and the reason is a reason.
# --------------------------------------------------------------------------------------
landing_site:
  latitude_deg: 12.4
  longitude_deg: 47.5
  # The mean sub-Earth point and the envelope it wanders in. Both are geometry rather than
  # mission design: the Moon's rotation is synchronous, and libration is what moves the point.
  sub_earth: {latitude_deg: 0.0, longitude_deg: 0.0}
  libration: {amplitude_deg: 7.9, period_days: 27.55}
  # Derived from the four fields above, and re-derived by `check_landing_site`.
  earth_elevation_deg: 41.3
  elevation_variation_over_surface_deg: 1.61
  provenance:
    basis: chosen
    reason: >-
      a near-side site with the Earth well clear of the horizon — 41 degrees of elevation, so the
      surface link is continuous and the pointing is a real constraint rather than a formality —
      and one that no Apollo mission flew near: the six flown sites span 23.4 W to 30.8 E, and
      47.5 E at 12.4 N is 17 degrees from the nearest of them. The corpus gives no coordinates to
      check that against, which is why it is written as a reason and a check re-derives only the
      geometry. What the choice buys the experiment is the asymmetry in the next paragraph.
    note: >-
      **the consequence worth stating, because it inverts the vehicle's comms situation between
      its two halves.** In lunar orbit the CSM is silent for 46.5 minutes in every 117.8 — 39 % of
      the time, 23.5 h across the five orbital phases. On the surface the LM is not silent at all:
      it has the Earth in view continuously, and it is the *only* part of the vehicle that does.
      So during `descent` and `surface` a fleet hears the LM and not the CSM, and during
      `lunar_orbit` and `ascent_rendezvous` the two trade places at the orbit's cadence. That is
      not a modelling artefact; it is what a 100 km orbit and a near-side landing site do, and it
      is the reason the LM-as-lifeboat decision is affordable at all — the half of the vehicle the
      crew would move into is the half that can always be talked to.
open_debts:

  - "**The pools are declared now; what is still undecided is whether a scenario names the chain it is about.** Each posture's `seeds` says what it places — `degraded` a fault whose kind is `latent_then_acute` or whose hazard is the noncritical baseline, `crisis` a critical-class fault plus an optional instrument defect — and the two class names are defined by the *nominal* posture's own baselines rather than by a constant in a tool. `tools/faults.py` reads the declaration (through `check_vehicle.in_seeding_pool`, so the scheduler and the check cannot disagree), and `check_seeding_pools` holds four things: the selector names only `kinds` and `hazards`, every kind and class is one the corpus declares, a posture that promises a seed declares a pool, and every pool matches at least one fault. What no declaration says is *which story a run tells*: the pool is a set of faults, the guaranteed seed is drawn from it, and the chain that results is whichever one that fault realises — so a `crisis` run is a crisis, and not necessarily the crisis a chain names. Closing that means deciding whether a scenario carries a chain id, which is a decision about the experiment rather than about the vehicle, and it is left here rather than made."

  - "**`hazardous_actions_permitted` is held, and the verbs it constrains are not joined to it.** Ten postures declare whether a fleet may act from them, exactly one (`execute`) says yes, and until this round no tool read the field — the other five fields of the block were validated and this one, which is the permission the whole execution machine exists to grant, was compared to nothing. What is held now is the safety property `mission_diode.md`:1727 puts in the startup verification list (*no hazardous verb is enabled in ABORTED*), that the terminal postures permit nothing, that the machine permits action somewhere, and the vehicle-side half of TV-E: every transition *into* a posture that permits hazardous actions must re-read `mission.abort_latched`, which `prepare -> execute` does. What is still unjoined is the other half of the sentence: the vehicle declares eleven irreversible verbs and two armed one-way events, and *nothing says which verbs the permission is about*. `irreversible: true` is the nearest thing to that vocabulary and it is a different claim — it is about whether an effect can be undone, not about whether it may be attempted from `recovery` while the crew are working a fault. Until a verb carries the hazardous flag, `hazardous_actions_permitted` is a property of the executive's gate rather than of the vehicle's command surface, and the gate is the far side's to build."

  - "Nothing maps a crew member to a *station*. The crew are named three ways — `ask_crew`'s `crew_id` and this file's `positions` both say `commander`, `lm_pilot`, `csm_pilot`; `channels.yaml#crew_positions` names stations (`csm_commander`, `csm_navigator`, `csm_lower_equipment_bay`, `lm_commander`, `lm_pilot`, `tunnel`, `surface_eva`); and `location_phase_default` names a *vehicle* (`csm`). The last is the odd one and it is correct on its own terms — all three are in the CSM before undocking — but `ask_crew`'s perception bound is per *station*, so a question asked from \"csm\" is a question asked from nowhere. The linter now refuses a `location_phase_default` that is not a vehicle any configuration carries crew in, and it cannot go further because which CSM station each person occupies is undeclared: the corpus gives three stations for three people and never says who sits where. That mapping is a decision about the vehicle rather than a repair, which is why it is here and not in a check."
  - "**The sequence of blackouts, not their count.** `plant.py --blackout` gives the number: 23.5 h silent across the five orbital phases, 46.5 min in every 117.8, and the LM's surface link is continuous because the site declares it so. What is still unbudgeted is *which* manoeuvres land in the dark — how many contact periods each phase contains, and which of them fall during an activity that cannot be paused. A phase with 12 occultations and a phase with 20 are different experiments, and the alignment of the first blackout against the phase's start is a free parameter of the arrival geometry — it depends on where in the orbit the vehicle was at LOI, which depends on the transfer plane, which depends on the same lunar ephemeris the three owed orbital elements need. One datum closes three debts, and this is the third of them."

  - "**Two of six orbital elements are still owed, and they are each other's mirror.** The count said three for four rounds; the true anomaly at cutoff was never a free parameter — the cutoff *is* the transfer's perigee, since the eccentricity is defined from that radius — and it is now a declared zero. The lunar ephemeris the debt asked for has arrived (`initial_state.lunar_ephemeris_at_arrival`, a recorded JPL Horizons query), and it did two things: it re-sized the transfer, because the Moon is 10,351 km farther out at MET 73 h than the mean distance the elements were solved to, and it made the plane solvable. What remains is the ascending node and the argument of perigee: a plane with the parking orbit's inclination that contains the Moon's position has exactly two solutions, mirror images about the Earth-Moon line, and the **free-return constraint is the discriminator** rather than a third unknown. That is a computation over the Moon's own velocity vector, which the ephemeris also carries, so this is now a round's arithmetic rather than a datum nobody has. `check_trajectory` re-derives the five determined elements, refuses a transfer sized to a mean distance, and refuses a non-zero true anomaly at cutoff."
  - "**The entry corridor**: the last of the landing-site decisions. The site itself is declared (`landing_site`, chosen at 12.4 N 47.5 E against `apollo_diode.md:1206`), and `check_landing_site` re-derives the geometry it produces — but the corridor a descending LM must fly to reach it is a different quantity and is not parameterised. It sets the downrange distance from powered-descent initiation to touchdown, which is what `descent`'s 2.5 h is actually spent on, and nothing here says how far out the vehicle starts."
  - "The two lunar-orbit phases assume the CSM stays in a circular orbit while the LM descends; whether the CSM performs a plane change during the surface phase is a real mission-design decision and is not made here."
  - "The posture machine above is authored from `mission_diode.md` and its guards are named but not yet evaluated: `g_safe_exit`, `g_prepare`, `g_execute`, `g_resume`, `g_recovery`, `g_standby` and `g_complete` are prose conditions. `transition_evidence` mechanises the freshness half of them, which is the half that has a checkable failure mode; the threshold half belongs to the domains that own each quantity, and several of those thresholds do not exist yet."
