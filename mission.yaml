  lunar_arrival:

    parking_orbit_after_loi1: {apolune_nmi: 169.7, perilune_nmi: 60.0}
    parking_orbit_after_loi2: {apolune_nmi: 65.7, perilune_nmi: 53.8}
    descent_orbit_perilune_km: 15.2     # about 50,000 ft
    pdi_altitude_km: 15.0
    provenance:
      basis: historical
      source: "A11 Tbl 7-IX: 169.7 x 60.0 nmi after LOI-1, 65.7 x 53.8 nmi after LOI-2; descent orbit insertion drops perilune to about 50,000 ft (15.2 km) and PDI occurs at about 50,000 ft, with a best estimate of 49,376 ft (Tbl 5-III)"
  position_xyz_km: UNCONFIGURED
  velocity_xyz_m_s: UNCONFIGURED
  state_vector_debt:

    basis: UNCONFIGURED
    relation: >-
      needs a patched-conic trajectory design: Earth-centred osculating elements at MET 0
      that place the vehicle inside the Moon's sphere of influence at the right arrival time,
