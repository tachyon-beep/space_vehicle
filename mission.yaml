  # `landing_site` used to be here as well, a second `UNCONFIGURED` beside this one, and it
  # outlived its own answer: the site was chosen and declared as a top-level `landing_site` block
  # below, with its derivation and a linter check, while this placeholder went on reporting the
  # site as undecided — twenty lines above it, in the same file. A debt that has been paid and is
  # still on the books is worse than no debt, because it tells the next reader to stop looking.
