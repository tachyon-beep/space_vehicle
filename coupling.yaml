# --------------------------------------------------------------------------------------
# What this file still owes. The linter (tools/check_vehicle.py) fails the build and names
# the wanting edge for each UNCONFIGURED above; this list is the human-readable version.
# --------------------------------------------------------------------------------------
open_debts:

  - "The ladder's missing rung. `power.load_shed_class` can take `none`, `P3`, `P2`, `P1` and `P0`, and the four `bus_a_*` thresholds in `domains/power/profiles.yaml` select `none`, `P3`, `P2` and `P0` — so seven P1 loads are declared in `domains/power/components.yaml#loads` and no voltage ever sheds them as a tier of their own. `E-BUS-SHED`'s own table says so where the rungs are written. What is owed is one of two things and which is a decision about the vehicle rather than a value: a fifth threshold between `bus_a_shed_p2` at 24.5 V and `bus_a_survival` at 23.5 V, or a class enum that names the four rungs the ladder actually has. Until then a P1 load is shed at `bus_a_survival` with the P0 set, or not at all."

  # Round 50 added `advances` and `drains` and made the stock classifier dimensional; round 51
  # asked what would actually fix the ratio edges rather than how to describe them better. The
  # answer is now exact, and it is one mechanism rather than five patches.
  #
  # A dimensionless ratio is computable whenever the graph carries the flow it is *against*:
  # `1.0 kg water per kg reactants` applied to a node holding `kg reactants per second` gives water
  # per second, which is a flux. Nothing in the vehicle does, so the classifier refuses — and its
  # refusal names the node that would fix the edge. Five edges, four distinct intakes:
  #
  #   * `E-O2-FC`          needs a flow in **kg O2/s** — the fuel cell's oxygen draw
  #   * `E-H2-FC`          needs a flow in **kg H2/s** — the fuel cell's hydrogen draw
  #   * `E-FC-WATER`       needs a flow in **kg reactants/s** — the same cell's consumption
  #   * `E-O2-ECLSS`       needs a flow in **kg O2/s** — the CSM cabin's supply through the regulator
  #   * `E-LM-O2-ECLSS`    needs a flow in **kg O2/s** — the LM cabin's, a separate compartment
  #
  # They are not one node. `E-O2-FC` and `E-O2-ECLSS` both draw from `o2_csm`, but one is the cell's
  # draw and the other is the regulator's supply to the cabin: two consumers, two intakes, two rates.
  # So the shape is a `kind: flow` node per consumer intake, each with a producing state whose rule
  # sets that rate — the cell's draw follows its power, the cabin supply follows the regulator's
  # position and the cabin's pressure.
  #
  # That is the same answer rounds 48, 49 and 50 each arrived at from a different direction, and it
  # is now a specification rather than a diagnosis: **the graph has nodes for what is conserved and
  # for what is commanded, and none for the flows between them.** Six flow nodes exist
  # (`fuel_cell`, `coolant_flow`, `radiator_reject`, `link`, `thrust_main`, `rcs_thrust`) and they
  # are denominated in `W`, `N`, `dB` and `kg/s`; the flows the stocks need are named only in the
  # sensitivities' denominators.
  #
  # Sizing it: four nodes and four algebraic states, five edges repointed, and the `advances` and
  # `drains` declarations on each. It is deferred rather than half-done because a flow node without
  # a rule that computes its rate is a node the plant still cannot advance, and the rules are real
  # modelling — the cell's draw is bounded by its own reactant availability, which is the
  # `C-REACTANT-DRAW-O2` cycle declared two hundred lines above.
  # Added in round 47, and it is a property of the graph rather than of any one edge: **eleven of
  # the fourteen edges that land on a stock node cannot be integrated as written.** Round 49 added
  # `advances` to every edge on a multi-state node, which is what distinguishes an edge that drives
  # a *stock* from one that merely lands on a stock node's channel: `E-ZONE-ATM` and `E-ZONE-ATM-LM`
  # drive the cabin *pressure*, which is algebraic, so they were never fluxes and are no longer
  # counted. **Six structural and four unset remain.** Writing the
  # plant's stock integrator is what surfaced it, because the integrator had never run — the
  # schedule stops at the first `algebraic` state, long before it reaches a stock — and when it was
  # finally exercised it summed every incoming edge as `sensitivity x dt`. Handed
  # `lm_cabin_o2_kg` it returned the same mass whether one crew member was aboard or three.
  #
  # Three of the eleven are simply unset (E-BUS-BAT, E-PRESS-PROP, E-FC-DRAW-O2 and E-FC-DRAW-H2,
  # whose values are `UNCONFIGURED` and already debts elsewhere) or a per-hour rate the integrator
  # can now convert (E-LM-CREW-ATM, E-CREW-ATM and E-RAD-WATER are the three that work). The other
  # eight divide into two kinds, and each kind needs a different thing declared:
  #
  #   * **A ratio whose flow is undeclared** — E-O2-ECLSS and E-LM-O2-ECLSS at `1.0 kg O2 per
  #     kg O2`, E-FC-WATER at `1.0 kg water per kg reactants`. A dimensionless ratio converts the
  #     source's *outflow* into the target's inflow, and the outflow belongs to whichever state
  #     produces it: the oxygen leaves `o2_csm` through the regulator, and the regulator's flow is
  #     the quantity these edges are missing. The transfer fraction is right; the flow it applies
  #     to is nowhere in the graph.
  #   * **A structural relation landing on a stock node** — E-PLATE-BAT at `0.0 J per K`
  #     (a derating of usable capacity, not a flux into the battery), and E-ATM-ABSORB and
  #     E-LM-ATM-ABSORB at
  #     `26.37 man-hours per kg CO2`. A cabin's pressure depends on its temperature and its mass,
  #     but its *mass* does not depend on its temperature: these edges land on the stock node
  #     because the channel hangs off the node, not because anything flows into it. The absorber
  #     pair is the sharper case — man-hours per kg of CO2 is a conversion, and it needs the CO2
  #     *removal rate* as its driver rather than the cabin's CO2 inventory.
  #
  # The plant refuses all eight by name rather than approximating them, so the build order is now
  # legible: `plant.py --readiness` cannot reach a stock until these say what drives them. Choosing
  # between the two repairs — a declared `flux_node` on the edge, or promoting the producing state
  # to a channel the edge can read — is a graph decision rather than a patch, and it is the next
  # thing this file owes.
  # This debt named two edges and one coefficient, and the three turned out not to be the same
  # size of thing. E-FC-BUS asked for a "V per W" droop, but the source regulator is specified as
  # a *regulated* output (electrical_diode.md:249: 24-32 V over 25-100 % of 1.2 kW, >=94 %,
  # <10 ms transient) and a regulated source has no proportional droop to configure — the edge is
  # a unity carry and is now closed at 1.0 V per V, with the residual recorded below as the
  # resistance it actually is. E-BAT-BUS is *not* closed and should not be, because it is not the
  # same kind of unknown: `battery_energy` advances exactly one state, `battery_charge_j`, and a
  # stock of joules cannot be an algebraic source of volts. There is no pack-voltage state, no
  # open-circuit-voltage curve and no bidirectional converter in the model, so the edge couples
  # from a node that cannot produce the quantity it carries. The fix is a state, not a number.
  - "Source internal resistance (the residual sag on E-FC-BUS and the tie drop across E-TIE-BUSA). electrical_diode.md:247-251 gives ratings and efficiencies but no source or conductor resistance, and the droop is bounded rather than determined by what is published: the undervoltage ladder asserts at 26.5 V (apollo_diode.md:73), so a 28 V bus at the 1.2 kW rating cannot sag more than 1.5 V without a healthy converter tripping its own alarm — an upper bound of 1.25e-3 V per W. The bound is the useful half; the number is still owed."
  - "A pack-voltage state on `battery_energy` (E-BAT-BUS, and the reason that edge cannot close). The node advances stored energy and nothing else, so an algebraic edge from it to `bus_a` has no quantity to be a function of. What is missing is the chain stored energy -> open-circuit voltage -> bidirectional converter -> bus (electrical_diode.md:250 gives the converter as 20-36 V battery to 28 V bus, >=94 %), and the honest OCV is flat enough over most of the usable band that the regulated bus barely moves: the coupling is closer to *availability* than to volts. Declared here rather than guessed, because adding a state changes the schedule and the schedule is derived."
  - "Every thermal time constant and conductance (tau on E-PUMP-COOL, E-TRANSPORT-PLATE, E-PLATE-*). thermal_diode.md:965 declares them all UNSPECIFIED and refuses to infer them."
  - "Loop transit delay in ticks (E-COOL-TRANSPORT). Needs loop volume and flow; apollo_diode.md:97 gives ~24 gal/h."
  - "Throttle-to-thrust law for main propulsion (E-PROP-ENG). Isp and mass flow are supplied (vehicle.yaml#propulsion, Apollo 11 tables) and the RCS rate edge is now closed at 2843.9 N per kg/s; what main propulsion still owes is the shape — build-up, tailoff and the descent engine's 65-92.5 % non-operating region, which `domains/propulsion/` refuses to interpolate across."
  - "Inertia tensor and centre of mass (E-RCS-DYN, E-GNC-RCS). The masses are supplied; the rotational properties are not, and without them the vehicle cannot tumble. Landing `domains/rcs/` turned this from one unknown into two named ones: the inertia, and the thrusters' geometry — forty-four unit thrust directions and lever arms, which are what the allocator's wrench matrix is built from."
  - "Per-edge crisis-point gains for the power->thermal->power loop (E-BUS-PUMP especially). Required before the fidelity closure means anything at the crisis operating point."
  - "A `regimes` table for the four remaining bus-driven edges (E-BUS-GNC, E-BUS-INST, E-BUS-COMM) and E-BAT-BUS's availability half. `regimes:` now exists and is enforced: a `discrete` coupling leaving physical equipment must declare one, `E-BUS-RCS` and `E-STRUCT-PLATE` are converted, and `E-GNC-ENG`/`E-GNC-RCS` closed outright by promoting guidance to a service node — they had been coupling from `nav_state`, the navigation solution, to ask a question only a decision can answer. A consumer's draw is constant inside the 24-32 V envelope and then stops; that envelope is already the undervoltage ladder in domains/power/profiles.yaml, so a `1 per V` here would model a load that grows without bound as the bus sags, which is the opposite of what a load does. E-GNC-RCS is not a scalar under any form — rcs_dode.md:685-693 maps a wrench to thruster pulses through B = [F_i d_i ; r_i x F_i d_i], so its sensitivity is a matrix over forty-four thrust directions and lever arms that are themselves unpublished. The closing move is a `regimes:` table on a discrete edge whose bands are checked against the thresholds that already exist, which would connect the coupling graph to the ladders it currently ignores."
