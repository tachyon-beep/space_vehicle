      properties: UNCONFIGURED
      note: >-
        owed to **an epoch, not a document**. Both halves are declared above — `csm_alone`'s tensor
        from Table 3.2-22 and `lm_ascent_stage`'s from Table 3.2-26 — and the parallel-axis
        composition of the two is arithmetic this file could do. **It is not landed because it does
        not reproduce the one case that can be checked.** Composing `csm_alone` with
        `lm_alone_descent`, whose masses sum to `csm_lm_docked`'s 44,085 kg, gives a centre of mass
        22 % forward of the station Table 3.2-21 tabulates for that weight (and 9 % off with the
        docked frame offset instead of the launch one). The tables are indexed by **weight**, and
        at one weight the reference mission's two vehicles are not at the states their own tables
        are referenced to: the docked row's CSM has burned propellant the CSM-alone table's has
        not. So a composed tensor would be the tensor of this corpus's construction — two
        reference states added — rather than of any vehicle the book tabulates, and that is a
        distinction worth a round rather than a number. What would land it is the CSM+ascent-stage
        configuration tabulated at its own epoch, which the volume does not have

# --------------------------------------------------------------------------------------
# Propulsion. Loads are flight-measured. The linter flies each engine's burns in phase order
# against its tank and reports the reserve — see check_propulsion, which has to be
# sequential because LOI leaves from the 44-tonne docked stack and TEI from an 18-tonne CSM.
# --------------------------------------------------------------------------------------
propulsion:

  # **Two of the six loaded tanks are carried by no coupling stock, and that is now a decision
  # rather than an omission.** The graph's `prop_main` and `prop_rcs` carry the SPS's 18,508 kg and
  # the three RCS systems' 1,008; the LM's descent and ascent propellant — 10,624 kg — is carried by
  # the mission's own delta-v accounting instead, which `check_propulsion` flies sequentially
  # through each tank in phase order. A coupling stock for them would need a drain edge into
  # `thrust_main` per engine, and the engine whose flow `E-PROP-ENG` states is the SPS's: one edge
  # cannot be three engines' drain, so the choice is a stock per engine or the accounting, and the
  # accounting is where the mission's delta-v already lives. `check_propellant_stocks` refuses a
  # loaded tank that is neither carried by a stock nor named here.
  not_on_a_coupling_stock:
    lm_dps: "8,248 kg, flown by `check_propulsion` through `mission.yaml#delta_v_budget` in phase order"
    lm_aps: "2,376 kg, flown the same way; the ascent burn is 434.88 s of the ascent engine's 460 s rating"

  sps:
    name: "Service Propulsion System"
    engine: AJ10-137
    thrust_n: 91188
    isp_s: 314.5
    chamber_pressure_psia: 100
    throttleable: false
    qualified_restarts: 50
    propellant: "N2O4 / Aerozine 50, hypergolic, restartable"
    pressurant: "helium, 3,600 psia nominal, regulated to 186 psia, engine inlet 165 psia"
    mass_kg: 18508
    provenance:
      basis: historical
      source: "A11 Tbl 8-X: 40,803 lb loaded (15,712 fuel + 25,091 oxidiser) = 18,508 kg. Thrust 20,500 lbf = 91,188 N (derived: no newton figure is published). Isp 314.5 s and chamber pressure 100 psia from the AJ10-137 report. Qualified for 50 restarts; Apollo 11 made 5 firings totalling 531.9 s"
  lm_dps:
    name: "LM Descent Propulsion System"
    thrust_max_n: 43192
    thrust_min_n: 4671
    throttle_ratio: 10
    isp_s: 305
    chamber_pressure_psia: 103.4
    propellant: "N2O4 / Aerozine 50 (2:1), supercritical helium pressurisation regulated to 245 +/- 3 psia"
    mass_kg: 8248
    provenance:
      basis: historical
      source: "NR and the DPS experience report: 9,710 lbf operating maximum, 1,050 lbf minimum, 10:1 range, with 65-92.5 % a NON-OPERATING region. Isp 305 s is the NASA end-of-duty-cycle design requirement; the 311 s commonly quoted traces only to Wikipedia. Load 18,184 lb = 8,248 kg from A11 Tbl 9-XIII"
  lm_aps:
    name: "LM Ascent Propulsion System"
    thrust_n: 15569
    isp_s: 309.4
    chamber_pressure_psia: 122.6
    throttleable: false
    propellant: "N2O4 / Aerozine 50, fixed thrust, no throttle"
    mass_kg: 2376
    provenance:
      basis: historical
      source: "NR and A11 Tbl 9-XII: 3,500 lbf nominal (3,464 predicted / 3,439 measured) = 15,569 N; Isp 309.4 predicted, 308.8 measured; load 5,238 lb = 2,376 kg (Tbl 9-XIV). The ascent engine cannot throttle, which is why an ascent commit is a single irreversible act"
  rcs_sm:
    name: "Service Module reaction control"
    thrusters: 16
    thrust_n: 445
    isp_s: 290
    propellant: "MMH / N2O4"
    mass_kg: 608
    minimum_impulse_bit_ns: UNCONFIGURED
    provenance:
      basis: historical
      source: "NR: 16 x 100 lbf in 4 quads; load 1,340 lb = 608 kg from A11 Tbl 8-XI. The minimum impulse *bit* is not published: a search of the mission report, the summary report and both news references returned zero hits for any impulse-bit figure. The minimum firing *time* is published — 10 ms, `domains/rcs/components.yaml#capability.minimum_firing_time` — and it bounds the bit from above rather than giving it, because a minimum pulse does not achieve the full 100 lbf and no source gives the curve that would integrate it"
  rcs_cm:
    name: "Command Module reaction control"
    thrusters: 12
    thrust_n: 445
    isp_s: 290
    propellant: "MMH / N2O4"
    mass_kg: 112
    provenance:
      basis: historical
      source: "NR: two systems of six thrusters; load 245.9 lb = 112 kg from A11 Tbl 8-XI"
  rcs_lm:
    name: "LM reaction control"
    thrusters: 16
    thrust_n: 445
    isp_s: 290
    propellant: "Aerozine 50 / N2O4 (2:1)"
    mass_kg: 288
    minimum_impulse_bit_ns: UNCONFIGURED
    provenance:
      basis: historical
      source: "NR: 16 x 100 lbf in 4 clusters of 4; load 634 lb = 288 kg from A11 Tbl 9-XV. apollo_diode.md:143 notes the LM flew thousands of short firings, which is why pulse accounting matters here more than thrust"

# --------------------------------------------------------------------------------------
# Consumables: the loads the mission starts with. `res.*` is `mission dependent` in apollo
# (:193-200), so these are the values that make the ledger a real game rather than a
# placeholder — and the reason `res.time_to_limit_s` can be a number.
# --------------------------------------------------------------------------------------
consumables:

  csm:
    o2_kg: 279
    h2_kg: 24.5
    water_potable_kg: 14
    water_cooling_kg: 13
    provenance:
      basis: historical
      source: "A11 Tbl 8-XII: 615.0 lb O2 (300.5 + 314.5) = 279 kg and 54.1 lb H2 = 24.5 kg loaded; Tbl 8-XIII: 31.7 lb potable + 28 lb waste water loaded. The fuel cells produce a further 315 lb = 143 kg of water, which is why potable water here is a production-and-consumption problem rather than a tank"
  lm:
    o2_kg: 24.1
    water_kg: 137
    provenance:
      basis: historical
      source: "A11 Tbl 9-XVI: 53.2 lb O2 = 24.1 kg (48.2 descent + 5.0 ascent); Tbl 9-XVII: 302.3 lb water = 137 kg (217.5 descent + 84.8 ascent)"
  metabolic:
    o2_kg_per_crew_day: 0.91
    co2_kg_per_crew_day: 0.91
    water_kg_per_crew_day: 2.27
    food_kg_per_crew_day: 0.45
    provenance:
      basis: historical
      source: "NR glossary planning rates for a 154 lb man: in about 2 lb O2, 5 lb water and 1 lb food per day; out about 2 lb CO2 and 6 lb water/urea/minerals. apollo_diode.md:754 requires metabolic O2 and CO2 as *rates* — an input, not a model of a person"
  # Per cabin, because a leak is a property of a seal rather than of a programme — and because until
  # round 67 one field was doing both cabins' work while its own source named only one of them.
  leak:
    csm_kg_per_h: 0.023
    lm_kg_per_h: 0.0226796
    lm_spec_kg_per_h: 0.0907184
    provenance:
      basis: historical
      source: "A11: LM cabin leak 0.05 lb/hr actual against a 0.2 lb/hr specification = 0.0226796 and 0.0907184 kg/h. Worth stating for the plant: 0.023 kg/h is 0.0064 g/s, BELOW the 0.01 g/s published precision of eclss.leak_rate_g_s. A nominal leak is therefore invisible to the instrument and only a growing one is detectable — the fixed-point dead zone of review-findings.md #1, present in the vehicle itself rather than introduced by the integrator"
      note: >-
        **the LM's figure is measured and the CSM's is borrowed.** A11 gives one cabin leak, and it is
        the LM's: 0.05 lb/hr. The CSM's own is published nowhere in the corpus reached, and
        `domains/consumables/components.yaml` sizes `o2_csm_kg`'s quantum from "the nominal cabin
        leak, 0.023 kg/h" as though it were the CSM's — which is 0.0507 lb/hr, the same seal's number
        to within rounding. So `csm_kg_per_h` is that borrowed figure, declared here rather than left
        implicit, and what closes it is a CSM cabin-leak measurement. Two cabins with one number
        between them was the state of this field until round 67 and it read as though it had two
  co2_removal:
    lm_primary_man_hours: 41
    lm_secondary_man_hours: 78
    lm_spares: 6
    csm_element_man_hours: 72
    provenance:
      basis: historical
      source: "NR and PSR: LM primary cartridge 41 man-hours, secondary 78 man-hours, 6 spares; CSM LiOH elements on a nominal 72 man-hour rotation with the caution at 7.6 mmHg. No kg-CO2-per-canister figure is published anywhere reachable, so capacity is modelled in MAN-HOURS — which is also the denominator eclss.absorber_capacity_pct never had (corpus-review.md §6)"

# --------------------------------------------------------------------------------------
# Thermal. `thermal_diode.md:965` declares every thermal constant UNSPECIFIED and refuses to
# infer them, so the loop parameters here come from the ECS reports and the node heat
# capacities remain the largest single debt in the vehicle.
# --------------------------------------------------------------------------------------
thermal:

  loops:
    # Three loops, and until round 43 this file named two of them wrongly. The entry called
    # `secondary` carried the **LM's** fluid, the LM's flow band and the LM's coolant mass — it was
    # the LM loop wearing the CSM's naming — while the CSM's actual second loop, which
    # `domains/thermal/components.yaml` has always declared, appeared nowhere here. The vehicle
    # carries two glycol loops on the CSM and one water-glycol loop on the LM (apollo_diode.md:97),
    # and a reader taking this block for the loop list would have sized the wrong vehicle. The ids
    # now match the domain's, which is what `check_thermal_bindings` holds them to.

      - id: loop_primary
        vehicle: csm
        fluid: "62.5 % ethylene glycol / 37.5 % water"
        # The fluid's density, the loop's published nominal flow in the unit its source publishes
        # it in, and the coolant mass the two of them put in the loop. Until this round all three
        # lived inside two relations in `domains/thermal/components.yaml` — "25 L of 62.5/37.5
        # glycol-water at 1,050 kg/m3 is 26.25 kg" and "25 L at the published 200 lb/hr ... gives
        # 1,042 s of transit" — and a relation is prose. See the domain's copy for why the band and
        # the nominal are in different units.
        fluid_density_kg_m3: 1050
        nominal_flow_lb_per_h: 200
        coolant_mass_kg: 26.25
        flow_l_min: [1.3, 1.7]
        # The mixed supply is a *single* figure and the evaporator outlet is the range, which is what
        # this entry's own source says: "mixed supply 45 F = 7.2 C, evaporator outlet 41.5 F = 5.3 C
        # over a 37-45 F range". The two were the wrong way round until round 56 — `supply_c` carried
        # the evaporator's 2.8-7.2 C span and `evaporator_outlet_c` carried the midpoint of the span it
        # should have been. It matters because the cabin's equilibrium temperature is the supply plus
        # its own heat rise, and using the evaporator's *cold* end as a cabin supply put both cabins
        # below their own low limit: 8.66 C against a 10 C floor, which the vehicle would have tripped
        # every cold pass. `check_cabin_equilibrium` re-derives it.
        supply_c: 7.2
        # **`return_c` was this field's name until round 37, and the name was the defect.** The band
        # is the glycol coming *back* through the radiator, which the loop mixes up to 45 F at the
        # evaporator inlet — `csm_ecs_study_guide.pdf`, PDF p. 74: "if the temperature is less than
        # 45 F the glycol temp control valve will [bypass] to mix with the returning cold glycol to
        # obtain 45 F at the inlet to the evaporator". The corpus's prose called the return the
        # station *after the coldplates*, which is the radiator inlet — and that inlet is published
        # at 73-75 F, sixteen kelvin above this band's top and above the return channel's own >20 C
        # warning. Two names for one station, one name for two stations, and nothing joined a loop's
        # station to the channel that reads it. The station is named now, and
        # `check_thermal_bindings` refuses a loop that carries both `return_c` and
        # `radiator_inlet_c`, because on a loop with a radiator two different things return.
        radiator_outlet_c: [5, 15]
        evaporator_outlet_c: [2.8, 7.2]
        # The hot side, and the loop's own published figure for it: 73-75 F. This is the station the
        # corpus's prose called the return; it is the *loads*' return, not the radiator's.
        radiator_inlet_c: [22.8, 23.9]
        evaporator_actuation_c: 9.4
        loop_volume_l: 25
        # **Which state carries this loop's collected load.** The load is the sum over the zones
        # that name the loop in their `cooled_by` — the cabin, the service bay and the avionics bay,
        # 1,723 W — and the state is named here rather than found by convention, for the reason
        # round 38 wrote down when the zone's `heat_state` was added: a link that is looked up by
        # naming rule is a link that goes quiet when the name moves.
        load_state: loop_primary_load_w
        provenance:
          basis: historical
          source: "TN D-6718 and NR ch.14: primary loop 200 lb/hr, about 1.44 L/min of glycol-water and inside apollo's own 1.3-1.7 L/min band; mixed supply 45 F = 7.2 C, evaporator outlet 41.5 F = 5.3 C over a 37-45 F range, radiator inlet 73-75 F, evaporator actuating above 49 F. Total coolant mass is NOT published — only a 1 gal reservoir — so loop_volume_l is chosen"
      - id: loop_secondary
        vehicle: csm
        fluid: "62.5 % ethylene glycol / 37.5 % water"
        fluid_density_kg_m3: 1050
        coolant_mass_kg: 18.9
        flow_l_min: [1.0, 1.5]
        loop_volume_l: 18
        provenance:
          basis: chosen
          reason: "apollo_diode.md:97 names two water-glycol loops with primary and secondary pumps and gives figures for neither, so the secondary is scaled from the primary: 1.0-1.5 L/min and 18 L against the primary's 1.3-1.7 and 25. The thermal domain carries the same choice for the same reason, and this entry exists because until round 43 it did not — the file that is supposed to be the loop list had the LM's loop under this name instead"
      - id: loop_lm
        vehicle: lm
        fluid: "65 % water / 35 % inhibited ethylene glycol"
        flow_l_min: [1.5, 1.9]
        # Chosen, and the only figure in this entry that is not published. TN D-6724 gives the LM
        # loop's *operating* range as +29 to +120 F = -1.7 to 48.9 C and no supply temperature at
        # all, and this field carried `[1.7, 12]` until round 56 — the magnitude of the operating
        # range's cold end, with its sign lost, paired with an upper bound from nowhere. It is set to
        # the CSM's mixed supply because both loops serve a cabin at 5 psia through the same 125 W/K
        # conductance, so the two hundred-odd watts of difference between the compartments is the
        # whole of the difference between them. The alternative considered is that discarded cold
        # end, -1.7 C: it puts the LM cabin at 4.9 C against its own 10 C floor, which is not a
        # modelling subtlety but an impossible vehicle
        supply_c: 7.2
        return_c: [8, 20]
        coolant_mass_kg: 11.3
        # The LM's own collected load: its cabin and its descent stage, 1,007 W.
        load_state: loop_lm_load_w
        provenance:
          basis: historical
          source: "TN D-6724 and NR ch.6: LM loop 222 lb/hr minimum, about 25 lb of coolant, operating +29 to +120 F = -1.7 to 48.9 C — an operating range and not a supply temperature, which is why `supply_c` below is `chosen` rather than sourced. The fluid is the LM's own mixture and not the CSM's — 65 % water against 62.5 % glycol — which is the single clearest reason the two are separate loops rather than one loop with two pumps"
  radiators:

      - id: csm_radiator
        vehicle: csm
        panels: 2
        area_m2: 9.1
        rejection_w_per_panel: 1294
        provenance:
          basis: historical
          source: "NR and TN D-6718: two panels of about 49 sq ft each, about 4,415 Btu/hr per panel = 1,294 W"
      - id: csm_evaporator
        vehicle: csm
        rejection_w: 2345
        provenance:
          basis: historical
          source: "NR: about 8,000 Btu/hr = 2,345 W; the evaporator consumes water, which is why water_cooling is a scored resource"
      - id: lm_sublimator
        vehicle: lm
        rejection_w: 3649
        water_consumption_kg_per_h: 5.171
        provenance:
          basis: historical
          source: >-
            `lunar_module_environmental_control_subsystem.pdf`, PDF p. 88, "Item 209 SUBLIMATOR",
            Spec. no. SVHS 2405, Variable Conditions table: max normal heat load **12,450 Btu/hr** at
            100 F coolant inlet with **0.19 lb/min** evaporant flow. 12,450 x 0.29307107 = 3,648.7 W,
            rounded to 3,649 as the CSM's 8,000 Btu/hr was rounded to 2,345; 0.19 lb/min x 60 x
            0.45359237 = 5.171 kg/h. Read from the rendered page
          note: >-
            **"NOT published in any source reached" named four documents that do not have it, and the
            LM's own ECS subsystem specification has both figures on one line of one table.** This
            entry carries the water rate because the water is the LM's own — the vehicle's
            water-rejection cycle is denominated in the CSM's latent heat, and the sublimator's
            *mixed* mode gives it a higher effective one (1,092 Btu/lb against the cycle's 2.45e6
            J/kg = 1,053 Btu/lb). `check_thermal_bindings` holds this copy against
            `domains/thermal/components.yaml#sublimator_lm` through `vehicle_keys`, so the two cannot
            drift and the field has a reader on both sides. **The budget's totals are split by
            vehicle** (`csm_rejection_capacity_w` and `lm_rejection_capacity_w`) because this
            capacity landing in a single `total_rejection_capacity_w` would have added the LM's
            sublimator to a number whose own relation argues a CSM margin
  zones:

      - id: csm_cabin
        limit_c: [10, 30]
        regulated: true
        dwell_min_s: 30
        # The thresholds that implement the band above. Declared rather than inferred: a zone's
        # band is not always held by a threshold on the zone's own channel — `csm_avionics_bay`'s
        # is held by a plate threshold — and `lm_descent_bay` has a warning *inside* its band that
        # is not the band at all.
        implemented_by: [csm_cabin_low, csm_cabin_high]
        volume_m3: 5.9
        # The cabin's nominal state, which the ideal-gas law's two derivatives are taken at. Until
        # this round both numbers lived only in prose: 5 psia is in this entry's own `source` string
        # and in `atmosphere_model`'s `check`, and 295 K is in that check and in two states'
        # relations. The pressure is declared in psia because that is the unit NR publishes it in
        # and the unit this vehicle's cabin-pressure channel and thresholds already use; the two
        # edges that differentiate the law convert it, the way `E-BUS-PUMP` converts pounds.
        nominal_pressure_psia: 5
        nominal_temperature_k: 295
        # What this compartment *is* in the model, declared rather than looked up by convention.
        # `check_cabin_equilibrium` used to find all four of these by hand — a literal map for the
        # loop, `f"cabin_heat_{zone.split('_')[0]}_w"` for the heat, a scan for a node named
        # `cabin_zone_t` for the temperature, and `f"cabin_eq_{zone.split('_')[0]}_k"` for the
        # equilibrium — and each lookup ended in a `continue`, so renaming `cabin_heat_csm_w`
        # turned the check off in silence. The links are declarations now, and a link that does not
        # resolve is refused.
        cooled_by: loop_primary
        temperature_state: zone_csm_cabin_t
        heat_state: cabin_heat_csm_w
        equilibrium_state: cabin_eq_csm_k
        provenance:
          basis: apollo
          ref: "apollo_diode.md:89"
          note: "cabin_temp_c events are <10 and >30; NR gives 210 cu ft habitable = 5.9 m3 at 5 psia. Paired thresholds with a minimum dwell are mandatory for a regulated zone (thermal_diode.md:131)"
      - id: csm_avionics_bay
        limit_c: [10, 50]
        regulated: true
        # Every zone names the state its temperature lives on, and until round 51 only the
        # two cabins did. The check that needs the link found it by matching the zone's own
        # words against the state ids instead, and for both cabins the word it matched was
        # `cabin` — so each cabin's verdict was computed from a list holding *both* cabins'
        # states, and one cabin's state could sit on the `internal` sentinel undriven while
        # the check stayed quiet on the other's account. `temperature_state` is the link
        # `check_cabin_equilibrium` already read for the two cabins; it is universal now.
        temperature_state: zone_csm_avionics_t
        dwell_min_s: 30
        # A plate threshold, on `thermal.avionics_plate_c` rather than a zone channel, because the
        # avionics bay's temperature is the coldplate's — which is what makes this link one that
        # had to be declared rather than derived from a channel name.
        implemented_by: [avionics_plate_high]
        # **The last heated zone to get a heat-rate state, and the reason it was last is a graph
        # question rather than a figure.** `heat_inputs.csm_avionics_bay` assigns the IMU, the
        # guidance computer and the instrumentation — 360 W — and `avionics_bay_heat_w` sums them
        # now. It sits on the `internal` sentinel: an edge carrying watts into this zone's node
        # would become its lag's canonical driver and relax a kelvin state toward a watt, and the
        # equilibrium state that would avoid that needs the structure plate's temperature as a
        # *value*, which arrives today as an edge sensitivity rather than as a state.
        cooled_by: loop_primary
        heat_state: avionics_bay_heat_w
        provenance:
          basis: apollo
          ref: "apollo_diode.md:105"
          note: "avionics_plate_c event is >50"
      - id: csm_service_bay
        limit_c: [-20, 60]
        regulated: false
        temperature_state: zone_csm_service_t
        # The bay's 630 W is `service_bay_heat_w`, and it is declared here rather than found by
        # convention: the check that holds a heat rate against its loads used to look the state up
        # by node name (`cabin_heat_{rate}`) and skip in silence when that missed, which it did for
        # four of the six zones.
        cooled_by: loop_primary
        heat_state: service_bay_heat_w
        provenance:
          basis: chosen
          reason: "unregulated in this model; its temperature matters through the propellant and pressurant it contains, which is where the F-09 frozen-line chain lives"
      - id: lm_cabin
        limit_c: [10, 32]
        regulated: true
        dwell_min_s: 30
        implemented_by: [lm_cabin_low, lm_cabin_high]
        volume_m3: 6.7
        # The LM's cabin is at the same nominal as the CSM's — the corpus's own relation for the
        # second `E-ZONE-ATM` edge says "at the LM's nominal 5 psia and 295 K" — so the two edges
        # derive the same 116.86 Pa per kelvin from two zones' figures rather than from a literal
        # they shared.
        nominal_pressure_psia: 5
        nominal_temperature_k: 295
        cooled_by: loop_lm
        temperature_state: zone_lm_cabin_t
        heat_state: cabin_heat_lm_w
        equilibrium_state: cabin_eq_lm_k
        provenance:
          basis: historical
          source: "NR: LM cabin 235 cu ft pressurised = 6.7 m3 at about 5 psia, roughly 160 cu ft habitable. The limits mirror the CSM cabin's because no source distinguishes them"
      - id: lm_descent_bay
        limit_c: [-30, 50]
        regulated: false
        temperature_state: zone_lm_descent_t
        # The frozen-line chain's zone: 180 W of landing radar and RCS heaters, and the same join as
        # the service bay's — declared, so the state that carries the heat is found by the
        # declaration rather than by a naming convention that only ever matched the cabins.
        cooled_by: loop_lm
        heat_state: descent_bay_heat_w
        provenance:
          basis: chosen
          reason: "the descent stage is exposed and unregulated; its thermal state is what the frozen-line chain needs"
      - id: radiator_loop
        limit_c: [null, null]
        regulated: false
        temperature_state: zone_radiator_t
        # No `cooled_by` and no `heat_state`: the domain lists this zone in `unheated`, with the
        # reason, so "nothing heats it and no loop serves it" is a declaration rather than the
        # absence of one.
        provenance:
          basis: chosen
          reason: "the radiator is an observable with no command interface (simulator-design.md:158): a rejection curve, not a limit"

# --------------------------------------------------------------------------------------
# Communications. The domain no specification covers — `communcations_diode.md` contains
# zero occurrences of snr, antenna, pointing, carrier or S-band (conflict register C-14) —
# so this is authored from apollo_diode.md:161-168, :786-790 and the news references.}}
#
# One correction worth its own lines: apollo_diode.md:157 gives "36 W input for the basic
# S-band transceiver and 72 W input for the S-band power amplifier". Those are ELECTRICAL
# input powers; the RF outputs are 2.8 W and 11.2 W. Modelling 36 W as radiated power would
# overstate the link by an order of magnitude while understating the electrical load by the
# same factor — and the two errors do not cancel, because they appear in different equations.
# --------------------------------------------------------------------------------------
comms:

  transmitters:
    - id: sband_transceiver
      dc_w: 36
      rf_w: 2.8
      provenance:
        basis: historical
        source: "apollo_diode.md:157 for the 36 W input; NR ch.18 for the 2.8 W RF output as built, against 5 W in the 1965 SP-87 design"
    - id: sband_power_amplifier
      dc_w: 72
      rf_w: 11.2
      provenance:
        basis: historical
        source: "apollo_diode.md:157 for the 72 W input, NR ch.18 for 11.2 W RF. The 36 W electrical step when this switches on is the triggering load of the degraded chain (apollo_diode.md:1140)"
    - id: lm_sband_low
      dc_w: 20
      rf_w: 0.75
      provenance:
        basis: historical
        source: "PSR: LM S-band 0.75 W low power. The dc_w figure is chosen: no LM transmitter input-power figure was found"
    - id: lm_sband_high
      dc_w: 90
      rf_w: 18.6
      provenance:
        basis: historical
        source: "PSR: LM S-band 18.6 W high power. The dc_w figure is chosen, as above"
  antennas:
    - id: high_gain
      # `pattern` is the declaration `check_antenna_patterns` needs to be a rule rather than a rule
      # with a silent exception in it: an aperture's half-power beamwidth is its gain's own
      # consequence, and the three feeds below are feeds on this one aperture, so the declaration
      # governs them too. Its own provenance note states the relation and does the arithmetic; this
      # is the field that lets a tool do it on every run.
      pattern: aperture
      gain_db: 26.7
      beamwidth_deg: 9.4
      steerable: true
      beams:
        - {id: wide, gain_db: 9.2, beamwidth_deg: 70.4}
        - {id: medium, gain_db: 20.7, beamwidth_deg: 18.7}
        - {id: narrow, gain_db: 26.7, beamwidth_deg: 9.4}
      provenance:
        basis: historical
        source: "NR ch.18: four 31-inch parabolas plus an 11-inch horn, transmit gain 9.2/20.7/26.7 dB in wide/medium/narrow beam. The narrow-beam 26.7 dB figure is the one a pointing-error channel is meaningful against"
        note: >-
          the gains are sourced and the beamwidths are **derived**, because the first version of
          this entry carried `beamwidth_deg: 1.0` and that number is not physically possible
          beside a 26.7 dB gain. Any aperture antenna obeys the gain-beamwidth product
          `G = 41253 / theta^2` with theta in degrees, so 26.7 dB (467.7 linear) is a 9.4 deg
          beam — a 1.0 deg beam would need 46 dB. The error was invisible until `domains/comms/`
          landed, because the beamwidth is what the pointing-error channel and `E-GEOM-LINK` both
          scale against, and it is the *corrected* figure that makes apollo's own threshold
          coherent: `apollo_diode.md:163` calls 0-2 deg a good link and warns above 2 deg, and at
          2 deg off a 9.4 deg beam the quadratic pattern is only 0.54 dB down. Against a 1.0 deg
          beam the same 2 deg would be 48 dB down, which would make apollo's "good link" range a
          range in which no link exists
    - id: omni_a
      pattern: near_isotropic
      pattern_note: >-
        the gain-beamwidth product is meaningless this close to isotropic — it would put a 2 dB
        radiator at 161 degrees — so the 180 here is a nominal coverage figure rather than a
        half-power width, and the two figures are independent. The sentence used to live in the
        `provenance` note below, where the relation it is about is stated and nothing reads it; it
        is the justification for an exemption from a rule, so it belongs with the declaration of
        the exemption
      gain_db: 2
      beamwidth_deg: 180
      steerable: false
      provenance:
        basis: historical
        source: "NR: four flush omni helices rated 15 W continuous; the individual gain is chosen to a nominal 2 dB"
    - id: omni_b
      pattern: near_isotropic
      pattern_note: >-
        the second of the four flush helices, identical to `omni_a` in every figure, so it carries
        the same declaration for the same reason: a nominal 180-degree coverage figure that the
        gain-beamwidth product does not determine and would put at 161 degrees. Written out here
        rather than pointed at, because a note whose content is another entry's is a note that
        reorders badly and reads as sourced either way
      gain_db: 2
      beamwidth_deg: 180
      steerable: false
      provenance:
        basis: historical
        source: "the second of the four flush omnis, so an antenna selection has a safety-relevant alternative"
    - id: sband_steerable
      gain_db: UNCONFIGURED
      beamwidth_deg: UNCONFIGURED
      steerable: true
      vehicle: lm
      provenance:
        basis: UNCONFIGURED
        note: >-
          the LM's steerable S-band antenna, and the fourth member of the `comm.antenna` enum
          (`apollo_diode.md:164`) that this block did not declare — the linter now refuses that
          mismatch, the same discipline the phase and posture vocabularies get. Neither its gain
          nor its beamwidth is published in any source reached: the LM's S-band is documented by
          *power* (0.75 W low, 18.6 W high, `transmitters` below) and the antenna itself only as
          steerable. Both values are owed rather than picked, because a gain invented here would
          propagate into `E-GEOM-LINK` and from there into every SNR a fleet ever reads
  rates:
    - id: low
      bps: 1600
      provenance:
        basis: apollo
        ref: "apollo_diode.md:7, :165"
    - id: high
      bps: 51200
      provenance:
        basis: apollo
        ref: "apollo_diode.md:7, :165"
  vhf:
    lm_channel_a_mhz: 296.8
    lm_channel_b_mhz: 259.7
    csm_transceiver_w: 5
    provenance:

# --------------------------------------------------------------------------------------
# Electrical. The fuel-cell reactant rate is the figure that ties the O2 inventory to the
# bus; apollo_diode.md:780-784 calls that coupling particularly important and it is the spine
# of the crisis chain.
# --------------------------------------------------------------------------------------
electrical:

  # **The electrical inventory is declared twice, and nothing joined the two.** This section is the
  # vehicle-level view: what the vehicle carries, with the mass each item contributes to the mass
  # closure. `domains/power/components.yaml` is the domain's view: the same hardware, one entry per
  # unit, with the bus each load sits on and the protection between them. Both are right, and they
  # are two views of one machine rather than two machines — but nothing said so and nothing compared
  # them, so a change to either would have diverged in silence.
  #
  # `domain_group` is the link, declared rather than inferred: the two files name the same batteries
  # differently (`csm_entry` against `battery_csm`), and a rule that guessed from the string would
  # have to know that `entry` and `csm` are the same vehicle.
  fuel_cells:
    domain_group: fc
    modules: 3
    power_w_each: 1420
    bus_v: [27, 31]
    # **The operating point the reactant chain was missing.** `bus_v` is the rated band and these
    # three are the numbers a division needs: the nominal the band is centred on, the cell count
    # that makes it a per-cell voltage, and the reactant rate per ampere of stack current. Every
    # consumer derives from them rather than restating them — `per_joule_kg` on `fc_o2_draw_kg_s`,
    # both reactant edges and the waste-heat edge.
    output_v: 29
    cells_per_module: 31
    h2_lb_per_h_per_a: 0.00257
    # The reaction's own masses, so the O2:H2 ratio is a division rather than a third
    # declaration. 2 * 0.002016 / 0.032 = 0.126, which is **7.9365 kilograms of oxygen per
    # kilogram of hydrogen** — not the rounded 8:1 the corpus carried as `0.125`, and the
    # Mission E analysis's own 7.936 is an independent corroboration of the exact figure.
    reactant_molar_mass_kg_per_mol: {h2: 0.002016, o2: 0.032}
    reactant_sustain_flow_kg_per_h: {o2: 4.72, h2: 0.46}
    provenance:
      basis: historical
      source: >-
        TN D-7142 and NR: three modules at 563-1,420 W each, 27-31 V dc, cryogenic O2 and H2. NR
        p.110 gives tank-sustain flows of 10.4 lb O2/hr and 1.02 lb H2/hr total = 4.72 and 0.46
        kg/h. Apollo 11 produced about 393 kWh over 195 h at an average 68.7 A on a 29.4 V CM bus, a
        2.02 kW average load (derived). The operating point is
        `ApolloTrainingElectricalPowerSystemStudyGuide.pdf` PDF p. 14, printed p. 3.1-1, "DC system":
        "The three fuel cell modules are activated prior to launch. Each is rated at **29 +- 2 VDC**
        and can normally produce up to **1420 watts**" — read from the rendered page, because the
        text layer renders the sign as a plus and the figure as "{420" — and PDF p. 38: "the primary
        loop is comprised of the H2 exhaust side of each of the **31 cells**". The reactant rate is
        `Apollo_Mission_E_Spacecraft_Reference_Trajectory_Vol4_Consumables_Analysis.pdf` PDF p. 16,
        CSM EPS assumptions 1 and 2: "EPS hydrogen consumption rate = **.00257 x I_FC** (lb/hr)" and
        "EPS oxygen consumption rate = **7.936 x** hydrogen consumption rate"
      note: >-
        **This block used to end "A kg-per-kWh reactant figure is NOT published", and the figure it
        denied was one division away from three published numbers.** The per-kWh figure is the
        per-joule figure times 3.6e6, and the per-joule figure is the hydrogen rate divided by the
        module's output voltage — so the reactant chain's last unknown was the *operating point*,
        not an electrochemistry. 0.3216 kg O2 per kWh and 0.0402 kg H2 per kWh are now derived on
        `domains/power/components.yaml#state fc_o2_draw_kg_s.per_joule_kg` rather than quoted here.
        The source's own oxygen-to-hydrogen ratio is 7.936 where the stoichiometry is exactly 8, and
        **the corpus carried this ratio as 0.125, the rounded 8:1, and its own relation computed
        0.1260 from the molar masses two lines away** — a live contradiction between a value and
        the arithmetic stated beside it. The ratio is now derived from the molar masses in this
        block, so it is 0.126 and it cannot drift; the Mission E analysis's 7.936 is an
        independent corroboration, which is why the analysis's own oxygen rate and the
        stoichiometric one now agree to four significant figures
  batteries:
    csm_entry:
      domain_group: battery_csm
      count: 3
      ah: 40
      chemistry: "silver-oxide/zinc"
      open_circuit_v: 37.2
      min_loaded_v: 27
      mass_kg_each: 12.7
      provenance:
        basis: historical
        source: "NR and PSR: 3 x 40 Ah rated, 20 cells, 28 lb each. From Apollo 14 the SM carried a 400 Ah (12 kWh) auxiliary battery — the change Apollo 13 forced"
    lm_ascent:
      domain_group: battery_lm_ascent
      count: 2
      ah: 296
      v: 28
      mass_kg_each: 56.7
      provenance:
        basis: historical
        source: "NR: 2 x 296 Ah at 28 V, 50 A for 5.9 h, 125 lb each"
    lm_descent:
      domain_group: battery_lm_descent
      count: 4
      ah: 400
      v: 28
      mass_kg_each: 61.2
      provenance:
        basis: historical
        source: "NR and PSR: 4 x 400 Ah on Apollo 11, 5 x 415 Ah from Apollo 15, 135 lb each. Apollo 11's descent batteries delivered 1,055 Ah of a nominal 1,600 Ah"
    note: "The LM has no fuel cells; its batteries are the sole power source (PSR, NR equipment list). That is what makes LM power a countdown rather than a budget, and it is the constraint that turns the crisis posture into a resource-allocation problem."
open_debts:
  - "The power inventory's relationships are **held**; the case they exist for is not computed. `check_power_inventory` holds five of them — the per-vehicle demand sum against the declared total, every load's `bus` being a bus of its own vehicle, each vehicle's source capacity against the load connected to it, the batteries' `ah x v_nominal` against the energy the load budget states, and every load's `inrush_w` against its own `demand_w` — and it holds the first four per **vehicle** rather than per bus for a reason it states: which bus a source ties to is a routing decision the tie itself makes, and no file declares it. What nothing computes is the **bus peak at switching**, which is the number the flagship chain turns on: a 72 W amplifier switching on against a 250 W coolant pump whose own start is 420 W, where the sag is what drops the pump and the pump is never the root fault. That needs the per-bus routing the relationships above declined to assume, so on this corpus the transients are bounded and unspent rather than missing."
  - "**The LM ascent stage at jettison weighs 34 kg less than its own components say it should.** `lm_ascent_stage`'s source gives the ascent stage at liftoff as 10,777 lb = 4,888 kg and at jettison as 5,463 lb = 2,478 kg, 'the difference being the ascent propellant burned'. But the declared components at that moment are dry 2,132 + RCS propellant 288 + consumables 92 = **2,512 kg** with no ascent propellant left, and 2,512 is 34 kg more than the published 2,478. Put the other way: the flight's own masses imply 2,410 kg of ascent propellant burned, while the declared load is 2,376 kg — so either the load is 34 kg light or one of the stage masses is 34 kg heavy, and no source here says which. It matters beyond bookkeeping: `csm_lm_ascent_docked` above is the configuration a fleet flies the final 7.5 hours of the lunar-orbit phase in, and its mass is one of the two numbers a rendezvous propellant budget would be checked against. Resolving it means a source for the ascent stage's dry mass that the corpus does not have, so it is named rather than assumed."

  - "Node heat capacities and conductances for the six thermal zones. thermal_diode.md:965 declares every thermal constant UNSPECIFIED and refuses to infer them; without them the thermal edges have no tau and the thermal domain cannot be integrated. This is the largest single debt in the vehicle."
  - "LM sublimator rejection capacity and water consumption rate: genuinely unpublished, and it is half of the thermal water budget."
  - "Minimum impulse bit and minimum qualified firing time for all three RCS systems: not published in any source reached. The 4 ms figure in rcs_diode.md:91 is a Voyager anecdote its own text flags as hardware-specific, so it is not adopted. `domains/rcs/` bounds the consequence instead of filling the hole: rcs_diode.md:800-825's residual accumulator preserves mean delivered impulse whatever the constant is, so the error is unbounded in *phase* and zero in *mean* — and RCS-11 names the one case that is not benign, where the accumulator grows and the thruster silently stops complying."
  - "Thruster geometry for the forty-four RCS thrusters: each unit thrust direction and lever arm from the centre of mass. rcs_diode.md:685-693 builds the allocator's wrench matrix B from them, so without them the allocator cannot select jets and the deadband has no derivation."
  - "Retrograde and ullage motor behaviour, and the LM descent engine's 65-92.5 % non-operating region: both named in the sources and neither yet modelled. The non-operating region matters because it makes a throttle command between 65 % and 92.5 % impossible rather than merely unwise."
