# vehicle.yaml — the globals: mass, configuration, frames, propulsion, loads, zones.
#
# This is the file the corpus does not contain. `corpus-review.md` §3 established that by
# grep: `apollo_diode.md` has no mass, no inertia, no centre of mass, no thrust, no Isp and
# no mission duration — `mass` appears only as a thing to be hidden (:36) or depleted
# (:743) — and `rcs_diode.md:119-121` confirms each absence from the other side, naming what
# it blocks. So the numbers below are `historical` (published figures about the real
# vehicle, each with a source) or `derived` from them or `chosen` to make the simulation
# run. None is `apollo`, because apollo has none of them.
#
# SOURCES. Values marked A11 come from the Apollo 11 Mission Report (NASA MSC-00171,
# https://ntrs.nasa.gov/api/citations/19710015566/downloads/19710015566.pdf), which is
# flight-measured rather than design. PSR is the Apollo Program Summary Report (JSC-09423,
# https://ntrs.nasa.gov/citations/19750013242); NR is the Apollo Spacecraft News Reference
# and the LM News Reference (https://archive.org/details/apollo-spacecraft-news-reference-1968,
# https://archive.org/details/apollo-lunar-module-news-reference-1971); SP4029 is Apollo by
# the Numbers (NASA SP-2000-4029). Two warnings carried from that pass:
#
#   * the Rockwell press-kit SM dry mass of 13,475 lb does NOT close against flown weights —
#     with the SPS and RCS loads it gives 55,613 lb for a CSM that weighed 63,473 lb
#     *including* a 12,200 lb command module. The SM inert mass implied by flight residuals
#     is 8,700-9,000 lb, and that is what is used here. Design and flight figures are not
#     interchangeable, and the press kit is a design figure.
#   * the widely repeated LM descent-engine Isp of 311 s traces only to Wikipedia. The NASA
#     end-of-duty-cycle design requirement is 305 s, and 305 s is what this vehicle uses.
#
# A word on what this vehicle is. It is Apollo-*shaped*, not Apollo. `apollo_diode.md:1206`
# warns against matching the historical labels closely enough that an agent can shortcut the
# diagnosis by recognising the mission, so the masses, thrusts and loads below are the real
# ones — they are what make an inference correct or incorrect — while the mission profile and
# the failure schedule are this vehicle's own.
#
# Units are SI internally (conflict register C-17); imperial appears in comments beside the
# conversion, because losing the original is how a unit error becomes unfindable.

schema_version: 1
source: docs/deep_research/apollo_diode.md
vocabulary: docs/deep_research/integration/reconciliation/02-canonical-vocabulary.md

# The two spacecraft the vehicle is made of. **This is the only place the corpus says how many
# there are**, and until this round nothing said it at all: `vehicle:` appears sixty-seven times
# across the domains — every power source, load and bus, every atmosphere, every thermal zone and
# every component the crew can be in — and no list existed to hold a value against, so
# `vehicle: csmx` composed. The key also carried two other meanings, which is why the rule could
# not simply be written: `mission.yaml` used it for the *document* (`vehicle: vehicle.yaml`) and
# `presentation.yaml`'s conformance table used it for the narrative of what this side does about a
# check. Both are renamed — `vehicle_document` and `disposition` — and every remaining `vehicle:`
# names one of these two.
spacecraft:
  - csm
  - lm


# --------------------------------------------------------------------------------------
# Frames and conventions. `gnc_diode.md:382` states the rule this block exists for: "no vector
# is valid without a declared frame", and it goes further than a frame list — it fixes four
# conventions that a vehicle can get silently wrong, because every one of them is a *convention*
# rather than a quantity. Two agents can disagree about a quaternion's component order while
# both being right about the physics, and nothing downstream would report the disagreement: the
# attitude would simply be wrong, in a way that looks like a control problem.
#
# So the four conventions are declared once, here, and `domains/gnc/` is what enforces them:
#
#   quaternion order      [w,x,y,z]. gnc_diode.md:405 fixes it explicitly, and it is the single
#                         most consequential line in the document — apollo publishes
#                         `gnc.attitude_q[0..3]` (apollo_diode.md:117) and says nothing about
#                         which component is first
#   rotation direction    `attitude_ref_from_body` rotates a vector from BODY into the named
#                         reference frame (gnc_diode.md:406). The opposite convention is equally
#                         common and differs by conjugation, i.e. by the sign of the rotation
#   angular velocity      identifies which frame rotates relative to which, and in which frame
#                         the components are resolved (gnc_diode.md:407). A rate with no
#                         resolution frame is not a vector
#   covariance units      documented per block rather than behind one generic unit
#                         (gnc_diode.md:408) — this vehicle's 15-state error vector has five
#                         3-vectors with five different units
#
# Mission time is monotonic and cannot jump backward (`gnc_diode.md:409`). That is a property of
# `mission.met_s` rather than of a frame, and it is recorded here because it is the convention a
# clock correction is most likely to violate: `avionics.clock_offset_ms` may be corrected, and
# MET may not.
# --------------------------------------------------------------------------------------
conventions:
  # `units: SI` was the only one of the six that a reader could hold the corpus to, and it was
  # **false**: the registry publishes `psia`, `mmHg`, `ft3/min`, `degC` and seven more, deliberately,
  # because `channels.yaml`'s header says the apollo rows are the catalogue "verbatim — identifiers,
  # units, ranges, precisions and rates included". The claim is now the claim the corpus can keep,
  # and the exceptions are part of it rather than an escape from it: `check_conventions` refuses a
  # channel unit that is neither SI, dimensionless nor declared here — and refuses an entry here
  # that no channel uses, or that is SI already.
  units: >-
    SI, except for the units a channel's own source publishes and the registry keeps verbatim.
    Every conversion the corpus performs is written where it is used — 0.45359237 kg per lb,
    6,894.757293168361 Pa per psi, 2.45e6 J per kg of water, 3,600 J per Wh — rather than
    presupposed by the channel's unit, because the fleet reads what the source published
  units_exceptions:
    psi: "apollo publishes tank and cabin pressures in pounds per square inch; this is the gauge or differential reading, and the absolute one is `psia`"
    psia: "as `psi`, absolute: the cabin's 5 psia is the figure every atmosphere computation in this corpus is anchored to (`atmosphere_model.check`, and the two cabin oxygen initials that derive from it)"
    mmHg: "partial pressures are published in millimetres of mercury, which is the medical convention and the unit the ppO2 thresholds and their alarms are written in"
    degC: "every temperature channel is published in degrees Celsius, from the same sources that give the cabin's 295 K nominal — the two meet in `atmosphere_model` and in the thermal zones, and the conversion is the +273.15 on the initial's own derivation"
    deg: "angles: apollo publishes degrees, and the pointing errors, deadbands and alignment budgets are all written in them"
    deg/s: "angular rates, as `deg`: the SI alternative is rad/s and it appears nowhere in the corpus except in `covariance_units` below"
    ft3/min: "the suit loop's flow is published in cubic feet per minute and no source states it any other way"
    L/min: "the coolant loops' flows are published in litres per minute; the loop relations convert to kg/s with the fluid density declared beside them"
    Wh: "battery energy is published in watt-hours and the load budget states it that way; `battery_charge_j` converts once, with `initial_factor: 3600`"
    rpm: "pump speed is published in revolutions per minute and no source gives rad/s"
    g: >-
      standard gravity, not grams — and the symbol collides, which is why it is declared rather
      than assumed: `structure.accel_xyz_g` is an acceleration in g, while `g/s` on the two
      mass-flow channels is grams per second. The map that decides dimensions knows only one of
      the two senses
  # The order is `[w,x,y,z]` and this is the one declaration of it: a site that states an order
  # names this path in `quaternion_order_source`, and `check_conventions` resolves it and compares.
  # `domains/rcs/commands.yaml`'s quaternion argument and `domains/gnc/points.yaml`'s `attitude_q`
  # are the two sites, and the generated `HELP.md` renders the order beside the argument so that a
  # fleet is told the same thing the vehicle believes.
  quaternion_order: "[w,x,y,z]"
  quaternion_direction: "attitude_ref_from_body — rotates a coordinate vector from BODY into the named reference frame"
  angular_velocity: "the frame rotating relative to the frame it is measured against, resolved in the vehicle's BODY frame unless a channel says otherwise"
  # Per block, not one generic unit — and written as blocks rather than as a sentence, because the
  # domain has to be able to *cite* it: `domains/gnc/components.yaml#estimator` declares the same
  # five units for its error vector, and `nav_covariance`'s own `unit` is the five of them in the
  # error vector's order. Three copies, none of them joined until `check_conventions` read this one.
  # The block names are the error vector's, so the order of `error_vector` is what fixes the order
  # of the matrix's blocks.
  covariance_units:
    per_block: true
    blocks:
      delta_position: m^2
      delta_velocity: "(m/s)^2"
      delta_theta: rad^2
      accel_bias: "(m/s^2)^2"
      gyro_bias: "(rad/s)^2"
    note: >-
      the five units are the error vector's, one per 3-vector, and they are why the covariance
      cannot be published as one quantity: a 15x15 matrix whose diagonal is in five different units
      is a matrix, not a number, and `gnc.nav_position_sigma_m` is one diagonal of it
  mission_time: "monotonic, and it cannot jump backward"
  provenance:
    basis: historical
    source: "gnc_diode.md:382-409 — the frame registry fields, the four scalar conventions, and the monotonicity rule"

frames:
  - id: EARTH_J2000
    origin: earth_centre
    axes: j2000
    central_body: earth
    rotating_or_inertial: inertial
    orientation_parent: none
    revision: 1
    provenance:
      basis: chosen
      reason: "the inertial frame for cislunar integration; apollo_diode.md:743 asks for Earth/Moon gravity in a rigid-body 6-DOF model and names no frame"
  - id: MOON_J2000
    origin: moon_centre
    axes: j2000
    central_body: moon
    rotating_or_inertial: inertial
    orientation_parent: none
    revision: 1
    provenance:
      basis: chosen
      reason: "gnc_diode.md:1175 uses this exact string as an illustrative frame_id and never defines it; this gives it a definition and a revision"
  - id: LVLH
    origin: vehicle
    axes: "local vertical, local horizontal"
    central_body: mission-dependent
    rotating_or_inertial: rotating
    orientation_parent: EARTH_J2000 while Earth-referenced, MOON_J2000 while lunar
    revision: 1
    provenance:
      basis: chosen
      reason: "the frame a crew or a flight director reasons in; landing-radar work is natural here"
  - id: BODY
    origin: vehicle
    axes: "body axes"
    central_body: none
    rotating_or_inertial: rotating
    orientation_parent: "the reference frame named by attitude_ref_from_body"
    revision: 1
    provenance:
      basis: chosen
      reason: "attitude_q is body-with-respect-to-reference (apollo_diode.md:117)"
  - id: HGA_BORESIGHT
    origin: vehicle
    axes: "high-gain antenna boresight"
    central_body: none
    rotating_or_inertial: rotating
    orientation_parent: BODY
    revision: 1
    provenance:
      basis: chosen
      reason: "comm.hga_pointing_error_deg needs a frame to be an angle in, and the antenna's own is the only one that makes the number meaningful"

environment:

  - id: gravity_moon
    value: 1.62
    unit: "m/s2"
    provenance:
      basis: historical
      source: "standard lunar surface gravity"
  - id: moon_mean_radius_km
    value: 1737.4
    unit: km
    provenance:
      basis: historical
      source: "the figure that makes gnc_diode.md:1175-1177 wrong: its example position has |r| = 1723.3 km, i.e. 14.1 km below this radius"
  - id: gravity_earth_mu
    value: 3.986004418e14
    unit: "m3/s2"
    provenance:
      basis: historical
      source: "IERS conventional value"
  - id: gravity_moon_mu
    value: 4.9028e12
    unit: "m3/s2"
    provenance:
      basis: historical
      source: "standard lunar gravitational parameter"
  - id: solar_flux_1au
    value: 1361
    unit: "W/m2"
    provenance:
      basis: historical
      source: "standard total solar irradiance; drives radiator and coldplate balance"
  - id: lunar_surface_albedo
    value: 0.12
    unit: "-"
    provenance:
      basis: historical
      source: "mean lunar albedo; a surface-phase thermal input"
  - id: earth_moon_light_time_s
    value: 1.3
    unit: s
    provenance:
      basis: historical
      source: "one-way light time; apollo_diode.md:526 makes the link delay a simulation setting of approximately 1-2 s one way, which brackets this"
  - id: tick_hz
    value: 50
    unit: Hz
    provenance:
      basis: apollo
      ref: "apollo_diode.md:24, :1084"
      note: "conflict register C-07: gnc 100 Hz, rcs 100 Hz and events 200 Hz all lose; gnc_diode.md:1672 concedes the 50 Hz baseline remains valid and is not normative for GNC, so a GNC inner loop is sub-stepped rather than the plant re-rated"

# --------------------------------------------------------------------------------------
# Configurations. `structure.stage_state` indexes into these, and a transition between them
# is irreversible and arm/commit protected (apollo_diode.md:211, :476-509).
# The linter sums every breakdown and refuses a mismatch. It is the one invariant checkable
# with no plant, and it is what catches a vehicle quietly changing mass between two files
# that both look right on their own.
# --------------------------------------------------------------------------------------
configurations:

  - id: csm_lm_docked
    name: "CSM and LM docked: the translunar and lunar-orbit configuration"
    crew_aboard: 3
    crew_in: csm
    mass_kg: 44085
    mass_breakdown_total_kg: 44085
    mass_breakdown:
      csm_cm_at_entry: 5487
      csm_sm_inert: 4037
      csm_sps_propellant: 18508
      csm_sm_rcs_propellant: 608
      csm_cm_rcs_propellant: 112
      csm_residual_and_stores: 55
      lm_descent_stage_dry: 1996
      lm_descent_propellant: 8248
      lm_ascent_stage_dry: 2132
      lm_ascent_propellant: 2376
      lm_rcs_propellant: 288
      lm_consumables: 238
    provenance:
      basis: derived
      relation: "CSM at TLI (28,807 kg) plus LM at separation for landing (15,278 kg); each side's own breakdown sums to its share and the linter checks both"
      source: "A11 Tbl B-I; PSR App C-I"

  - id: csm_alone
    name: "CSM alone after the LM is jettisoned"
    crew_aboard: 3
    crew_in: csm
    mass_kg: 28807
    mass_breakdown_total_kg: 28807
    mass_breakdown:
      csm_cm_at_entry: 5487
      csm_sm_inert: 4037
      csm_sps_propellant: 18508
      csm_sm_rcs_propellant: 608
      csm_cm_rcs_propellant: 112
      csm_residual_and_stores: 55
    provenance:
      basis: historical
      source: "A11: CSM at TLI 63,473 lb; PSR App C-I: 63,508 lb = 28,807 kg. CM at entry 12,096 lb = 5,487 kg; SM inert 8,700-9,000 lb implied by flight residuals = 4,037 kg"

  - id: lm_alone_descent
    name: "LM alone with its descent stage, after undocking"
    crew_aboard: 2
    crew_in: lm
    mass_kg: 15278
    mass_breakdown_total_kg: 15278
    mass_breakdown:
      lm_descent_stage_dry: 1996
      lm_descent_propellant: 8248
      lm_ascent_stage_dry: 2132
      lm_ascent_propellant: 2376
      lm_rcs_propellant: 288
      lm_consumables: 238
    provenance:
      basis: historical
      source: "A11 Tbl B-I: LM at separation for landing 33,683.5 lb = 15,278 kg; descent propellant 18,184 lb = 8,248 kg (Tbl 9-XIII); ascent propellant 5,238 lb = 2,376 kg (Tbl 9-XIV); RCS 634 lb = 288 kg (Tbl 9-XV). The stage dry masses are implied by the stage totals, not published"

  - id: lm_ascent_stage
    name: "LM ascent stage alone after the descent stage is left on the surface"
    crew_aboard: 2
    crew_in: lm
    mass_kg: 4888
    mass_breakdown_total_kg: 4888
    mass_breakdown:
      lm_ascent_stage_dry: 2132
      lm_ascent_propellant: 2376
      lm_rcs_propellant: 288
      lm_consumables: 92
    provenance:
      basis: historical
      source: "PSR App C-I: LM ascent stage at liftoff 10,777 lb = 4,888 kg; at jettison 5,463 lb = 2,478 kg, the difference being the ascent propellant burned"

  # --------------------------------------------------------------------------------------
  # The fifth configuration, and it was missing for as long as the others existed. Between
  # "docking complete" and "LM jettison" the vehicle is neither of the two configurations
  # that bracket it: the ascent stage is attached and the crew have transferred to the CSM.
  # The mission spends **7.5 hours** there — `lunar_orbit_docked`, the phase whose own name
  # says "docked again" — and the model had no vehicle to put in it.
  #
  # What surfaced it was `check_one_way_configurations`, which is the first thing to read any
  # `one_way_event`'s endpoints. `lm_ascent_jettison` ran `csm_alone -> csm_alone`: the event
  # that *removes* the ascent stage began in the configuration defined as "CSM alone after the
  # LM is jettisoned", because there was nothing else it could have named.
  #
  # The LM side is at **liftoff** mass rather than at jettison, which overstates the reference
  # by the ascent propellant the mission spends. That is the same rule `csm_lm_docked` uses —
  # each side at the reference moment its own configuration names — and it is stated rather
  # than smoothed, because the alternative was a single opaque lump for the ascent stage whose
  # value contradicts the components it is meant to be made of. See `open_debts` below.
  # --------------------------------------------------------------------------------------
  - id: csm_lm_ascent_docked
    name: "CSM and LM ascent stage docked, after rendezvous and before jettison"
    crew_aboard: 3
    crew_in: csm
    mass_kg: 33695
    mass_breakdown_total_kg: 33695
    mass_breakdown:
      csm_cm_at_entry: 5487
      csm_sm_inert: 4037
      csm_sps_propellant: 18508
      csm_sm_rcs_propellant: 608
      csm_cm_rcs_propellant: 112
      csm_residual_and_stores: 55
      lm_ascent_stage_dry: 2132
      lm_ascent_propellant: 2376
      lm_rcs_propellant: 288
      lm_consumables: 92
    provenance:
      basis: derived
      relation: "`csm_alone`'s six components plus `lm_ascent_stage`'s four: 28,807 + 4,888 = 33,695 kg. Each side is at the reference moment its own configuration names, which is the rule `csm_lm_docked` already uses when it adds the CSM at TLI to the LM at separation for landing"
      note: "the two halves are the same nineteen components those configurations already declare, so the sum is re-derivable rather than rounded, and no figure here is new. What is new is only the pairing"

# --------------------------------------------------------------------------------------
mass_properties:
  frames:
  - id: APOLLO_XA
    definition: >-
      the Operational Data Book's Apollo coordinates. X_A = 0.0 at launch-vehicle station
      4578.805 in (X_A = 4578.805 - X_LV), increasing along the stack from the LM's descent
      engine through the LM docking interface (X_E = 312.5, X_A = 712.0, with X_A = X_E +
      399.5) and the CM's (X_A = 1110.25) into the service module, so **+X_A is the direction
      the SPS and the DPS thrust**. That transformation is the whole point of naming the
      frame: without it a station is a number against nothing, which is what the folder said
      for a hundred rounds. **The two figures state the launch-vehicle station under two
      conventions** — Figure 2-16 has X_A = X_LV - 2756.555 and Figure 2-17 has X_A =
      4578.805 - X_LV, and those two cannot both hold for one X_LV — so the relation to use is
      the Apollo-to-LM one above; nothing in this file reads the launch-vehicle station. Y is
      the transverse axis through the crew stations' centreline and Z the other, right-handed
      with X
    provenance:
      basis: historical
      source: "CSM/LM Operational Data Book, SNA-8-D-027(III) Rev 3, section 2.0 'Configuration and Reference Station Locations', Figures 2-16 and 2-17, PDF pp. 41-42 (printed pp. 2-18/2-19)"
      note: >-
        the frame is checkable against the table it is used with: the docked stack's own centre
        of mass in Table 3.2-21 runs from X_A = 1041.07 in at 102,787.4 lb to X_A = 1110.52 in
        at 66,787.4 lb, i.e. between the two docking interfaces and moving toward the CM as the
        service module's propellant is burned, which is where a stack with the LM forward and
        the SPS aft puts its centre of mass
  - id: LM_XE
    definition: >-
      the LM's own coordinates, X_E, whose origin is at the foot of the descent stage and whose
      +X is the same direction as Apollo's — the Operational Data Book transforms between the two
      by a translation and nothing else, so **a tensor expressed in X_E is the same tensor in the
      body frame and needs no rotation**, while a station needs the offset. **And the offset is a
      property of the configuration, not of the frames**: the two figures that state it differ by
      398.25 inches because they are two different vehicles. Docked (Figure 2-17) the LM's docking
      interface mates with the CSM's, and both are at X_A = 1110.25 with X_E = 312.5 there, so
      `X_A = X_E + 797.75`. In the launch configuration (Figure 2-16) the LM sits in the adapter
      below the CSM with its interface at X_A = 712.0, so `X_A = X_E + 399.5`. **The corpus had the
      launch figure applied to docked tables**, which puts an LM station 10.1 m from where it is
    offsets:
      - configuration: launch
        offset_in: 399.5
        source: "ODB Vol III section 2.0, Figure 2-16, PDF p. 41: X_LV = X_A + 2756.555 and X_LV = X_E + 3156.055"
      - configuration: docked
        offset_in: 797.75
        source: "ODB Vol III section 2.0, Figure 2-17, PDF p. 42: the LM docking interface at X_E = 312.5 has X_LV = 3468.555, and X_A = 4578.805 - X_LV gives X_A = 1110.25, which is the station the same figure gives the CM docking interface — the two are mated, so the offset is 1110.25 - 312.5"
    provenance:
      basis: historical
      source: "as APOLLO_XA: ODB Vol III section 2.0, Figures 2-16 and 2-17, PDF pp. 41-42"
      note: >-
        3.2-25 and 3.2-26 below are in this frame, and so is every LM station in the corpus; what
        the two offsets settle is which Apollo station an LM station corresponds to, which is what
        a docked composition needs. A table in this frame therefore has to say which configuration
        it is being read in, and `check_mass_properties` refuses one that does not
  body_axes: >-
    `frames`' `BODY` frame **is** this frame: +X is the thrust axis and the tensor below is
    expressed in it, so the axes `attitude_q` and `body_rate` are integrated in are the axes
    the inertia is tabulated in and no rotation sits between them. Until this block existed
    `BODY` declared `axes: "body axes"`, which is a name rather than a definition
  tables:
    - id: ODB_3_2_21
      configuration: csm_lm_docked
      frame: APOLLO_XA
      title: "CSM-113/LM-11 (docked) mass properties, in Apollo coordinates, as a function of spacecraft weight, for the D.O.I. SM/SPS burn"
      document: "CSM/LM Operational Data Book, SNA-8-D-027(III) Rev 3, Volume III, 'Mission J-2 Mass Property Data Tables', Amendment 114, 9/15/71"
      pages: "PDF p. 351 (printed p. 3.2-115), continued at PDF p. 352 (printed p. 3.2-116)"
      columns: "WEIGHT LBS | X-BAR, Y-BAR, Z-BAR (INCHES) | IXX, IYY, IZZ, PXY, PXZ, PYZ (SLUG-FT2) | PITCH, YAW, ROLL (DEGREES) | AVERAGE (MOMENT)"
      span: "62,787.4 to 102,787.4 lb — 1,000-lb steps, with 100-lb steps from 100,787.4 lb up"
      note: >-
        the two rows below are the pair that brackets this vehicle's docked configuration at
        44,085 kg = 97,190.8 lb, and they are read out of a rotated fold-out whose text layer
        is garbage, so they were read from the rendered page at 300 dpi. The table's own
        `AVERAGE` column is what makes that reading checkable: it is (IYY + IZZ) / 2 / 10 in
        every row, and `check_mass_properties` refuses a row where it is not — a transcribed
        digit that is wrong in IYY or IZZ breaks the identity, which is the only reason a
        hand-read table can be trusted at all
      rows:
        - id: w97787_4
          weight_lb: 97787.4
          x_bar_in: 1045.71
          y_bar_in: 2.98
          z_bar_in: 3.04
          ixx_slug_ft2: 59378
          iyy_slug_ft2: 562820
          izz_slug_ft2: 567758
          pxy_slug_ft2: -11020
          pxz_slug_ft2: -4822
          pyz_slug_ft2: 1295
          average_moment: 56528
        - id: w96787_4
          weight_lb: 96787.4
          x_bar_in: 1046.93
          y_bar_in: 2.98
          z_bar_in: 2.96
          ixx_slug_ft2: 58853
          iyy_slug_ft2: 559336
          izz_slug_ft2: 564711
          pxy_slug_ft2: -11009
          pxz_slug_ft2: -4617
          pyz_slug_ft2: 1150
          average_moment: 56202
    - id: ODB_3_2_22
      configuration: csm_alone
