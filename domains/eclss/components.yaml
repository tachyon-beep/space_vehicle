# domains/eclss/components.yaml — the atmosphere, which is the only domain where a fault has
# minutes rather than hours.
#
# ## Why the atmosphere is modelled as stocks of gas rather than as a pressure
#
# The obvious model is a pressure state with a leak rate subtracted from it. It is wrong, and
# the way it is wrong is the experiment: pressure is `nRT/V`, so a cabin that heats up gains
# pressure without gaining gas and a cabin that cools loses it without leaking. A leak diagnosis
# built on a pressure state alone will read every thermal transient as a mass change, and the
# thermal domain has transients by design.
#
# So the conserved quantities are the **gas masses** — oxygen, diluent, carbon dioxide and water
# vapour — and pressure is derived from them. That makes the leak a mass loss rather than a
# pressure decay, which is what `eclss.leak_rate_g_s` actually is (`apollo_diode.md:94`), and it
# makes the thermal coupling of the cabin physical rather than a correction term.
#
# ## The band that had to be derived rather than guessed
#
# The cabin sits at 4.8-5.2 psia of essentially pure oxygen (`apollo_diode.md:88`), which is
# **236.02-256.71 mmHg** of oxygen partial pressure — 248.23 to 268.92 mmHg of *total* pressure
# less the 12.209 mmHg of water vapour and carbon dioxide the four-gas model declares. The first
# version of `eclss.pp_o2_mmhg` in the registry carried 140-180 — the value a mixed atmosphere at
# 14.7 psia would give — and the correction matters because the failure modes are opposite: 140 is
# hypoxic at 5 psia, and the top of the band is a fire risk that a sea-level band would hide. It
# is the kind of error no range check catches and a fire-risk threshold does.
#
# The second version carried 248-269, and that was the *same* error one order subtler: the total
# pressure band read as a partial pressure. Splitting the cabin into four gas stocks and summing
# them back into a pressure is what made it visible (`check_cabin_pressure_closure`), and it is
# the reason the oxygen initial is a *remainder* rather than a declared mass.
#
# ## Two compartments, and the switch between them
#
# The crew live in the CSM from translunar coast to undocking and in the LM from undocking to
# docking, and the two atmospheres cannot equalise in between because the vehicles are separate.
# Which compartment is crewed is a mission-phase fact, so it comes from `mission.yaml` rather
# than from this domain — the domain models both and the phase decides which one has people in it.

domain: eclss

# Metabolic rates are the fastest thing in this domain: a crew of three consumes about
# 3.16e-5 kg/s of oxygen, so a cabin's oxygen stock changes measurably over minutes. One hertz is
# already two orders of magnitude finer than the cabin's own mixing time, and the 0.5 Hz
# publication of the CO2 channel is what the alarm thresholds are sized against.
natural_rate_hz: 1

# `command_executive` is what `E-CMD-ATM` drives the cabin regulator with, and it is the only read
# here that is a signal rather than a quantity. It was missing while the *other* command edges were
# declared by their domains, which is what a list nothing counts looks like.
reads: [o2_csm, o2_lm, absorber_capacity_csm, absorber_capacity_lm, crew_state,
        cabin_zone_t, lm_cabin_zone_t, command_executive]
writes: [cabin_atm, lm_cabin_atm, cabin_regulator, cabin_o2_supply_csm,
         cabin_o2_supply_lm, co2_removal_csm, co2_removal_lm]

# Two states on the `internal` sentinel, so their order is a declaration rather than the alphabet's:
# both are published and neither drives the other, and the sentinel is advanced after every node.
internal_order: [suit_loop_flow_cfm, o2_supply_pressure_psi]
internal_order_note: >-
  **nothing at all**: the suit circuit's flow and the oxygen supply tank's pressure are published
  quantities with no edge between them and no shared input, so the order is a declaration rather than
  a finding. What it is not is the alphabet's — `o2_supply_pressure_psi` sorts before
  `suit_loop_flow_cfm`, and a tiebreak that decides is a tiebreak that can be wrong later

# --------------------------------------------------------------------------------------
# State. Four conserved gases per compartment, one commanded regulator, and three derived
# quantities. The quanta are set by the smallest flow each stock must represent, and the
# smallest flow in a crewed cabin is the leak — which is the same figure the whole ledger-pair
# design exists to detect.
# --------------------------------------------------------------------------------------
state:
  - id: csm_cabin_o2_kg
    node: cabin_atm
    method: stock
    unit: kg
    # 2.528302208 kg before rounding, and `initial_derivation` below is what says so. It read
    # 2.653596 until round 8 — the whole of the 5 psia, which is only consistent with a cabin whose
    # other three gases are nothing, and 2.653760 before that, which was the same sum done by hand.
    initial: 2.528302
    initial_derivation:
      expression: "(psi_to_pa * pressure_psia - mmhg_to_pa * (pp_h2o + pp_co2 + pp_n2)) * volume_m3 / (gas_constant * temperature_k) * molar_mass_kg_per_mol"
      inputs:
        psi_to_pa: 6894.757293168361
        pressure_psia: "domains/thermal/components.yaml:zones.csm_cabin.nominal_pressure_psia"
        mmhg_to_pa: 133.322387415
        pp_h2o: domains/eclss/components.yaml:atmosphere_model.check.partial_pressures_mmhg.h2o
        pp_co2: domains/eclss/components.yaml:atmosphere_model.check.partial_pressures_mmhg.co2
        pp_n2: domains/eclss/components.yaml:atmosphere_model.check.partial_pressures_mmhg.n2
        volume_m3: "domains/eclss/components.yaml:atmosphere_model.volume_m3.csm"
        gas_constant: 8.314462618153
        temperature_k: "domains/thermal/components.yaml:zones.csm_cabin.nominal_temperature_k"
        molar_mass_kg_per_mol: "domains/eclss/components.yaml:atmosphere_model.gases.o2.molar_mass_kg_per_mol"
    initial_provenance:
      basis: derived
      relation: >-
        the oxygen partial pressure is the cabin total less the three declared shares — 5 psia less
        9.209 and 3.0 mmHg, i.e. **246.37 mmHg** — and the mass is that pressure over the cabin volume
        at 295 K: 82.9249 mol of gas in all, of which water vapour is 0.05315987 kg and carbon
        dioxide 0.04233239 kg, leaving **2.528302 kg of oxygen**. **The oxygen is the remainder, and
        that is what the vehicle does**: the cabin pressure regulator holds *total* pressure by
        admitting oxygen and nothing else, so whatever the other three do not occupy is oxygen. This
        entry used to claim the whole of the 5 psia for itself, which it could only do if the other
        three were nothing at all — and the sum of the four is what `check_cabin_pressure_closure`
        evaluates. The subtraction is by *partial pressure* rather than by mass, which matters:
        carbon dioxide is 44 g/mol and subtracting its mass from an oxygen-mass total over-subtracts
        by a quarter of it, and that error was made and caught here before the value landed
    quantum: 1.0e-6
    min_flow_per_s: 6.4e-6
    provenance:
      basis: derived
      relation: "quantum 1 mg because the smallest flow this stock must represent is the nominal cabin leak, 0.023 kg/h = 6.4e-6 kg/s (vehicle.yaml#consumables, from the Apollo 11 flight figure). The crew's metabolic draw is five times larger; the leak is what sets the quantum."
  - id: csm_cabin_n2_kg
    node: cabin_atm
    method: stock
    unit: kg
    initial: 0.0
    initial_derivation:
      expression: "(partial_pressure_mmhg * mmhg_to_pa) * volume_m3 / (gas_constant * temperature_k) * molar_mass_kg_per_mol"
      inputs:
        partial_pressure_mmhg: domains/eclss/components.yaml:atmosphere_model.check.partial_pressures_mmhg.n2
        mmhg_to_pa: 133.322387415
        volume_m3: domains/eclss/components.yaml:atmosphere_model.volume_m3.csm
        gas_constant: 8.314462618153
        temperature_k: domains/thermal/components.yaml:zones.csm_cabin.nominal_temperature_k
        molar_mass_kg_per_mol: domains/eclss/components.yaml:atmosphere_model.gases.n2.molar_mass_kg_per_mol
    initial_provenance:
      basis: derived
      relation: >-
        **zero, and the vehicle says so about itself.** The CSM's cabin pressure regulator meters *oxygen*
        to hold 5.0 +- 0.2 psia (`csm_ecs_study_guide.pdf` PDF p. 16) and the LM's section "stores, in gaseous
        form, all oxygen required by the ECS" and maintains "cabin and/or suit pressurization by supplying
        oxygen" (`lm_ecs_study_guide.pdf`); the pad charge of sea-level air is vented and purged before the
        mission starts, so the diluent fraction decays to nothing either cabin's instruments can see. The gas
        is modelled anyway for the reason this stock's `source` gives — "a repressurisation that adds the
        wrong gas is a fault worth being able to express" — and the initial is the *absence* of it rather than
        a small number, because "small" was the claim that kept this entry unset for the whole folder's life
    quantum: 1.0e-6
    min_flow_per_s: 6.4e-6
    provenance:
      basis: derived
      relation: "the diluent. Apollo flew an essentially pure-oxygen cabin at 5 psia, so the nitrogen load is small; it is modelled separately anyway because a repressurisation that adds the wrong gas is a fault worth being able to express, and because 'the cabin lost pressure' and 'someone diluted the oxygen' are different problems."
  - id: csm_cabin_co2_kg
    node: cabin_atm
    method: stock
    unit: kg
    initial: 0.04233239
    initial_provenance:
      basis: chosen
      reason: >-
        the one-hour average this domain's own `co2_exposure_1h` threshold declares: **3.0 mmHg**, from
        `eclss_diode.md:735`'s nominal requirement. Over 5.9 m3 at 295 K that is 0.9621 mol =
        **0.04233239 kg**. The *apportionment* is derived — the pressure is declared in
        `atmosphere_model.check.partial_pressures_mmhg` and every term of the gas law is a binding — but the
        pressure itself is the design's own criterion rather than a measurement, and it is a ceiling rather
        than a point: the mission starts with the bed at steady state and nothing publishes the transient
        before it
    quantum: 1.0e-6
    min_flow_per_s: 3.16e-5
    provenance:
      basis: derived
      relation: "quantum 1 mg against the crew's production of 0.91 kg per crew-day for three, 3.16e-5 kg/s. This is the fastest stock in the domain, and it is the one the absorber's man-hour accounting is denominated against."
  - id: csm_cabin_h2o_kg
    node: cabin_atm
    method: stock
    unit: kg
    initial: 0.05315987
    initial_derivation:
      expression: "(partial_pressure_mmhg * mmhg_to_pa) * volume_m3 / (gas_constant * temperature_k) * molar_mass_kg_per_mol"
      inputs:
        partial_pressure_mmhg: domains/eclss/components.yaml:atmosphere_model.check.partial_pressures_mmhg.h2o
        mmhg_to_pa: 133.322387415
        volume_m3: domains/eclss/components.yaml:atmosphere_model.volume_m3.csm
        gas_constant: 8.314462618153
        temperature_k: domains/thermal/components.yaml:zones.csm_cabin.nominal_temperature_k
        molar_mass_kg_per_mol: domains/eclss/components.yaml:atmosphere_model.gases.h2o.molar_mass_kg_per_mol
    initial_provenance:
      basis: derived
      relation: >-
        the same ideal-gas relation as the oxygen, at the partial pressure the exchanger holds:
        **9.209 mmHg**, the saturation vapour pressure of water at the 50 F dew point
        `csm_ecs_study_guide.pdf` PDF p. 16 states the cooling process is run to. 9.209 mmHg over 5.9 m3 at
        295 K is 2.9536 mol = **0.05315987 kg**. This entry owed "the fractions" for the folder's whole
        life, on the note that "small is not a number" — and the number is the setpoint of the machine that
        removes the vapour, which this gas's own `source` already names
    quantum: 1.0e-5
    min_flow_per_s: 1.0e-5
    provenance:
      basis: chosen
      reason: "water vapour, removed by the condensing heat exchanger. Modelled because humidity is what a condensing exchanger is for and because a failed exchanger is a cabin fault an agent can feel rather than read; the quantum is coarser because the flows are larger and the precision of any humidity channel is poor."
  - id: lm_cabin_o2_kg
    node: lm_cabin_atm
    method: stock
    unit: kg
    # 2.871122847 kg before rounding, by the same subtraction as the CSM's cabin over 6.7 m3. It read
    # 3.013405, and the pair disagreed in the seventh figure because each was a hand sum.
    initial: 2.87112285
    initial_derivation:
      expression: "(psi_to_pa * pressure_psia - mmhg_to_pa * (pp_h2o + pp_co2 + pp_n2)) * volume_m3 / (gas_constant * temperature_k) * molar_mass_kg_per_mol"
      inputs:
        psi_to_pa: 6894.757293168361
        pressure_psia: "domains/thermal/components.yaml:zones.lm_cabin.nominal_pressure_psia"
        mmhg_to_pa: 133.322387415
        pp_h2o: domains/eclss/components.yaml:atmosphere_model.check.partial_pressures_mmhg.h2o
        pp_co2: domains/eclss/components.yaml:atmosphere_model.check.partial_pressures_mmhg.co2
        pp_n2: domains/eclss/components.yaml:atmosphere_model.check.partial_pressures_mmhg.n2
        volume_m3: "domains/eclss/components.yaml:atmosphere_model.volume_m3.lm"
        gas_constant: 8.314462618153
        temperature_k: "domains/thermal/components.yaml:zones.lm_cabin.nominal_temperature_k"
        molar_mass_kg_per_mol: "domains/eclss/components.yaml:atmosphere_model.gases.o2.molar_mass_kg_per_mol"
    initial_provenance:
      basis: derived
      relation: >-
        the oxygen partial pressure is the cabin total less the three declared shares — 5 psia less
        9.209 and 3.0 mmHg, i.e. **246.37 mmHg** — and the mass is that pressure over the cabin volume
        at 295 K: 94.1689 mol of gas in all, of which water vapour is 0.06036798 kg and carbon
        dioxide 0.04807238 kg, leaving **2.87112285 kg of oxygen**. **The oxygen is the remainder, and
        that is what the vehicle does**: the cabin pressure regulator holds *total* pressure by
        admitting oxygen and nothing else, so whatever the other three do not occupy is oxygen. This
        entry used to claim the whole of the 5 psia for itself, which it could only do if the other
        three were nothing at all — and the sum of the four is what `check_cabin_pressure_closure`
        evaluates. The subtraction is by *partial pressure* rather than by mass, which matters:
        carbon dioxide is 44 g/mol and subtracting its mass from an oxygen-mass total over-subtracts
        by a quarter of it, and that error was made and caught here before the value landed
    quantum: 1.0e-6
    min_flow_per_s: 6.4e-6
    provenance:
      basis: derived
      relation: "as the CSM compartment, for the LM's own 6.7 m3 at about 5 psia (vehicle.yaml#thermal)"
  - id: lm_cabin_co2_kg
    node: lm_cabin_atm
    method: stock
    unit: kg
    initial: 0.04807238
    initial_provenance:
      basis: chosen
      reason: >-
        the one-hour average this domain's own `co2_exposure_1h` threshold declares: **3.0 mmHg**, from
        `eclss_diode.md:735`'s nominal requirement. Over 6.7 m3 at 295 K that is 1.0926 mol =
        **0.04807238 kg**. The *apportionment* is derived — the pressure is declared in
        `atmosphere_model.check.partial_pressures_mmhg` and every term of the gas law is a binding — but the
        pressure itself is the design's own criterion rather than a measurement, and it is a ceiling rather
        than a point: the mission starts with the bed at steady state and nothing publishes the transient
        before it
    quantum: 1.0e-6
    min_flow_per_s: 3.16e-5
    provenance:
      basis: derived
      relation: "as the CSM compartment. On the LM this is the stock Apollo 13's improvised cartridge kept below 1 mmHg, and it is the one whose exhaustion constrains how long a surface stay can be extended."
  - id: lm_cabin_h2o_kg
    node: lm_cabin_atm
    method: stock
    unit: kg
    initial: 0.06036798
    initial_derivation:
      expression: "(partial_pressure_mmhg * mmhg_to_pa) * volume_m3 / (gas_constant * temperature_k) * molar_mass_kg_per_mol"
      inputs:
        partial_pressure_mmhg: domains/eclss/components.yaml:atmosphere_model.check.partial_pressures_mmhg.h2o
        mmhg_to_pa: 133.322387415
        volume_m3: domains/eclss/components.yaml:atmosphere_model.volume_m3.lm
        gas_constant: 8.314462618153
        temperature_k: domains/thermal/components.yaml:zones.lm_cabin.nominal_temperature_k
        molar_mass_kg_per_mol: domains/eclss/components.yaml:atmosphere_model.gases.h2o.molar_mass_kg_per_mol
    initial_provenance:
      basis: derived
      relation: >-
        the same ideal-gas relation as the oxygen, at the partial pressure the exchanger holds:
        **9.209 mmHg**, the saturation vapour pressure of water at the 50 F dew point
        `csm_ecs_study_guide.pdf` PDF p. 16 states the cooling process is run to. 9.209 mmHg over 6.7 m3 at
        295 K is 3.3540 mol = **0.06036798 kg**. This entry owed "the fractions" for the folder's whole
        life, on the note that "small is not a number" — and the number is the setpoint of the machine that
        removes the vapour, which this gas's own `source` already names
    quantum: 1.0e-05
    min_flow_per_s: 1.0e-05
    provenance:
      basis: chosen
      reason: >-
        water vapour at the LM's own compartment, and **it did not exist until round 69**: the
        atmosphere model below declares four gases, the CSM cabin held all four, and the LM held
        three — while `lm_water_separator` exists in this same file to remove the vapour that had no
        state to be in. The quantum matches the CSM's for the same reason it was chosen there:
        humidity is what a condensing exchanger is for, and a failed one is a fault the crew can feel
        rather than read
  - id: lm_cabin_n2_kg
    node: lm_cabin_atm
    method: stock
    unit: kg
    initial: 0.0
    initial_derivation:
      expression: "(partial_pressure_mmhg * mmhg_to_pa) * volume_m3 / (gas_constant * temperature_k) * molar_mass_kg_per_mol"
      inputs:
        partial_pressure_mmhg: domains/eclss/components.yaml:atmosphere_model.check.partial_pressures_mmhg.n2
        mmhg_to_pa: 133.322387415
        volume_m3: domains/eclss/components.yaml:atmosphere_model.volume_m3.lm
        gas_constant: 8.314462618153
        temperature_k: domains/thermal/components.yaml:zones.lm_cabin.nominal_temperature_k
        molar_mass_kg_per_mol: domains/eclss/components.yaml:atmosphere_model.gases.n2.molar_mass_kg_per_mol
    initial_provenance:
      basis: derived
      relation: >-
        **zero, and the vehicle says so about itself.** The CSM's cabin pressure regulator meters *oxygen*
        to hold 5.0 +- 0.2 psia (`csm_ecs_study_guide.pdf` PDF p. 16) and the LM's section "stores, in gaseous
        form, all oxygen required by the ECS" and maintains "cabin and/or suit pressurization by supplying
        oxygen" (`lm_ecs_study_guide.pdf`); the pad charge of sea-level air is vented and purged before the
        mission starts, so the diluent fraction decays to nothing either cabin's instruments can see. The gas
        is modelled anyway for the reason this stock's `source` gives — "a repressurisation that adds the
        wrong gas is a fault worth being able to express" — and the initial is the *absence* of it rather than
        a small number, because "small" was the claim that kept this entry unset for the whole folder's life
    quantum: 1.0e-6
    min_flow_per_s: 6.4e-6
    provenance:
      basis: derived
      relation: "as the CSM compartment"
  - id: cabin_o2_supply_csm_kg_s
    node: cabin_o2_supply_csm
    method: algebraic
    unit: kg O2/s
    nominal_kg_s: 3.798611e-05
    provenance:
      basis: derived
      computes: nominal_kg_s
      derivation:
        expression: "(leak_kg_per_h + crew * o2_kg_per_crew_day / hours_per_day) / seconds_per_hour"
        inputs:
          leak_kg_per_h: vehicle.yaml:consumables.leak.csm_kg_per_h
          crew: mission.yaml:crew.size
          o2_kg_per_crew_day: vehicle.yaml:consumables.metabolic.o2_kg_per_crew_day
          hours_per_day: 24
          seconds_per_hour: 3600
      relation: >-
        the regulator replaces what the cabin loses, and both terms are published: the cabin leak at
        0.023 kg/h and the crew's metabolic consumption at 0.91 kg of oxygen per crew-day for three
        crew. 0.023 + 3 x 0.91/24 = 0.13675 kg/h = **3.798611e-05 kg/s**. Algebraic rather than a
        stock because the rate follows the loss rather than accumulating
      note: >-
        **the leak term's attribution is in doubt and is recorded in `open_debts`.** The datum is
        Apollo 11's LM cabin leak of 0.05 lb/hr = 0.0227 kg/h against a 0.2 lb/hr specification, and
        the CSM's own leak is not published in any source reached — but
        `domains/consumables/components.yaml` sizes `o2_csm_kg`'s quantum from "the nominal cabin
        leak, 0.023 kg/h" as though it were the CSM's. The figure is used here because that is the
        number this tank is already accounted against; what is owed is a separate CSM measurement
  - id: cabin_o2_supply_lm_kg_s
    node: cabin_o2_supply_lm
    method: algebraic
    unit: kg O2/s
    nominal_kg_s: 2.736470e-05
    provenance:
      basis: derived
      computes: nominal_kg_s
      derivation:
        expression: "(leak_kg_per_h + crew * o2_kg_per_crew_day / hours_per_day) / seconds_per_hour"
        inputs:
          leak_kg_per_h: vehicle.yaml:consumables.leak.lm_kg_per_h
          crew: 2
          o2_kg_per_crew_day: vehicle.yaml:consumables.metabolic.o2_kg_per_crew_day
          hours_per_day: 24
          seconds_per_hour: 3600
      relation: >-
        as the CSM's, over the LM's own figures: `vehicle.yaml#consumables.leak.lm_kg_per_h` =
        0.0226796 (A11's measured 0.05 lb/hr) and two crew rather than three, so
        0.0226796 + 2 x 0.91/24 = 0.098513 kg/h = **2.736470e-05 kg/s**. This is the better-attested
        of the two, because the leak figure is the LM's own
  - id: cabin_regulator_position
    node: cabin_regulator
    method: discrete
    unit: "enum[closed,primary,emergency,isolated]"
    moved_by:
      - "command:set_cabin_regulator"
    dwell:
      min_on_s: 1
      min_off_s: 1
    provenance:
      basis: apollo
      ref: "apollo_diode.md:95"
      note: "apollo publishes cabin_regulator_state as primary/emergency/isolated with an 'unexpected mode' event. The dwell is one second each way because the regulator is a valve with a mechanical transit and a fleet must not be able to chatter it by re-commanding every tick."
  # The supply tank's working pressure, which is what `eclss.o2_supply_pressure_psi` publishes. It is
  # a *pressure* and the corpus had only a *mass*: round 30 found the channel reading `o2_csm` — the
  # shared oxygen stock, in kilograms — under a psi name, and the honest answer was not a conversion
  # but this state. What it still owes is named below rather than papered over.
  - id: o2_supply_pressure_psi
    node: internal
    method: lag
    unit: psi
    initial: 900
    initial_provenance:
      basis: historical
      source: >-
        `csm_ecs_study_guide.pdf` **PDF p. 12**, printed p. 2-1, section II. §2.2.1 "High Pressure O2
        Distribution": "Downstream of the S/M O2 shut-off valve the **high pressure (900 psig)**
        oxygen is supplied in parallel to the surge tank and backup tank in the LH equipment bay, and
        to the PLSS supply valve and the S/M supply regulator". §2.1 on the same page is what stands
        behind it: "the oxygen is stored in **two cryogenic tanks in the service module (S/M)**.
        Heaters within the tanks change the oxygen from a liquid to a gaseous state, for distribution
        to the using equipment." The channel's own 750-950 psi band brackets this working pressure,
        which is why the starting value is the published one rather than a chosen figure
    tau_s: UNCONFIGURED
    note: >-
      the time constant is owed, and it is the line's rather than the tank's: a heated cryogenic tank
      holds its delivery pressure for as long as there is liquid to boil, so what a first-order lag
      represents here is the response to a demand step
    provenance:
      basis: UNCONFIGURED
      note: >-
        **what the pressure does as the tank empties is not published.** The state is declared because
        the *channel* is: `eclss.o2_supply_pressure_psi` is apollo's 750-950 psi indication with a
        low-pressure event and a >5 psi/min fall, four declared faults perturb it, and until this
        round it read `o2_csm` — a mass in kilograms — under a pressure's name. A cryogenic tank with
        heaters holds its delivery pressure until the liquid is gone and then falls, so the relation
        between this state and `o2_csm` is a heater-and-regulator model rather than a gas law.
        **Searched:** `csm_ecs_study_guide.pdf` end to end — PDF p. 12 is everything it says about
        the supply (the two tanks, the 900 psig working pressure, the surge tank's 3.7 lb, the inlet
        restrictors' 8.2 lb/hr at 900 psig) — and `mission_e_consumables.txt`. What would close it: a
        tank or heater analysis for the S/M cryogenic tanks, or a pressure-versus-contents curve, and
        the *driver* is owed with it, because no edge can reach the sentinel
  - id: suit_loop_flow_cfm
    node: internal
    method: lag
    unit: ft3/min
    initial: 35
    initial_provenance:
      basis: historical
      source: >-
        `csm_ecs_study_guide.pdf` **PDF p. 39** (printed p. 3-9), section III: "In normal space
        operations, the operating compressor delivers approximately **35 cubic feet per minute** of
        suit gas at a pressure rise of 10 inches of water within the conditions of 4.93 psia and
        80 F. Under emergency operating conditions, the operating compressor delivers approximately
        34.5 cubic feet per minute suit gas at a pressure rise of 6.9 inches of water". The circuit
        circulates continuously — it is what the crew breathe through before and after launch — so
        MET 0 is the normal-space delivery, and the compressor is the only thing that drives it
    tau_s: 5
    provenance:
      basis: chosen
      reason: >-
        the suit loop is a compressor-driven circuit, so it spins up in seconds. apollo's `<20` event
        is what the time constant has to be short against — five seconds is long enough that a fan
        cannot be declared failed within one tick, and short enough that a real stall is visible in
        the same pass. **And the flow it settles at is not apollo's recommended range**: the diode's
        27-33 cfm was a recommendation with no source, the ECS guide publishes 35 (normal) and 34.5
        (emergency), and the range moved to 32-38 rather than the initial moving to fit it — conflict
        C-27 is the record
  # Two removal rates, not one. This was a single state on the `internal` sentinel *reading both
  # counters*, so it converted the two beds' remaining capacity into one rate for one vehicle — and a
  # crew on the surface spent the CSM element while a crew back in the CM spent the LM cartridge,
  # exactly the defect round 42 fixed when it split the counters themselves.
  - id: co2_removal_csm_kg_s
    node: co2_removal_csm
    method: algebraic
    unit: "kg CO2/s"
    nominal_kg_s: 3.159722e-05
    provenance:
      basis: derived
      computes: nominal_kg_s
      derivation:
        expression: "crew * co2_kg_per_crew_day / seconds_per_day"
        inputs:
          crew: mission.yaml:crew.size
          co2_kg_per_crew_day: vehicle.yaml:consumables.metabolic.co2_kg_per_crew_day
          seconds_per_day: 86400
      relation: >-
        the CSM element's removal rate: its remaining man-hour capacity converted through the
        metabolic production rate, capped by the blower's flow. Algebraic because the rate follows
        the bed's state rather than accumulating. What the split changes is *which* capacity it is a
        function of — this one reads `absorber_capacity_csm` and the CSM cabin's CO2, and the LM's
        reads its own two
      note: >-
        the rule is domain code and is owed as the rest of this domain's are, but its *inputs* are
        per-compartment now and every one of them is declared: the counter, the cabin's CO2 mass, the
        blower's flow and the crew's production
  - id: co2_removal_lm_kg_s
    node: co2_removal_lm
    method: algebraic
    unit: "kg CO2/s"
    nominal_kg_s: 2.106481e-05
    provenance:
      basis: derived
      computes: nominal_kg_s
      derivation:
        expression: "crew * co2_kg_per_crew_day / seconds_per_day"
        inputs:
          crew: 2
          co2_kg_per_crew_day: vehicle.yaml:consumables.metabolic.co2_kg_per_crew_day
          seconds_per_day: 86400
      relation: >-
        as the CSM's, at the cartridge: the LM's own remaining capacity, its own cabin's CO2 and the
        same two crew whose metabolic production it is sized against. The LM carries two crew during
        the descent, the surface and the ascent, so its removal rate is two thirds of the CSM's at
        the same per-crew production — a *different* number from the CSM's, and one a single shared
        state could not have expressed
  - id: csm_cabin_pressure_pa
    node: cabin_atm
    method: algebraic
    unit: Pa
    # The field the arithmetic produces, named by the state's own id: what this state *is* is the
    # number its law computes, not a parameter of it. `computes` has to name a field on the state so
    # the linter has something to hold the arithmetic against, and for a state whose value is its
    # rule there is no name better than the state's own.
    csm_cabin_pressure_pa: 34473.783836
    provenance:
      basis: derived
      computes: csm_cabin_pressure_pa
      derivation:
        expression: "(o2_mass / o2_molar + n2_mass / n2_molar + co2_mass / co2_molar + h2o_mass / h2o_molar) * gas_constant * cabin_temperature_k / cabin_volume_m3"
        inputs:
          o2_mass: csm_cabin_o2_kg
          n2_mass: csm_cabin_n2_kg
          co2_mass: csm_cabin_co2_kg
          h2o_mass: csm_cabin_h2o_kg
          o2_molar: domains/eclss/components.yaml:atmosphere_model.gases.o2.molar_mass_kg_per_mol
          n2_molar: domains/eclss/components.yaml:atmosphere_model.gases.n2.molar_mass_kg_per_mol
          co2_molar: domains/eclss/components.yaml:atmosphere_model.gases.co2.molar_mass_kg_per_mol
          h2o_molar: domains/eclss/components.yaml:atmosphere_model.gases.h2o.molar_mass_kg_per_mol
          gas_constant: 8.314462618153
          cabin_temperature_k: zone_csm_cabin_t
          cabin_volume_m3: domains/eclss/components.yaml:atmosphere_model.volume_m3.csm
      relation: >-
        P = (sum of n_i) R T / V, from the four gas stocks and the cabin zone's temperature. Derived
        rather than stated, which is the whole reason the stocks exist. The thermal sensitivity is
        dP/dT = P/T, which at the nominal 5 psia and 295 K is **116.86 Pa per kelvin** — carried here
        because this is the state that computes it, and `E-ZONE-ATM` is the edge that declares it as
        this state's driver. A 1 K cabin change therefore moves the pressure by twice the
        instrument's 0.01 psia precision, which is what makes a leak and a cooling cabin the same
        observation. **The law is arithmetic now rather than the sentence above it**: four masses over
        their molar masses, the model's own gas constant and volume, and the cabin zone's temperature
        *as a reading* — the live state, not the 295 K it starts at — which the plant substitutes at
        the tick it computes this, `cabin_zone_t` having advanced four nodes earlier in the derived
        order
      note: >-
        **the `computes` field is the state's own id, and that is this round's one new spelling.**
        Every other derived state produces a *parameter* — `total_w`, `tau_s`, `total_k` — because
        its value is an input to some other rule. A pressure is not: what this state is, is what its
        law says, so the state's own declared value is the only thing the arithmetic can be held
        against and mean anything. The value beside it is the 5 psia design point at 295 K to full
        precision, and the four gas stocks are *derived* from it, which is why the two agree to
        2.6 mPa at MET 0 and to nothing at all in a leaking cabin — where the reading is the point
  - id: lm_cabin_pressure_pa
    node: lm_cabin_atm
    method: algebraic
    unit: Pa
    # As the CSM compartment: the law is one relation applied twice, and each application names the
    # gases and the volume of its own cabin. Nothing here is copied from the CSM's entry but the
    # shape, and `test_the_two_cabins_compute_their_pressure_by_one_law` holds the two together.
    lm_cabin_pressure_pa: 34473.786459
    provenance:
      basis: derived
      computes: lm_cabin_pressure_pa
      derivation:
        expression: "(o2_mass / o2_molar + n2_mass / n2_molar + co2_mass / co2_molar + h2o_mass / h2o_molar) * gas_constant * cabin_temperature_k / cabin_volume_m3"
        inputs:
          o2_mass: lm_cabin_o2_kg
          n2_mass: lm_cabin_n2_kg
          co2_mass: lm_cabin_co2_kg
          h2o_mass: lm_cabin_h2o_kg
          o2_molar: domains/eclss/components.yaml:atmosphere_model.gases.o2.molar_mass_kg_per_mol
          n2_molar: domains/eclss/components.yaml:atmosphere_model.gases.n2.molar_mass_kg_per_mol
          co2_molar: domains/eclss/components.yaml:atmosphere_model.gases.co2.molar_mass_kg_per_mol
          h2o_molar: domains/eclss/components.yaml:atmosphere_model.gases.h2o.molar_mass_kg_per_mol
          gas_constant: 8.314462618153
          cabin_temperature_k: zone_lm_cabin_t
          cabin_volume_m3: domains/eclss/components.yaml:atmosphere_model.volume_m3.lm
      relation: >-
        as the CSM compartment, over the LM's own volume, and the same 116.86 Pa per kelvin. The LM's
        volume is 6.7 m3 against the CSM's 5.9, so the same kelvin moves the same pressure in a
        slightly larger room and the masses differ by 14 %

# --------------------------------------------------------------------------------------
# Components.
# --------------------------------------------------------------------------------------
components:
  - id: csm_cabin_volume
    kind: state
    class: volume
    vehicle: csm
    volume_m3: 5.9
    provenance:
      basis: historical
      source: "NR: CSM cabin 210 cu ft habitable = 5.9 m3 at 5 psia"
  - id: lm_cabin_volume
    kind: state
    class: volume
    vehicle: lm
    volume_m3: 6.7
    provenance:
      basis: historical
      source: "NR: LM cabin 235 cu ft pressurised = 6.7 m3, roughly 160 cu ft habitable"
  - id: o2_regulator
    kind: discrete
    class: regulator
    vehicle: csm
    modes: [closed, primary, emergency, isolated]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:95"
      note: "primary, emergency and isolated, with an emergency regulator that could hold the cabin above 3.5 psia long enough to don suits (apollo_diode.md:84)"
  - id: lm_o2_regulator
    kind: discrete
    class: regulator
    vehicle: lm
    modes: [closed, primary, emergency, isolated]
    provenance:
      basis: derived
      relation: >-
        the LM's own cabin pressure control, by the argument that already makes
        `eclss.lm_cabin_pressure_psia` a separate channel: two compartments that cannot equalise
        cannot share one regulator. The modes are the CSM's four because the LM's control is not
        published — the corpus gives one `cabin_regulator_state` with no vehicle qualifier
        (apollo_diode.md:95) — and a per-compartment article with no description is still a
        per-compartment article
      note: >-
        the same four modes, no channel. `eclss.cabin_regulator_state` publishes the CSM's position
        and the LM has no equivalent, so ECL-13, ECL-14 and ECL-19 are injectable but not readable:
        on the CSM a regulator fault is a mode, and on the LM it is an inference from pressure and
        ppO2. `domains/eclss/fault_policy.yaml` carries that asymmetry in the twins' detection notes
  # The four instruments, and the one field that says what they instrument. Until round 48 each
  # carried `range_psia` / `precision_psia` — the unit inside the key, which is the shape the fault
  # magnitudes were cured of — and *no* tool read either key, so the instrument was the one link in
  # the chain from physics to crew display that nothing joined: `channels.yaml` states a resolution
  # and the display contract is held to it, and what the instrument actually resolves was a claim
  # in a key name. `measures` is the declared link, and the three figures beside it are stated in
  # the registry's own vocabulary (`range`, `range_kind`, `unit`, `precision`) so the two halves can
  # be compared rather than described.
  #
  # The two ranges are different quantities and the vocabulary is what keeps them apart. The
  # channel's range is a *band* — the cabin's acceptable operating pressure, 4.8-5.2 psia, with
  # alarms firing below it. The instrument's is a *scale* — the full span the transducer can read,
  # 0-10 psia — and the honest relation between them is containment, not equality: an instrument
  # whose full scale does not contain the band the vehicle calls normal saturates inside its own
  # operating envelope. `range_kind` already carried exactly this distinction for the registry
  # (`check_range_kinds`), which is why the sensor side reuses the word `scale` instead of
  # inventing a second one.
  - id: cabin_pressure_sensor_1
    kind: flow
    class: sensor
    measures: eclss.cabin_pressure_psia
    range: [0, 10]
    range_kind: scale
    unit: psia
    precision: 0.01
    provenance:
      basis: apollo
      ref: "apollo_diode.md:88"
      note: "the published precision is 0.01 psia, which is 69 Pa — and a 1 K cabin temperature change moves the pressure by about 117 Pa without any gas moving. The instrument is therefore *more* precise than the thermal noise it has to survive, which is exactly why the stocks are masses."
  - id: cabin_pressure_sensor_2
    kind: flow
    class: sensor
    measures: eclss.cabin_pressure_psia
    range: [0, 10]
    range_kind: scale
    unit: psia
    precision: 0.01
    provenance:
      basis: chosen
      reason: "apollo's instrumentation carried redundant channels (`avionics_diode.md:390-411`'s redundant_vote is one of the only two mechanisms allowed to assign SUSPECT). Two sensors are the minimum for a disagreement to be detectable at all, and a single pressure sensor is a fault that hides its own failure."
  - id: co2_sensor
    kind: flow
    class: sensor
    measures: eclss.co2_pp_mmhg
    range: [0, 20]
    range_kind: scale
    unit: mmHg
    precision: 0.1
    provenance:
      basis: apollo
      ref: "apollo_diode.md:90"
  - id: lm_cabin_pressure_sensor
    kind: flow
    class: sensor
    vehicle: lm
    measures: eclss.lm_cabin_pressure_psia
    range: [0, 10]
    range_kind: scale
    unit: psia
    precision: 0.01
    provenance:
      basis: derived
      relation: >-
        the LM's cabin pressure transducer, at the CSM instrument's published range and precision
        (apollo_diode.md:88). One sensor rather than two, which is `chosen` and is the interesting
        half: `cabin_pressure_sensor_2` exists because "a single pressure sensor is a fault that
        hides its own failure", and the LM's cabin has one because it is a two-crew compartment
        where the second sensor's mass is the cost. So ECL-16 and ECL-17 are faults a crew can only
        catch by cross-checking against ppO2 and by talking to each other — and that is what makes
        the crew sensor load-bearing on the surface rather than decorative
  # The vehicle has two absorbers and, until round 42, this file declared both of the LM's and
  # neither cabin in its ids. `lioh_bed_primary` and `lioh_bed_secondary` were the LM cartridges,
  # named as if the vehicle had one absorber; the CSM's element — the one that scrubs the air for
  # the whole outbound and inbound voyage — was declared in `vehicle.yaml#consumables` and in no
  # domain, had no fault, and fed no counter. The two ratings that would have exposed the shared
  # counter were written right here the whole time.
  - id: csm_lioh_element
    kind: stock
    class: absorber
    node: absorber_capacity_csm
    rated_man_hours: 72
    provenance:
      basis: historical
      source: "NR and PSR: the CSM's LiOH elements run on a nominal 72 man-hour rotation, with the caution at 7.6 mmHg (vehicle.yaml#consumables.co2_removal). Denominated in man-hours for the same reason as the LM's: no kg-CO2 figure is published for either article."
  - id: lm_lioh_cartridge_primary
    kind: stock
    class: absorber
    node: absorber_capacity_lm
    rated_man_hours: 41
    provenance:
      basis: historical
      source: "NR and PSR: an LM primary cartridge is 41 man-hours of CO2 removal. The capacity is denominated in man-hours because no kg-CO2 figure is published, and a stock denominated in the unit the sources give cannot drift from its evidence."
  - id: lm_lioh_cartridge_secondary
    kind: stock
    class: absorber
    node: UNCONFIGURED
    rated_man_hours: 78
    provenance:
      basis: historical
      source: "NR and PSR: an LM secondary cartridge is 78 man-hours, and there are six spares."
      note: >-
        aboard and unreachable. `set_absorber_path` selects between beds rather than between
        cartridges, and no verb in this vehicle swaps one, so the 78 man-hours of the secondary and
        the six spares behind it — 324 man-hours of CO2 removal, eight times the primary — are
        physically present and modelled nowhere. `node: UNCONFIGURED` is the binding that is owed,
        not the cartridge: the cartridge exists and its rating is published. What is missing is the
        verb, and until it lands this is a debt rather than a capacity, because a counter that
        started at 365 man-hours would be a vehicle whose crew cannot run out of LiOH
  - id: condensing_heat_exchanger
    kind: flow
    class: exchanger
    removal_kg_h: UNCONFIGURED
    provenance:
      basis: UNCONFIGURED
      note: >-
        what the vehicle publishes is the *consequence* — a cabin humidity an agent can feel rather
        than read — and the rate that produces it is owed. `csm_ecs_study_guide.pdf` PDF p. 16 does
        give the setpoint the exchanger holds: "the water content of the gas in excess of a **50 F dew
        point** condenses on the plates of the heat exchanger and is removed". A dew point is a
        partial pressure and not a rate, so it bounds the cabin's humidity without giving the rate.
        **Searched:** `lunar_module_environmental_control_subsystem.pdf` item 109, the centrifugal
        water separator — its performance table gives the drum's gas-driven speed and no removal
        rate — and `csm_ecs_study_guide.pdf`, which describes the separator and publishes no rate
        either
        the crew's respiration and perspiration arrive at. Searched, and none has it: `csm_ecs_study_guide.pdf`, `lm_ecs_study_guide.pdf`, `lunar_module_environmental_control_subsystem.pdf`, `ApolloTrainingElectricalPowerSystemStudyGuide.pdf`, `lm_propulsion_rcs_study_guide.pdf`, `Apollo_Mission_E_Spacecraft_Reference_Trajectory_Vol4_Consumables_Analysis.pdf` and the CSM/LM Operational Data Book Volume III — the seven documents this folder has acquired and extracted. That is a bounded search rather than an exhaustive one, and naming it is what makes it checkable.
  - id: ventilation_fan
    kind: flow
    class: fan
    vehicle: csm
    cfm: UNCONFIGURED
    provenance:
      basis: UNCONFIGURED
      note: "the cabin fan's flow is not published. main_propulsion_diode.md:165's principle applies here in a different form: what matters is not the fan's rating but that the same ECS caution light can mean a glycol pump, a water separator or a suit fan (apollo_diode.md:84), so the domain needs a ventilation state without needing its rated flow. **Searched:** `lunar_module_environmental_control_subsystem.pdf` and `csm_ecs_study_guide.pdf` — the only flow either publishes is the suit circuit's 12 cfm at 3.5 psia, which is the suit fan rather than the cabin fan, and the cabin fan's own rating is a motor figure (13,000 rpm, 30 W) with no flow beside it."
  - id: lm_water_separator
    kind: flow
    class: exchanger
    vehicle: lm
    removal_kg_h: UNCONFIGURED
    provenance:
      basis: UNCONFIGURED
      note: >-
        the LM's water separator, named by the corpus as one of the three things the LM's single ECS
        caution light can mean (apollo_diode.md:84: "glycol-pump, water-separator or suit-fan
        trouble"), and its removal rate is not published — `condensing_heat_exchanger` above carries
        the same debt for the CSM. It exists as a separate article because ECL-21 is a *separate*
        fault from ECL-11: the LM has its own exchanger, the crew have nowhere else to go while it
        fails, and a shared component would have made a surface humidity failure the same
        injectable fault as an outbound one. **Searched:** `lunar_module_environmental_control_subsystem.pdf`
        item 109 and its figure 4-4 — the separator's own performance table gives the drum's speed
        and the gas flow it is driven by, not a condensate rate — and `lm_ecs_study_guide.pdf`

# --------------------------------------------------------------------------------------
# The atmosphere model, stated so the plant can implement it and the linter can check the
# units of everything that feeds it.
# --------------------------------------------------------------------------------------
atmosphere_model:
  law: "P = (sum_i n_i) R T / V, with n_i = m_i / M_i, and pp_i = P * n_i / sum_j n_j"
  volume_m3:
    csm: 5.9
    lm: 6.7
  temperature_from: cabin_zone_t, lm_cabin_zone_t
  gases:
    - id: o2
      molar_mass_kg_per_mol: 0.032
      source: "the cryogenic supply through the regulator, and the crew's metabolic consumption"
    - id: n2
      molar_mass_kg_per_mol: 0.028
      source: "the diluent load; small on this vehicle because the cabin is essentially pure oxygen at 5 psia"
    - id: co2
      molar_mass_kg_per_mol: 0.044
      source: "crew metabolism, removed by the lithium-hydroxide beds"
    - id: h2o
      molar_mass_kg_per_mol: 0.018
      source: "crew respiration and perspiration, removed by the condensing heat exchanger"
  check:
    # **The four gases part the cabin by partial pressure, and the three that are not oxygen are
    # declared here rather than derived from a total.** The stocks' initials owed "the fractions"
    # for as long as the domain has existed, on the reasoning that "no source in the corpus gives"
    # them. What follows replaces the fractions with the two pressures a source *does* give and one
    # the vehicle's own criterion gives, and makes the oxygen the remainder — which is what the
    # cabin pressure regulator physically does, because it holds *total* pressure by admitting
    # oxygen and nothing else.
    partial_pressures_mmhg:
      h2o: 9.209
      co2: 3.0
      n2: 0.0
    partial_pressure_provenance:
      basis: historical
      source: >-
        9.209 mmHg is the saturation vapour pressure of water at **10 C** (1.228 kPa), which is the
        50 F dew point the ECS's cooling process is run to. `csm_ecs_study_guide.pdf` **PDF p. 31**,
        Section III, Pressure Suit Subsystem: "the water content of the gas in excess of a 50 F dew
        point, condenses on the plates of the heat exchanger and is removed." **The page is about
        the suit circuit rather than the cabin**, and the cabin's own humidity is the same ECS's
        condensing heat exchanger and water separator doing the same job, so the figure is applied
        to the cabin as an **inference and not as a quotation** — the field says `historical`
        because the dew point is the document's and the arithmetic from it is water's own vapour
        pressure curve. It is also a **conflict**, recorded rather than resolved: the LM's ECS
        subsystem specification gives the cabin heat exchanger's own absolute humidity —
        `lm_ecs_sub.pdf`, Primary Heat Exchanger, Performance Condition I ("two cabin fans,
        condensing"): **0.0276 lb H2O per lb O2 at 5.0 psia O2**, which is a mole ratio of 0.0490
        and a water partial pressure of 12.1-12.7 mmHg depending on whether the quoted 5.0 psia is
        the oxygen's own pressure or the total. That is 3 to 3.5 mmHg above the 9.209 this model
        carries, it is measured at the cabin heat exchanger rather than at the suit circuit, and it
        would move the band this whole block exists to derive. Reconciling the two is a round of its
        own and is not a substitution to be made quietly. 3.0 mmHg is the one-hour average this
        domain's own `co2_exposure_1h` threshold declares, from `eclss_diode.md:735`. 0.0 is what
        the LM says about itself: `lm_ecs_study_guide.pdf` **PDF p. 32** (and its summary at p. 14)
        describes the Oxygen Supply and Cabin Pressure Control Section as storing "in gaseous form,
        **all oxygen** required by the ECS" and maintaining "cabin and/or suit pressurization by
        supplying **oxygen**" — the LM carries no cabin diluent, and its nitrogen appears only in
        the sealed water-tank pressurisation circuit
      note: >-
        **the nitrogen is zero and that is a finding rather than a placeholder.** The CSM's regulator
        meters oxygen to hold 5.0 +- 0.2 psia and the LM's supplies oxygen alone, so once the pad
        charge of sea-level air is vented and purged the diluent fraction decays; both cabins are,
        to the precision of their own instruments, pure oxygen. It is also what the ppO2 band
        requires — the oxygen holds the total pressure less the 12.209 mmHg the water vapour and
        carbon dioxide take, 246.37 against a 5.0 psia total — and what makes the four stocks one
        mixture rather than four independent numbers
    total_pressure_at_5_psia: >-
      34,474 Pa over 5.9 m3 at 295 K is **82.92 mol**, of which 9.209 mmHg of water vapour is 2.9536
      mol and 3.0 mmHg of carbon dioxide is 0.9621 mol. The oxygen is the remaining 79.0092 mol =
      **2.528302 kg** and the nitrogen is none, so the four sum to the cabin's own nominal 5 psia by
      construction. `check_cabin_pressure_closure` evaluates that sum rather than trusting this
      sentence, and it also holds the resulting ppO2 — 246.37 mmHg — inside the band this domain's
      own two ppO2 thresholds call habitable
    provenance:
      basis: derived
      relation: "the ideal-gas relation applied to the published cabin volume and pressure, with the oxygen as the remainder after the three declared partial pressures. It is stated here so that the initial load is a computed consequence of published figures rather than a third invented one."

open_debts:
  - "**The oxygen supply tank has a pressure now, and its *rule* is what is owed.** Round 30 found `eclss.o2_supply_pressure_psi` — apollo's 750-950 psi indication, with a low-pressure event and a >5 psi/min fall, perturbed by four declared faults — reading `o2_csm`, the shared oxygen *stock*, in kilograms, because the vehicle had no supply tank at all. Round 32 gave it one: `state o2_supply_pressure_psi`, a lag on the sentinel whose 900 psig starting value is `csm_ecs_study_guide.pdf` **PDF p. 12**'s own working pressure, so the channel is published rather than omitted. **What is still owed is how it moves**: a heated cryogenic tank holds its delivery pressure until the liquid is gone and then falls, so the relation between this state and `o2_csm` is a heater-and-regulator model rather than a gas law — and the *driver* is owed with it, because no edge can reach the sentinel. **Searched:** the ECS study guide end to end (PDF p. 12 is everything it says about the supply: the two cryogenic tanks in the S/M, the 900 psig working pressure, the surge tank's 3.7 lb, the inlet restrictors' 8.2 lb/hr at 900 psig) and `mission_e_consumables.txt`. What would close it: a tank or heater analysis for the S/M cryogenic tanks, or a pressure-versus-contents curve."
  - "The condensing heat exchanger's removal rate and the ventilation fan's flow are unpublished; both are declared unset above. Without them the humidity stock has no sink and the ventilation state has no magnitude, so the model can express a humid cabin and cannot yet dry it."
  - "The suit loop is modelled as a single flow channel rather than as a circuit with the PLSS, because apollo publishes suit_loop_flow_cfm and nothing about the portable life support's own consumables. EVA is therefore a phase whose atmosphere consequences are not yet modelled."
  - "**The cabin leak is declared per cabin now, and one of the two is borrowed.** Round 67 split
    `vehicle.yaml#consumables.leak` into `csm_kg_per_h: 0.023` and `lm_kg_per_h: 0.0226796`, so that
    the two supply rates above rest on fields rather than on a single figure doing both cabins' work.
    What remains owed is the CSM's measurement: A11 gives one cabin leak and it is the LM's, 0.05
    lb/hr, while the CSM's own is published nowhere in the corpus reached. The 0.023 kg/h used for it
    is the figure `domains/consumables/components.yaml` already sizes `o2_csm_kg`'s quantum from —
    0.0507 lb/hr, the same seal's number to within rounding — so it is borrowed rather than invented,
    and the provenance note says so. **A leak is a property of a seal rather than of a programme, and
    two cabins with one number between them read as though they had two.**"
