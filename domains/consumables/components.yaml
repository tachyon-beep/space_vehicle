# domains/consumables/components.yaml — the resource accounting model, and the two things the
# corpus got right that the design has to be careful not to lose.
#
# ## Why this domain is different from the other two
#
# Power has a topology and thermal has a physics; consumables has an **ontology**, and it is the
# corpus's single best artifact. `consumables_diode.md:19-30` enumerates seven abstract
# behaviours so that a kilogram of oxygen, a kilowatt-hour of battery, a spare canister and a
# communications window can share one accounting model "without pretending that all of them
# behave like kilograms in a tank". That is a real piece of engineering and the design adopted
# it — but `simulator-design.md:244` names four of the seven and silently drops three
# (`corpus-review.md` §8). The `ontology` block below names all seven and says where each lives,
# because a behaviour that is dropped without a note is a behaviour nobody will notice is
# missing.
#
# ## The two things the design has to be careful not to lose
#
# 1. **The ledger and the observation publish as a pair.** `consumables_diode.md:55-65`:
#    `delta_recon = observed - ledger`. The residual is evidence — it is how a slow leak first
#    becomes visible — and `simulator-design.md:250-252` is right that hiding it "deletes the
#    exact inference the experiment exists to observe". So the ledger, the observation and the
#    residual are three published channels, not one reconciled number.
# 2. **Claims are declined, and declining them means stripping fields** (D-04).
#    `simulator-design.md:254-257` declines the claims lifecycle on the grounds that "exposing
#    reservations as verbs hands the fleet a ready-made deconfliction primitive". The reasoning
#    is right and the scope was wrong: `reserved`, `allocated`, `committed` and
#    `available_to_new` are *required* fields of the schema being adopted
#    (`consumables_diode.md:1568-1575`), and `available_to_new` is precisely the aggregate other
#    agents' claims leave behind. So this domain publishes `observed`, `ledger`, `usable`,
#    `uncertainty`, `forecast` and `status` — and **no claim quantities at all**. There is no
#    `RESERVE_RESOURCE`, and there is no field that would tell one agent what another has
#    already spoken for.

domain: consumables
natural_rate_hz: 1

# Two entries were added when the edge list was read against this line, and one of them is a node
# named one hop away from the dependency: the reaction water's driver is `fc_o2_draw` — 1.126 kg of
# water per kg of O2 the cell consumes — and `fuel_cell` was declared in its place. The other two are
# the removal rates that `E-ATM-ABSORB` and `E-LM-ATM-ABSORB` spend the absorbers' man-hours at, the
# counters this domain writes and eclss drains.
#
# `fuel_cell` stays, and it is a different read: this domain's own `fuel_cell_o2` consumer is the
# cell's reactant draw at the declared demand, which is now derived from `per_joule_kg` and
# `load_budget.csm_total_demand_w` rather than quoted. It was UNCONFIGURED for as long as the
# corpus believed the kg-per-kWh figure was unpublished.
reads: [fuel_cell, fc_o2_draw, radiator_reject, crew_state, thrust_main, rcs_thrust,
        battery_energy, co2_removal_csm, co2_removal_lm]
writes: [o2_csm, o2_lm, h2_csm, water_potable, water_cooling, prop_main, prop_rcs,
         pressurant_he, absorber_capacity_csm, absorber_capacity_lm]

# --------------------------------------------------------------------------------------
# The ontology. All seven behaviours from `consumables_diode.md:19-30`, each with where it
# lives on this vehicle. A behaviour that is not modelled says so and says why.
# --------------------------------------------------------------------------------------
open_debts:

  - "The recorder's data storage is a Buffer on this vehicle and it is not yet modelled: during a
    lunar occultation the vehicle must store telemetry and replay it, which is
    `apollo_diode.md:903`'s operational fact rather than an interruption. It needs a node in
    `coupling.yaml` and a producer in the comms domain, neither of which exists yet. Until this
    round it was written in a `debt:` field inside `ontology` — a key that appears exactly once in
    the corpus, in a block no tool read, so the sentence that says what would close the gap was
    not in `--debts`, not in the count, and not fatal under `--strict`."

ontology:
  - behaviour: Stock
    model: "conserved quantity with inflows, outflows, loss and adjustment"
    on_this_vehicle: "the nine stocks below"
    provenance:
      basis: apollo
      ref: "apollo_diode.md:836-847"
      note: "apollo names the conserved stocks and requires them to be strictly conserved with no reset, restart or telemetry rewrite replenishing them"
  - behaviour: Rate/capacity
    model: "instantaneous capacity minus demand and reserve"
    on_this_vehicle: "not owned here: bus capacity and margin are the power domain's, downlink rate is the comms domain's, cooling capacity is thermal's"
    provenance:
      basis: chosen
      reason: "the corpus's own catalog lists electrical power, downlink rate, cooling capacity and CPU throughput as Rate/capacity resources; all four already have owning domains in this vehicle, and duplicating them here would put one figure in two files"
  - behaviour: Buffer
    model: "finite capacity with occupancy, ingress, egress and drops"
    on_this_vehicle: UNCONFIGURED
    provenance:
      basis: apollo
      ref: "apollo_diode.md:898-903"
      note: "apollo's telemetry profiles exist because behind the Moon there was no direct contact and stored telemetry was replayed later; a Buffer is exactly what that is"
  - behaviour: Inventory
    model: "discrete serialized or fungible items with condition"
    on_this_vehicle: "the LiOH canisters, counted and consumed by the man-hour"
    provenance:
      basis: historical
      source: "NR and PSR: an LM primary cartridge is 41 man-hours, a secondary 78, with 6 spares. A canister is a countable item whose capacity is denominated in man-hours, which is Inventory and Stock in one object and is exactly why the ontology separates them"
  - behaviour: Entitlement
    model: "limited rights with scope, expiry, checkout and release"
    on_this_vehicle: "not modelled, and deliberately"
    provenance:
      basis: chosen
      reason: "consumables_diode.md's entitlement examples are software licences, seat counts and cryptographic-use quotas — all of which exist in its catalogue to serve the CRA's generic multi-tenant case. This vehicle has none of them, and the corpus review flagged the entitlement rows as the part of that document written to justify its own serialization apparatus"
  - behaviour: Margin
    model: "derived distance to a configured limit; generally not conserved"
    on_this_vehicle: "propellant against the remaining delta-v budget, and time-to-limit across all stocks"
    provenance:
      basis: apollo
      ref: "apollo_diode.md:1022"
      note: "apollo's outcome margin is 'trajectory, power, oxygen, thermal, propellant and entry margins at mission end', and it is the closest thing the corpus has to a scoring function"
  - behaviour: Opportunity
    model: "time-bounded availability that cannot necessarily be stored"
    on_this_vehicle: "not owned here: communications windows and charging intervals belong to the comms and power domains"
    provenance:
      basis: chosen
      reason: "an Opportunity is a window, and every window on this vehicle is a comms or thermal one; modelling it in the consumables domain would mean the domain owning a schedule it does not produce"

# --------------------------------------------------------------------------------------
# State: the stocks. Each carries its own quantum, and the quantum is not a round number — it
# is derived from the smallest flow the stock must be able to represent, because a fixed-point
# stock whose quantum exceeds `smallest_flow x dt` has a dead zone that silently deletes the
# phenomenon (review-findings.md #1, plant.md §4). The linter refuses a stock whose declared
# minimum flow falls below its own quantum.
# --------------------------------------------------------------------------------------
state:

  - id: o2_csm_kg
    node: o2_csm
    method: stock
    unit: kg
    initial: 279
    initial_source: "vehicle.yaml:consumables.csm.o2_kg"
    quantum: 1.0e-6
    min_flow_per_s: 6.4e-6
    provenance:
      basis: derived
      relation: "quantum 1 mg because the smallest flow this stock must represent is the nominal cabin leak, 0.023 kg/h = 6.4e-6 kg/s (vehicle.yaml#consumables, from the Apollo 11 flight figure). A coarser quantum would round the leak to zero every tick and the leak would never happen — which is the failure review-findings.md #1 worked through numerically"
  - id: o2_lm_kg
    node: o2_lm
    method: stock
    unit: kg
    initial: 24.1
    initial_source: "vehicle.yaml:consumables.lm.o2_kg"
    quantum: 1.0e-6
    min_flow_per_s: 6.3e-6
    provenance:
      basis: derived
      relation: "as o2_csm_kg; the LM's own leak was 0.05 lb/hr actual against a 0.2 lb/hr specification"
  - id: h2_csm_kg
    node: h2_csm
    method: stock
    unit: kg
    initial: 24.5
    initial_source: "vehicle.yaml:consumables.csm.h2_kg"
    quantum: 1.0e-5
    min_flow_per_s: 1.28e-4
    provenance:
      basis: derived
      relation: "quantum 10 mg against the cell's standby hydrogen draw of 0.46 kg/h = 1.28e-4 kg/s (vehicle.yaml#electrical)"
  - id: water_potable_kg
    node: water_potable
    method: stock
    unit: kg
    initial: 14
    initial_source: "vehicle.yaml:consumables.csm.water_potable_kg"
    quantum: 1.0e-5
    min_flow_per_s: 7.9e-5
    provenance:
      basis: derived
      relation: "quantum 10 mg against the crew's 2.27 kg per crew-day for three, 7.9e-5 kg/s. The fuel cell produces into this stock at a far higher rate; the quantum is set by the smallest flow, not the largest"
  - id: water_cooling_kg
    node: water_cooling
    method: stock
    unit: kg
    initial: 13
    initial_source: "vehicle.yaml:consumables.csm.water_cooling_kg"
    quantum: 1.0e-4
    min_flow_per_s: 9.5714e-4
    provenance:
      basis: derived
      relation: "quantum 100 mg against the evaporator's full rate, 2,345 W x 4.0816e-7 kg/s per W = 9.5714e-4 kg/s. The evaporator is the fastest consumer in the domain, which is why this stock has the coarsest quantum. This read 8.9e-4 — the same rate computed from 3.8e-7, which is the constant `E-RAD-WATER` carried until round 61 swapped the water cycle's edges and left this copy behind, in a file no check opened"
  - id: prop_main_kg
    node: prop_main
    method: stock
    unit: kg
    initial: 18508
    initial_derivation:
      expression: sps_load
      inputs:
        sps_load: vehicle.yaml:propulsion.sps.mass_kg
    initial_provenance:
      basis: derived
      relation: >-
        the SPS's own loaded mass, which is what this node *is*: `coupling.yaml#nodes.prop_main`
        declares `carries: [sps]`, and the fact was already in the graph — the only edge out of the
        node derives its rate from `vehicle.yaml:propulsion.sps.isp_s`, so the tank it drains is the
        SPS's. **This entry owed an initial on the reasoning that "a single initial for the node
        would be a choice about which tank it *is* rather than a figure anything publishes"**, and
        the choice had been made one file over; what was missing was a declaration of it. The
        eighteen and a half tonnes are the whole of what the node holds, and the LM's two tanks —
        10,624 kg between them — are carried by the mission's own delta-v accounting instead, which
        `vehicle.yaml#propulsion.not_on_a_coupling_stock` names and `check_propellant_stocks` holds
    quantum: 1.0e-4
    min_flow_per_s: 29.57
    provenance:
      basis: derived
      relation: "quantum 0.1 g against the SPS's full-thrust flow of 29.57 kg/s (20,500 lbf at Isp 314.5 s). The SPS is not throttleable, so the smallest non-zero flow and the largest are the same number"
  - id: prop_rcs_kg
    node: prop_rcs
    method: stock
    unit: kg
    initial: 1008
    initial_derivation:
      expression: sm + cm + lm
      inputs:
        sm: vehicle.yaml:propulsion.rcs_sm.mass_kg
        cm: vehicle.yaml:propulsion.rcs_cm.mass_kg
        lm: vehicle.yaml:propulsion.rcs_lm.mass_kg
    initial_provenance:
      basis: derived
      relation: >-
        the three systems' loads summed: 608 + 112 + 288 = **1,008 kg**, which is the right lump
        rather than a convenience. The RCS domain models all forty-four thrusters as one article
        (`thruster_100lbf`, `vehicle_keys: [rcs_sm, rcs_cm, rcs_lm]`), so the service the allocator
        commands is one service: a fleet that has spent the SM's propellant has spent the vehicle's,
        and a per-system stock would be four stocks for one tank farm
    quantum: 1.0e-5
    min_flow_per_s: 0.1565
    provenance:
      basis: derived
      relation: "quantum 10 mg against a single thruster's flow, 445 N at Isp 290 s = 0.1565 kg/s. The minimum impulse bit is unpublished (vehicle.yaml#propulsion), so the finest *pulse* this stock can express is not yet known; the quantum is set by the flow, which is"
  - id: pressurant_he_kg
    node: pressurant_he
    method: stock
    unit: kg
    initial: 39.73469
    initial_derivation:
      expression: "sps_bottles_lb * lb_to_kg"
      inputs:
        sps_bottles_lb: 87.6
        lb_to_kg: 0.45359237
    initial_provenance:
      basis: derived
      relation: >-
        the table's own 87.6 lb, converted by the international pound: 87.6 x 0.45359237 =
        39.73469 kg
    initial_note: >-
      **the charge is published, and this entry said for a hundred rounds that it was not.** The
      Operational Data Book's own loading table for this mission — "MISSION J-2", Table 3.2-10,
      PDF p. 571 — lists the CSM's helium and nitrogen charge line by line: "Helium - SPS Bottles
      3600 [psia] 70 [F] 87.6 [lb] 87.6 [earth launch weight]", "Helium - Fuel Tanks 178 ... 5.4",
      "Helium - SM/RCS Quads A-D 4150 ... 6.0", "Helium - CM/RCS Systems A,B 4150 ... 1.0", and
      "Nitrogen - SM 2500 ... 1.3". The stock is the **SPS bottles' 87.6 lb = 39.73469 kg**, because
      that is the charge whose destination is this node's only edge (`E-PROP-PRESS` into
      `prop_main`); the other three helium charges total 12.4 lb and are published with different
      destinations (the fuel-cell reactant tanks and the two RCS systems) that this vehicle models
      as other stocks or not at all. **The LM's charge is published too**, in its own table —
      "LM-II - Helium & Nitrogen": APS tanks 6.6 + 6.6 lb, RCS tanks 1.05 + 1.05, DPS supercritical
      51.2, DPS ambient 1.1 — and no LM helium stock exists in this corpus for it to fill
    quantum: 1.0e-5
    quantum_placeholder: >-
      chosen against a *quantum and minimum-flow* rule this entry cannot satisfy: the stock's
      smallest flow is owed, so there is nothing to size the quantum against, and the quantum is
      nevertheless needed for the fixed-point stock to exist. One hundredth of a gram is the
      `water_potable_kg` figure, picked because the helium feed is slow rather than because any
      source gives it
    min_flow_per_s: UNCONFIGURED
    provenance:
      basis: historical
      source: "ODB Vol III (SNA-8-D-027(III) Rev 3) Table 3.2-10, MISSION J-2, 'Helium and Nitrogen' loading requirements, PDF p. 571: Helium - SPS Bottles, 3600 psia at 70 F, 87.6 lb required and 87.6 lb at earth launch"
      note: >-
        the value is the loading requirement and the launch weight, which the table gives as the
        same number — the bottles are charged to 3,600 psia and that is what the vehicle carries to
        orbit. **The regulated flow is still owed** and is a different quantity: the table gives
        the storage pressures (3,600 psia in the bottles, 178 in the fuel tanks, 4,150 in the RCS)
        and no mass flow, and the displacement ratio this stock feeds is `E-PROP-PRESS`'s own
        `UNCONFIGURED` sensitivity
  - id: absorber_man_hours_csm
    node: absorber_capacity_csm
    method: stock
    unit: man_hours
    initial: 0
    initial_provenance:
      basis: chosen
      reason: >-
        **a consumption counter starts at nothing spent.** The node's own `accumulates`
        says what this is — "`absorber_man_hours_csm` counts man-hours spent, so the
        element is exhausted when the count reaches its rating and the remaining capacity is
        a subtraction rather than a stock" — and a counter that began at its rating had
        already spent the whole element before the mission started. **This row read the
        rating itself** (`initial_source: coupling.yaml:nodes.absorber_capacity_csm.exhausted_at`):
        two declarations that must not be equal, held equal by a check that compares them.
        Round 33 found it through the window — the channel publishes `(rating - spent) /
        rating`, so a counter starting at its rating published a capacity of 100 % before
        the mission and fell to 0 % on the first tick, and the pair of them disagreed with
        every threshold on the channel
    quantum: 1.0e-4
    min_flow_per_s: 2.78e-4
    provenance:
      basis: derived
      relation: "quantum 0.0001 man-hours against 2.78e-4 man-hours/s: one crew member, which is the smallest party that ever works this element, because the commander stays in the CM for the whole surface stay while the other two are below. With all three aboard the rate is 8.3e-4, and the quantum is set by the smallest flow rather than the largest. Modelled in man-hours rather than kilograms because no kg-CO2 capacity is published, and a stock denominated in the unit the sources actually give is one that cannot drift from its evidence"
  - id: absorber_man_hours_lm
    node: absorber_capacity_lm
    method: stock
    unit: man_hours
    initial: 0
    initial_provenance:
      basis: chosen
      reason: >-
        **a consumption counter starts at nothing spent.** The node's own `accumulates`
        says what this is — "`absorber_man_hours_lm` counts man-hours spent, so the
        element is exhausted when the count reaches its rating and the remaining capacity is
        a subtraction rather than a stock" — and a counter that began at its rating had
        already spent the whole element before the mission started. **This row read the
        rating itself** (`initial_source: coupling.yaml:nodes.absorber_capacity_lm.exhausted_at`):
        two declarations that must not be equal, held equal by a check that compares them.
        Round 33 found it through the window — the channel publishes `(rating - spent) /
        rating`, so a counter starting at its rating published a capacity of 100 % before
        the mission and fell to 0 % on the first tick, and the pair of them disagreed with
        every threshold on the channel
    quantum: 1.0e-4
    min_flow_per_s: 5.56e-4
    provenance:
      basis: derived
      relation: "as absorber_man_hours_csm, at the LM's party size: the LM carries two crew from undocking to docking, so its smallest flow is 2/3600 = 5.56e-4 man-hours/s. Two counters with two minimum flows rather than one with one, which is the arithmetic consequence of the crew splitting up — and the reason a single counter had to assume a crew count that was wrong for whichever cabin it was not in"

# --------------------------------------------------------------------------------------
# Consumers. Every draw on a stock, with the edge it corresponds to in coupling.yaml or the
# reason it has none.
# --------------------------------------------------------------------------------------
consumers:

  - id: fuel_cell_o2
    stock: o2_csm
    edge: E-O2-DRAW
    rate_kg_s: 0.000152690537
    derivation:
      expression: per_joule_kg * demand_w
      inputs:
        per_joule_kg: domains/power/components.yaml:state.fc_o2_draw_kg_s.per_joule_kg
        demand_w: domains/power/components.yaml:load_budget.csm_total_demand_w
    provenance:
      basis: derived
      relation: >-
        the cell's oxygen draw at the CSM's declared 1,723 W demand: 8.8619e-8 kg/J x 1,723 W =
        1.526905e-4 kg/s, which is 0.550 kg O2 per hour. **This entry said the kg-per-kWh figure was
        "NOT published" and it was one division from three published numbers** — the reactant rate
        per ampere, the module's rated 29 V and the reaction's mass ratio — see
        `domains/power/components.yaml#state fc_o2_draw_kg_s.per_joule_kg`. What changed the entry
        rather than only the claim is that `rate_kg_s` is an absolute rate and it needs a load:
        `load_budget.csm_total_demand_w` supplies it, so the draw is a product of two declarations
        instead of a fourth place for one number
  - id: fuel_cell_h2
    stock: h2_csm
    edge: E-H2-DRAW
    rate_kg_s: 1.92390077e-05
    derivation:
      expression: per_joule_kg * h2_per_o2 * demand_w
      inputs:
        per_joule_kg: domains/power/components.yaml:state.fc_o2_draw_kg_s.per_joule_kg
        h2_per_o2: coupling.yaml:edges.E-H2-FC.sensitivity.value
        demand_w: domains/power/components.yaml:load_budget.csm_total_demand_w
    provenance:
      basis: derived
      relation: >-
        the oxygen draw over the reaction's mass ratio: 1.923901e-5 kg/s, or 0.069 kg H2 per hour.
        The two fuel-cell entries are deliberately not folded into one: the gases are separate
        stocks, and a hydrogen tank draining at the oxygen rate is a leak in the wrong tank
  - id: fuel_cell_product_water
    stock: water_potable
    edge: E-FC-WATER
    rate_kg_s: 0.000171929544662
    derivation:
      expression: per_joule_kg * demand_w * kg_water_per_kg_o2
      inputs:
        per_joule_kg: domains/power/components.yaml:state.fc_o2_draw_kg_s.per_joule_kg
        demand_w: domains/power/components.yaml:load_budget.csm_total_demand_w
        kg_water_per_kg_o2: coupling.yaml:edges.E-FC-WATER.sensitivity.value
    provenance:
      basis: derived
      relation: >-
        the third name for one unknown is now the third consequence of one division:
        the oxygen draw at the declared demand times `E-FC-WATER`'s 1.126 kg of water per kg of
        oxygen, which is 1.719295e-4 kg/s. A by-product rather than a draw, and it is the stock
        Apollo 13's crew rationed
      note: >-
        this entry said 0.45 until the round that found it, which is the figure `E-FC-WATER`'s own
        note records as corrected: 0.45 kg of water per kg of *reactants* asserts that 55 % of the
        reactant mass becomes neither electricity nor water nor heat. The edge was fixed and this
        copy was not, because the edge carried a `computation` the linter re-evaluates and this
        block had no reader at all — which is the argument for `derivation` over `computation`
        arriving a second time, in the block that copied a figure the linter had already checked
  - id: crew_metabolic_o2
    stock: o2_csm
    rate_kg_s: 3.16e-5
    derivation:
      expression: "o2_kg_per_crew_day * crew / seconds_per_day"
      inputs:
        o2_kg_per_crew_day: "vehicle.yaml:consumables.metabolic.o2_kg_per_crew_day"
        crew: "mission.yaml:crew.size"
        seconds_per_day: 86400
    provenance:
      basis: historical
      source: "0.91 kg per crew-day for three crew (vehicle.yaml#consumables, from the NR planning rates for a 154 lb man)"
      note: "no edge names this draw: the crew breathe from the cabin, and the tank supplies them through `E-O2-SUPPLY-CSM`, whose flow is the sum of this draw and the leak below. The stock is the tank because that is what the supply is charged against"
  - id: cabin_leak
    stock: o2_csm
    rate_kg_s: 6.4e-6
    derivation:
      expression: "csm_kg_per_h / seconds_per_hour"
      inputs:
        csm_kg_per_h: "vehicle.yaml:consumables.leak.csm_kg_per_h"
        seconds_per_hour: 3600
    provenance:
      basis: historical
      source: "the Apollo 11 LM flight leak of 0.05 lb/hr against a 0.2 lb/hr specification"
      note: "as the metabolic draw above: the leak is a property of the cabin rather than of the tank, and the tank's makeup reaches it through the same supply edge. The derivation is from the *declared* 0.023 kg/h rather than from the published pound figure, because the declared figure is the corpus's own 2-significant-figure conversion of it and 6.4e-6 is that conversion's consequence — deriving it from 0.05 lb/hr would refuse on a rounding chain rather than on a disagreement"
  - id: evaporator_water
    stock: water_cooling
    edge: E-WATER-RAD
    rate_kg_s: 9.5714e-4
    derivation:
      expression: "rejection_w * kg_per_s_per_w"
      inputs:
        rejection_w: "domains/thermal/components.yaml:components.evaporator_csm.rejection_w"
        kg_per_s_per_w: "coupling.yaml:edges.E-WATER-RAD.sensitivity.value"
    provenance:
      basis: derived
      relation: "the latent heat of vaporisation at about 280 K, 2.45e6 J/kg, applied to the published 2,345 W evaporator capacity: 2,345 x 4.0816e-7 kg/s per W = 9.5714e-4 kg/s. It read 8.9e-4, and named `E-RAD-WATER` — the limit edge, whose 2.45e6 J per kg is the constant the old arithmetic ignored in favour of 3.8e-7"
  - id: crew_potable_water
    stock: water_potable
    edge: E-CREW-WATER
    rate_kg_s: 7.9e-5
    derivation:
      expression: "water_kg_per_crew_day * crew / seconds_per_day"
      inputs:
        water_kg_per_crew_day: "vehicle.yaml:consumables.metabolic.water_kg_per_crew_day"
        crew: "mission.yaml:crew.size"
        seconds_per_day: 86400
    provenance:
      basis: historical
      source: "2.27 kg per crew-day for three (vehicle.yaml#consumables)"
  - id: sps_burn
    stock: prop_main
    edge: E-PROP-ENG
    rate_kg_s: 29.57
    derivation:
      expression: "thrust_n / (isp_s * g0)"
      inputs:
        thrust_n: "vehicle.yaml:propulsion.sps.thrust_n"
        isp_s: "vehicle.yaml:propulsion.sps.isp_s"
        g0: 9.80665
    provenance:
      basis: derived
      relation: "20,500 lbf at Isp 314.5 s, mdot = F/(Isp g0)"
  - id: rcs_firings
    stock: prop_rcs
    edge: E-RCSP-RCS
    rate_kg_s: 0.1565
    derivation:
      expression: "thrust_n / (isp_s * g0)"
      inputs:
        thrust_n: "vehicle.yaml:propulsion.rcs_sm.thrust_n"
        isp_s: "vehicle.yaml:propulsion.rcs_sm.isp_s"
        g0: 9.80665
    provenance:
      basis: derived
      relation: "445 N at Isp 290 s, per thruster"
  - id: pressurant_blowdown
    stock: pressurant_he
    edge: E-PRESS-PROP
    rate_kg_s: UNCONFIGURED
    provenance:
      basis: UNCONFIGURED
      note: "regulated blowdown; the regulator's behaviour is owed (vehicle.yaml#open_debts)"
  - id: co2_removal
    stock: absorber_capacity_csm
    edge: E-ATM-ABSORB
    crew_cabin: csm
    rate_man_hours_s: 8.3e-4
    provenance:
      basis: derived
      relation: "three crew at one man-hour of removal each per hour, 8.3e-4 man-hours/s while all three are in the CM. From undocking to docking only the commander is aboard, and the rate falls to 2.78e-4 — which is why the field is a rate and not a total, and why the cabin is declared: the draw follows the crew, and the crew split is a mission event rather than a constant"
      note: "the edge is named and no derivation is, deliberately: the rate is `E-ATM-ABSORB`'s 26.37 man-hours per kg times eclss's removal rate, but that sensitivity is itself a 4-significant-figure rounding of 1/0.03792, so a derivation from it would refuse at this field's third figure on a rounding chain rather than on a disagreement. 26.37 x 3.159722e-5 = 8.332e-4 against the 8.3e-4 declared"
  - id: co2_removal_lm
    stock: absorber_capacity_lm
    edge: E-LM-ATM-ABSORB
    crew_cabin: lm
    rate_man_hours_s: 5.56e-4
    provenance:
      basis: derived
      relation: "two crew at one man-hour of removal each per hour. The LM's counter is spent by the two crew who are in it and by nobody else, which is the whole content of the split: before round 42 a crew on the surface drained the CSM element at the LM's rate and the two absorbers were one number"
      note: "as the CSM's: 26.37 x 2.106481e-5 = 5.5548e-4, and 5.56e-4 is that to three figures from the *exact* 1/0.03792 = 26.3713 rather than from the edge's rounded 26.37, which is why the derivation is not declared"

# --------------------------------------------------------------------------------------
# The ledger pair. For each stock that has an independent observation, both terms and the
# residual are published. Where there is no observation there is no residual, and saying so is
# better than publishing a residual computed against the ledger itself — which would always be
# zero and would look like perfect agreement.
# --------------------------------------------------------------------------------------
ledgers:

  - resource: prop_main
    ledger_channel: "res.ledger_main_propellant_kg"
    observed_channel: prop.propellant_remaining_pct
    residual_channel: "res.recon_main_propellant_kg"
    observed_how: "inferred from tank pressure and temperature, which is what Apollo had: an RCS or main quantity had to be inferred rather than read from a mass sensor (apollo_diode.md:40)"
    provenance:
      basis: apollo
      ref: "apollo_diode.md:40, :197"
  - resource: o2_csm
    ledger_channel: "res.ledger_o2_kg"
    observed_channel: eclss.o2_supply_pressure_psi
    residual_channel: "res.recon_o2_kg"
    observed_how: "inferred from tank pressure and temperature; the residual is the classic Apollo 13 signature, a quantity indication that disagrees with the bookkeeping hours before anything else does"
    provenance:
      basis: apollo
      ref: "apollo_diode.md:26"
      note: "apollo's crisis scenario seeds exactly this: 'one cryogenic quantity sensor occasionally reads suspiciously high' (:1174)"
  - resource: water_potable
    ledger_channel: "res.ledger_water_potable_kg"
    observed_channel: res.water_potable_kg
    residual_channel: "res.recon_water_potable_kg"
    observed_how: "tank quantity where a sensor exists, otherwise not observed at all — water is the resource whose ledger is most often the only number available"
    provenance:
      basis: apollo
      ref: "apollo_diode.md:195"
      note: "apollo marks water_potable_kg as 'I/A depending sensor', which is the honest description of a resource that may have no instrument"
  - resource: prop_rcs
    ledger_channel: "res.ledger_rcs_propellant_kg"
    observed_channel: res.rcs_propellant_kg
    residual_channel: "res.recon_rcs_propellant_kg"
    observed_how: "inferred from feed pressure and total impulse; the LM flew thousands of short firings (apollo_diode.md:143), so the accounting error accumulates rather than jumping"
    provenance:
      basis: apollo
      ref: "apollo_diode.md:151-152"

# --------------------------------------------------------------------------------------
# Reconciliation policy.
# --------------------------------------------------------------------------------------
reconciliation:

  tolerance_kg: UNCONFIGURED
  note: >-
    consumables_diode.md:852 is explicit that "no universal numerical tolerance is
    appropriate", and it is right: the tolerance has to exceed the observation's own
    uncertainty, which differs per resource and per sensor. A single number here would be the
    invented-threshold failure the whole artifact is built to avoid, so the tolerance is
    declared per resource as a debt rather than chosen once.
  on_mismatch:
    action: "publish a RECONCILIATION_MISMATCH event and leave both numbers alone"
    never: "rewrite the ledger, or adjust the observation, or average them"
  provenance:
    basis: apollo
    ref: "consumables_diode.md:60-64"
    note: "a mismatch is evidence, not permission to silently rewrite the ledger. Any correction must be an authorised adjustment carrying evidence, reason, signer and before/after values"
