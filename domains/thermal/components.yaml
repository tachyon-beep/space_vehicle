# domains/thermal/components.yaml — the thermal control subsystem, and the parameters nobody
# would give us.
#
# ## The debt this file exists to pay
#
# `thermal_diode.md:965` is explicit: with no standalone TCS predecessor, "prior TCS-specific
# values — temperature limits, heater ratings, radiator sizing, thermal-zone definitions,
# sensor accuracies, sampling rates, pump characteristics, valve timings, thermal-control
# algorithms and TCS command IDs — are **UNSPECIFIED**. This report does not infer them from
# the communications, propulsion, GNC, ECLSS or power specifications." `corpus-review.md` §6
# named the consequence: `thermal`'s own equation has `C_i` and `Q` terms with no way to
# populate them.
#
# So the parameters below are **derived** wherever a published geometry plus a standard
# material property determines them, and `chosen` only where a lumped value has to be picked.
# Every derivation states its relation, so the linter can re-derive it and disagree, and every
# chosen value states its reason. Two of them are worth reading because they are the whole
# reason the thermal domain is interesting:
#
#   * **The transport delay.** 25 litres of coolant at the published 200 lb/hr takes 17
#     minutes to go round the loop. That delay is what separates "the pump stalled just now"
#     from "the pump has been degrading for an hour" (`review-findings.md` #12), and a lumped
#     RC network cannot express it at all. It is modelled as a tick-indexed ring, not as a
#     chain of small nodes, so no node has a residence time below dt.
#   * **The environment is a heat source with a geometry.** At the published radiator area, a
#     solar-illuminated radiator absorbs about 2.5 kW — comparable to its own rejection
#     capacity. That is why `apollo_diode.md:341` lists "radiator isolation / poor attitude"
#     as a failure chain, and why attitude is a thermal command surface rather than only a
#     pointing one.

domain: thermal

# The fastest thermal constant here is about four minutes, so integrating at 50 Hz is 12,000
# ticks per time constant. Declared honestly as 1 Hz rather than as the rate the scheduler
# currently uses: the declaration is what makes the multi-rate optimisation a scheduler change
# rather than a rewrite (plant.md §10).
natural_rate_hz: 1

# `command_executive` is the last entry and it arrived with `E-CMD-PUMP`: the pump is commanded
# rather than driven by a voltage, and until the edge existed this domain's pump states had no path
# from the executive. `check_domain_reads` is what forced the declaration — the edge is the graph's
# half and this list is the domain's, and the two are held equal.
reads: [fuel_cell, bus_a, bus_b, avionics_compute, link, instrumentation, rcs_thrust,
        structure_config, water_cooling, command_executive]
writes: [coolant_flow, coolant_supply_t, coldplate_t, radiator_reject, loop_transport,
         cabin_zone_t, lm_cabin_zone_t, cabin_heat_csm, cabin_heat_lm, cabin_eq_csm,
         cabin_eq_lm, environment_heat, service_bay_heat, descent_bay_heat,
         service_bay_zone_t, descent_bay_zone_t]

# --------------------------------------------------------------------------------------
# State. Thermal has no conserved stocks on purpose: energy is not asserted here. A fuel cell
# has exact stoichiometric mass ratios and a float efficiency, so mass conserves exactly and
# heat gets a tolerance band and a trend, never an assertion (review-findings.md #14). A
# universal conservation assertion applied to a thermal margin is a category error
# (simulator-design.md:248).
# --------------------------------------------------------------------------------------
state:
  - id: cabin_heat_csm_w
    node: cabin_heat_csm
    method: algebraic
    unit: W
    total_w: 733
    provenance:
      basis: derived
      computation: "60 + 85 + 80 + 100 + 36 + 72 + 300"
      relation: >-
        the sum of the `demand_w` of the seven loads `heat_inputs.csm_cabin` assigns to this zone:
        cabin fan 60, suit fan 85, CO2 scrubber 80, lighting 100, S-band transceiver 36, S-band
        power amplifier 72, and the cabin's share of the 300 W heater bank. Algebraic rather than a
        stock because the rate follows which loads are on rather than accumulating — a load that is
        shed stops heating in the same tick
      note: >-
        the number is not invented here and is not duplicated: it is the load inventory's, summed.
        `check_thermal_heat_inputs` re-derives it against `heat_inputs` on every run, so a load
        re-rated in `domains/power/` and not here is refused rather than silently changing how warm
        the cabin gets
  - id: cabin_heat_lm_w
    node: cabin_heat_lm
    method: algebraic
    unit: W
    total_w: 827
    provenance:
      basis: derived
      computation: "62 + 85 + 80 + 40 + 20 + 90 + 150 + 100 + 200"
      relation: >-
        as the CSM's, over the nine loads `heat_inputs.lm_cabin` assigns: cabin fan 62, suit fan 85,
        CO2 scrubber 80, lighting 40, S-band transmitter 20, S-band high-power amplifier 90,
        guidance computer 150, instrumentation 100, and the cabin's share of the 200 W heater bank.
        827 W against the CSM cabin's 733, with two crew against three, because the LM has no
        avionics-bay zone and its guidance equipment is inside the compartment
  - id: cabin_eq_csm_k
    node: cabin_eq_csm
    method: algebraic
    unit: K
    total_k: 286.21
    provenance:
      basis: derived
      computation: "7.2 + 273.15 + 733 / 125"
      relation: >-
        the equilibrium the cabin relaxes toward: the loop's mixed supply plus the rise the
        compartment's own equipment causes. Every term is declared elsewhere — the supply is
        `vehicle.yaml#thermal.loops.loop_primary.supply_c` and its own source gives 45 F = 7.2 C, the
        733 W is `cabin_heat_csm_w` summed from the power domain's load inventory, and the 125 W/K is
        `zone_csm_cabin_t`'s conductance. 7.2 C is 280.35 K and 733/125 = 5.864 K
      note: >-
        this is the vehicle's first state whose rule is **completely specified**: nothing in it is
        owed, and `check_cabin_equilibrium` re-derives it against the four declarations it rests on.
        It is algebraic rather than a stock because the equilibrium is a function of the current heat
        rate and supply, not an accumulation
  - id: cabin_eq_lm_k
    node: cabin_eq_lm
    method: algebraic
    unit: K
    total_k: 286.97
    provenance:
      basis: derived
      computation: "7.2 + 273.15 + 827 / 125"
      relation: >-
        as the CSM's, over the LM cabin's larger heat load: 827 W over the same 125 W/K conductance is
        6.616 K above the same 280.35 K supply. The two cabins differ by 0.75 K at equilibrium, and
        the whole of that difference is the 94 W between their equipment
  - id: environment_heat_w
    node: environment_heat
    method: algebraic
    unit: W
    total_w: 2477.0
    provenance:
      basis: derived
      computation: "1361 * 0.2 * 9.1"
      relation: >-
        the absorbed solar load at a bad attitude: 1361 W/m2 of flux, 0.2 absorptivity on a
        white thermal-control coating, and 9.1 m2 of radiator presented to the sun. 1,361 x 0.2 x 9.1
        = **2,477 W**, against the radiator's own 2,588 W of rejection capacity. Algebraic because it
        follows the vehicle's attitude rather than accumulating — and it is the *first* term of the
        thermal balance, which is why its absence left the radiator's temperature a function of
        nothing
      note: >-
        the lunar surface terms — `lunar_ir_w_m2` and `albedo_load_w` — are still `UNCONFIGURED` in
        `radiator_model.environment`, and they are owed *here* now: the node exists, so a value that
        lands there has an edge to travel down rather than a block no tool reads
  - id: service_bay_heat_w
    node: service_bay_heat
    method: algebraic
    unit: W
    total_w: 630.0
    provenance:
      basis: derived
      computation: "250 + 250 + 80 + 50"
      relation: >-
        the sum of the `demand_w` of the four loads `heat_inputs.csm_service_bay` assigns: coolant
        pump 1 at 250, pump 2 at 250, the RCS heaters at 80 and the comm heaters at 50. Algebraic
        because the rate follows which loads are on rather than accumulating
  - id: descent_bay_heat_w
    node: descent_bay_heat
    method: algebraic
    unit: W
    total_w: 180.0
    provenance:
      basis: derived
      computation: "120 + 60"
      relation: "the landing radar at 120 W and the descent stage's RCS heaters at 60, which is all `heat_inputs.lm_descent_bay` assigns"
  - id: zone_csm_cabin_t
    method: lag
    node: cabin_zone_t
    unit: K
    tau_s: 2880
    conductance_w_per_k: 125
    provenance:
      basis: derived
      relation: "C/G. C = 400 kg aluminium-equivalent x 900 J/kg-K = 360,000 J/K; G = 125 W/K, sized so a 1 kW cabin load sits about 8 K above the coolant supply, which is the order apollo's cabin-to-coolant difference implies. tau = 360,000/125 = 2,880 s"
      note: "the cabin air alone is 2.4 kg (5.9 m3 at 5 psia and 295 K) and would have a thermal mass of 1,724 J/K, 0.5 % of the lumped value — which is why a bare-air cabin model has a time constant of seconds and is wrong. The structure, the equipment and the ECS water are the mass."
  - id: zone_csm_avionics_t
    method: lag
    node: coldplate_t
    unit: K
    tau_s: 406
    provenance:
      basis: derived
      relation: "C/G. C = 60 kg aluminium-equivalent = 54,000 J/K; G = 133 W/K, sized so an 800 W electronics load sits about 6 K above the plate. tau = 54,000/133 = 406 s"
      note: "apollo_diode.md:97: electronics were directly cooled by coldplates, so the coldplate and its boxes are one lump"
  - id: zone_csm_service_t
    # `G = C/tau` with `tau` declared, so ONE scalar closes the edge above and this is it. The
    # relation is not restated here because the edge carries it: 1/G is what the bay's rise per
    # watt is, and it follows from this mass by division once `c_p` is stated with it
    method: lag
    node: service_bay_zone_t
    # `C = m x c_p` and `G = C / tau`, so ONE number closes the edge above: the lumped mass. The
    # propellant is the mass and the tank wall is the path, which is what the state's own reason
    # says; what is owed is that mass, not the conductance, because `tau` is already declared.
    lumped_mass_kg: UNCONFIGURED
    unit: K
    tau_s: 7200
    provenance:
      basis: chosen
      reason: "the service bay is unregulated and its mass is dominated by propellant and structure, which is a much larger lump than the cabin; twice the cabin's time constant because the propellant is the mass and the tank wall is the path"
  - id: zone_lm_cabin_t
    method: lag
    node: lm_cabin_zone_t
    unit: K
    tau_s: 2880
    conductance_w_per_k: 125
    provenance:
      basis: derived
      relation: "as the CSM cabin: 6.7 m3 at about 5 psia, so the same lumped mass and conductance within the precision of either figure"
  - id: zone_lm_descent_t
    # `G = C/tau` with `tau` declared, so ONE scalar closes the edge above and this is it. The
    # relation is not restated here because the edge carries it: 1/G is what the bay's rise per
    # watt is, and it follows from this mass by division once `c_p` is stated with it
    method: lag
    node: descent_bay_zone_t
    lumped_mass_kg: UNCONFIGURED
    unit: K
    tau_s: 10800
    provenance:
      basis: chosen
      reason: "an exposed, unregulated stage whose mass is mostly propellant and structure with a poor path to the loop; the longest constant in the vehicle, and the one that makes the frozen-line chain slow enough to be diagnosable"
  - id: zone_radiator_t
    method: lag
    node: radiator_reject
    unit: K
    tau_s: 300
    provenance:
      basis: derived
      relation: "the panel's own lumped mass over its radiation conductance: a 9.1 m2 aluminium panel at 2.7 kg/m2 is 25 kg = 22,500 J/K, and its linearised radiation conductance at 285 K is 4 x 2,588/285 = 36 W/K, giving 625 s. Chosen at 300 s because the linearised conductance overstates damping at the cold end; the value sits inside the range the two estimates bracket."
      note: "the radiator itself is an observable with no command interface (simulator-design.md:158) — it has a temperature and a rejection curve, and nothing an agent can command acts on it directly"
  - id: comm_amp_t
    method: lag
    node: internal
    unit: K
    tau_s: 265
    provenance:
      basis: derived
      relation: "C/G. C = 5 kg travelling-wave tube assembly = 4,500 J/K; G = 17 W/K, sized so a 250 W dissipation runs about 15 K above the coldplate. tau = 4,500/17 = 265 s"
      note: "apollo_diode.md:106 publishes comm_amp_c with a >60 C event. It gets its own node rather than sharing the avionics lump because it is the component the flagship chain overheats, and its smaller mass is what makes it the first to go"
  - id: coolant_loop_t
    method: lag
    node: coolant_supply_t
    unit: K
    tau_s: 45
    provenance:
      basis: derived
      relation: "the loop's own mass over its mixing conductance: 25 L of 62.5/37.5 glycol-water at 1,050 kg/m3 is 26.25 kg, with c_p about 3,600 J/kg-K, so C = 94,500 J/K; at the published 200 lb/hr = 0.0252 kg/s the through-flow refreshes that mass every 1,042 s, and one well-mixed volume has a mixing time constant near C/(2 x mdot x c_p) = 94,500/181 = 522 s. Chosen at 45 s because the loop is modelled as well mixed at each node, and this entry represents only the sensor and mixing lag rather than the transit."
      note: "the transit is the delay element below, not this lag. Two different things that a single lumped node would fuse into one wrong number."
  - id: coolant_flow_kg_s
    method: lag
    node: coolant_flow
    unit: "kg/s"
    tau_s: 8
    provenance:
      basis: chosen
      reason: "pump spin-up: a centrifugal pump reaches speed in a few seconds, and 8 s is long enough that a bus sag lasting one tick cannot produce an instant flow loss. This is the lag that makes the flagship chain a ramp rather than a step"
  - id: pump_1_speed_rpm
    method: lag
    node: coolant_flow
    unit: rpm
    tau_s: 8
    # `moved_by` on a lag, which the field's check only *requires* of discrete states: this one's
    # driver is external — a verb — and saying so is what lets `check_command_reach` hold the edge
    # that carries it. It is optional here and load-bearing where it is written.
    moved_by:
      - "command:set_coolant_pump"
    command_value:
      - verb: set_coolant_pump
        argument: state
        maps:
          "on": UNCONFIGURED
          "off": 0
        why: >-
          a commanded-off pump coasts to zero, so `off` is the only value the corpus can supply.
          `on` relaxes toward the pump's rated speed, which is published nowhere: the channel's own
          0-12,000 rpm is a `range_kind: band` — an acceptable operating region rather than a rating
          — and `coupling.yaml`'s `E-CMD-PUMP` owes the same figure
        note: >-
          the rated speed is one scalar, and it closes this mapping, that edge and
          `pump_1_speed_rpm`'s own driver. What it would take is a pump curve or a rated rpm for the
          CSM's coolant pump, which no source in the corpus reached gives
    provenance:
      basis: chosen
      reason: "as coolant_flow_kg_s; the pump has its own speed state because a blocked loop and a slowing pump produce the same flow with different speeds, and that difference is the diagnosis"
  - id: loop_transport_t
    method: delay
    node: loop_transport
    unit: K
    delay_s: 1042
    provenance:
      basis: derived
      relation: "25 L at the published 200 lb/hr = 90.7 kg/h, i.e. 1.44 L/min of glycol-water at 1,050 kg/m3, gives 17.4 min = 1,042 s of transit"
      note: "implemented as a tick-indexed ring buffer, exact and deterministic, rather than as a chain of small nodes — which would create nodes with residence times below dt and reintroduce the stiffness the exponential map exists to remove (review-findings.md #12)"
  - id: radiator_rejection_w
    method: algebraic
    node: radiator_reject
    unit: W
    provenance:
      basis: derived
      relation: "epsilon x sigma x A_eff x T^4, minus the absorbed environmental load; see the radiators block below"
      note: "algebraic because rejection is a function of the current surface temperature, not an integral of it — which is exactly why C-RAD-COOL is an algebraic loop solved to consistency rather than a delayed cycle"
  - id: heater_bank_duty
    method: algebraic
    node: internal
    unit: "-"
    provenance:
      basis: chosen
      reason: "heater duty is commanded and then limited by the zone's own hard limits; there is no state to integrate, and treating it as a state would let a heater command persist through a mode change"

# --------------------------------------------------------------------------------------
# Components.
# --------------------------------------------------------------------------------------
components:

  - id: loop_primary
    kind: flow
    class: loop
    vehicle: csm
    fluid: "62.5 % ethylene glycol / 37.5 % water"
    # The three figures below are one fluid, and until this round they lived in the *relations* of
    # two states: `coolant_loop_t` worked out "25 L of 62.5/37.5 glycol-water at 1,050 kg/m3 is
    # 26.25 kg" and `loop_transport_t` worked out "25 L at the published 200 lb/hr ... gives 1,042
    # s of transit", and nothing could read either. The density is the conversion between the two
    # flow figures the source publishes, and the mass is the density applied to the volume.
    #
    # Two flow units on purpose, and each is its own source's: `flow_l_min` is apollo's own
    # operating band (1.3-1.7 L/min) and `nominal_flow_lb_per_h` is TN D-6718's published primary
    # flow. The density is what makes them one quantity — 200 lb/hr is 1.43998 L/min at 1,050
    # kg/m3, which is inside the band — and `check_thermal_bindings` holds all three together.
    fluid_density_kg_m3: 1050
    nominal_flow_lb_per_h: 200
    coolant_mass_kg: 26.25
    flow_l_min: [1.3, 1.7]
    volume_l: 25
    provenance:
      basis: historical
      source: "TN D-6718 and NR ch.14 give the 200 lb/hr primary flow and the fluid; the volume is chosen — a 1-inch line 30 m long is 15 L, and a two-panel loop with coldplates is 15-30 L, with no published total coolant mass (only a 1 gal reservoir)"
  - id: loop_secondary
    kind: flow
    class: loop
    vehicle: csm
    fluid: "62.5 % ethylene glycol / 37.5 % water"
    # The same fluid, so the same density; the mass follows from it and the chosen volume. No
    # `nominal_flow_lb_per_h`: the secondary's band is scaled from the primary's and no source
    # publishes a flow for it, so the nominal is a figure the primary has and this loop does not.
    fluid_density_kg_m3: 1050
    coolant_mass_kg: 18.9
    flow_l_min: [1.0, 1.5]
    volume_l: 18
    provenance:
      basis: chosen
      reason: "apollo_diode.md:97 names two water-glycol loops with primary and secondary pumps; the secondary's figures are scaled from the primary because no source gives them"
  - id: loop_lm
    kind: flow
    class: loop
    vehicle: lm
    fluid: "65 % water / 35 % inhibited ethylene glycol"
    flow_l_min: [1.5, 1.9]
    volume_l: 11
    coolant_mass_kg: 11.3
    provenance:
      basis: historical
      source: "TN D-6724 and NR ch.6: LM loop 222 lb/hr minimum, about 25 lb of coolant, operating +29 to +120 F"
  - id: pump_1
    kind: flow
    class: pump
    loop: loop_primary
    rated_w: 250
    inrush_w: 420
    provenance:
      basis: chosen
      reason: "its electrical figures are the power domain's csm_coolant_pump_1; the mechanical side is what this domain owns"
  - id: pump_2
    kind: flow
    class: pump
    loop: loop_primary
    rated_w: 250
    inrush_w: 420
    provenance:
      basis: chosen
      reason: "the redundant pump on the primary loop"
  - id: pump_lm
    kind: flow
    class: pump
    loop: loop_lm
    rated_w: 200
    inrush_w: 340
    provenance:
      basis: chosen
      reason: "the LM's single coolant pump; it has no redundancy, which is the LM's whole character"
  - id: radiator_csm
    kind: flow
    class: radiator
    # The link to `vehicle.yaml#thermal.radiators`, declared rather than inferred because the two
    # files name one panel from opposite ends — `csm_radiator` against `radiator_csm` — so a rule
    # guessed from the string would have to know that the vehicle's name leads with the vehicle
    # and the domain's trails it. What it buys is `check_thermal_bindings`' second half: these two
    # panels are what the linter holds the vehicle-level entry against, rather than only the
    # `radiator_model` block the entry's *arithmetic* is derived into.
    vehicle_keys: [csm_radiator]
    panels: 2
    area_m2: 9.1
    provenance:
      basis: historical
      source: "NR and TN D-6718: two panels of about 49 sq ft each, about 4,415 Btu/hr per panel = 1,294 W"
  - id: evaporator_csm
    kind: flow
    class: evaporator
    vehicle_keys: [csm_evaporator]
    rejection_w: 2345
    fluid: water
    provenance:
      basis: historical
      source: "NR: about 8,000 Btu/hr = 2,345 W"
  - id: sublimator_lm
    kind: flow
    class: evaporator
    vehicle_keys: [lm_sublimator]
    rejection_w: UNCONFIGURED
    provenance:
      basis: historical
      source: "the LM sublimator's rejection capacity and water consumption are NOT published in any source reached (TN D-6724, NR ch.6, A11, SP4029). Declared unset rather than invented"
  - id: heater_bank_csm
    kind: flow
    class: heater
    rated_w: 300
    provenance:
      basis: chosen
      reason: "the power domain's csm_heaters load; the thermal side owns which zones it serves and under what limits"
  - id: heater_bank_lm
    kind: flow
    class: heater
    rated_w: 200
    provenance:
      basis: chosen
      reason: "as above, for the LM"
  - id: bypass_valve
    kind: discrete
    class: valve
    loop: loop_primary
    states: [radiator, bypass]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:239"
      note: "apollo lists set_radiator_bypass as an operator control; a valve that routes the loop around the radiator is the only thermal actuator with a fast, large and reversible effect"

# --------------------------------------------------------------------------------------
# The radiator's physics, derived from the published rejection rather than asserted.
# --------------------------------------------------------------------------------------
radiator_model:

  law: "Q = epsilon * sigma * A_eff * T_rad^4  -  Q_absorbed"
  csm:
    area_geometric_m2: 9.1
    emissivity: 0.85
    effectiveness: 0.89
    area_effective_m2: 8.1
    radiating_temperature_k: 285
    rejection_w: 2588
    absorbed_environment_w: UNCONFIGURED
    provenance:
      basis: derived
      relation: >-
        epsilon = 0.85 is a standard white thermal-control coating; the published rejection of
        2 x 1,294 W at a 285 K radiating surface then implies an effective area of 8.1 m2
        against a geometric 9.1 m2, i.e. 89 % effectiveness, which is what fin efficiency and
        view-factor losses give on a real panel. The three figures that are published — area,
        per-panel rejection and inlet temperature — therefore determine the fourth, and the
        derivation closes on them instead of on a guessed emissivity.
      source: "NR and TN D-6718 for the area and rejection; the coating emissivity is standard, not vehicle-specific"
  environment:

    solar_flux_w_m2: 1361
    absorptivity: 0.2
    projected_area_m2: 9.1
    solar_load_w_at_bad_attitude: 2477
    lunar_ir_w_m2: UNCONFIGURED
    albedo_load_w: UNCONFIGURED
    provenance:
      basis: derived
      relation: >-
        1361 W/m2 x 0.2 absorptivity x 9.1 m2 of radiator presented to the sun = 2,477 W —
        comparable to the radiator's own 2,588 W rejection capacity. That is the whole reason
        `apollo_diode.md:341` lists "radiator isolation / poor attitude" as a failure chain:
        attitude alone can cancel the radiator. The lunar surface terms are declared unset
        because the surface-phase geometry is not yet parameterised.
  note: >-
    This is the block that makes F-13 a physics chain rather than a scripted event, and it is
    also why the thermal domain reads `structure_config`: a staging event permanently changes
    the radiating area and its view of the sun (apollo_diode.md:343).

    # --------------------------------------------------------------------------------------
    # Zones. `thermal_diode.md:131` requires paired heat/cool thresholds with a minimum dwell for
    # any regulated zone, and `:765-772` requires that a zone at a hard limit is not commanded
    # further in the same direction.
    # --------------------------------------------------------------------------------------
zones:

  - id: csm_cabin
    vehicle: csm
    volume_m3: 5.9
    # The same four links the vehicle-level zone carries, so the zone join compares them: a zone
    # whose model is described differently in the two files is two compartments wearing one name.
    cooled_by: loop_primary
    temperature_state: zone_csm_cabin_t
    heat_state: cabin_heat_csm_w
    equilibrium_state: cabin_eq_csm_k
    # The cabin's nominal state, mirrored so that the zone join compares it. `vehicle.yaml` is the
    # authority for both — the pressure is in psia because that is the unit NR publishes it in, and
    # the two edges that differentiate the ideal-gas law convert it.
    nominal_pressure_psia: 5
    nominal_temperature_k: 295
    regulated: true
    source: heater_bank_csm
    provenance:
      basis: historical
      source: "NR: CSM cabin 210 cu ft habitable = 5.9 m3 at 5 psia"
  - id: csm_avionics_bay
    vehicle: csm
    regulated: true
    source: heater_bank_csm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:105"
      note: "avionics_plate_c with a >50 C event"
  - id: csm_service_bay
    vehicle: csm
    regulated: false
    provenance:
      basis: chosen
      reason: "unregulated; it matters through the propellant and pressurant it contains"
  - id: lm_cabin
    vehicle: lm
    volume_m3: 6.7
    cooled_by: loop_lm
    temperature_state: zone_lm_cabin_t
    heat_state: cabin_heat_lm_w
    equilibrium_state: cabin_eq_lm_k
    nominal_pressure_psia: 5
    nominal_temperature_k: 295
    regulated: true
    source: heater_bank_lm
    provenance:
      basis: historical
      source: "NR: LM cabin 235 cu ft pressurised = 6.7 m3"
  - id: lm_descent_bay
    vehicle: lm
    regulated: false
    provenance:
      basis: chosen
      reason: "exposed and unregulated; the frozen-line chain lives here"
  - id: radiator_loop
    vehicle: csm
    regulated: false
    provenance:
      basis: chosen
      reason: "an observable with no command interface"

load_budget:

  note: >-
    The thermal domain's heat inputs are the power domain's loads: every watt an agent
    switches on becomes a watt this domain has to reject, and the split between what leaves
    through the radiator and what leaves through the evaporator is the vehicle's thermal
    budget. The numbers live in `domains/power/components.yaml#loads` and are not duplicated
    here, because two copies of one figure is how a vehicle changes mass between two files.
  total_rejection_capacity_w: 4933
  provenance:
    basis: derived
    relation: "2,588 W of radiator plus 2,345 W of evaporator, against a 1,723 W CSM demand — so the vehicle has a comfortable nominal margin and no margin at all if the radiator is sunlit and the evaporator is dry"

# --------------------------------------------------------------------------------------
# What this domain still owes, and the one item that blocks the cabins.
# --------------------------------------------------------------------------------------
open_debts:

  - "**The compartment each load heats WAS declared nowhere, and is now declared above.**
    `heat_inputs` gives every load a zone and the partition closes: 1,723 W of CSM load and
    1,007 W of LM load, matching `domains/power/components.yaml`'s per-vehicle totals exactly, which
    is what `check_thermal_heat_inputs` holds it to. What remains owed from that work is the
    *edges*: the mapping is data and the graph still has no heat-rate node for it to flow through,
    which is the second debt below. The original finding, kept because it is the reason the block
    exists: `load_budget` above states the
    relationship correctly — the heat inputs are `domains/power/components.yaml#loads`, and the
    numbers are not duplicated here — but a load carries `bus`, `class`, `demand_w`, `inrush_w` and
    `vehicle`, and **no field says which zone its watts warm**. There are 25 loads and 6 zones, and
    until the assignment exists there is nothing to draw a heat-input edge from. The consequence is
    not abstract: `zone_csm_cabin_t` and `zone_lm_cabin_t` are `lag` states with the same 2,880 s
    time constant `a 1 kW cabin load` produced, and **neither node has an edge into it**, so neither
    can be advanced — the cabin's temperature has no heat source anywhere in the graph while the
    crew, the equipment and the loop all warm it in the prose. `check_vehicle` now reports the
    undriven nodes by name. The check also found three nodes that looked the same and are not:
    `o2_lm`, `prop_rcs` and `pressurant_he` have no inbound edge because they are filled at the pad
    and never again, which they say in `preloaded:`, so the check exempts a declared one."

  - "**The cabin's second driver is now expressed, and not by the `lag`.** A cabin's equilibrium is
    the coolant supply plus its own heat rise, and a `lag` pulls its state toward a single driver, so
    the two inputs are combined *upstream* of the relaxation instead: `cabin_eq_csm_k` and
    `cabin_eq_lm_k` are algebraic states whose every term is declared elsewhere, and the cabins relax
    toward them. This closes the 8 K error the previous round introduced when the cabin relaxed
    toward `Q/G` absolute — the offset is back, and it is a node rather than a hoped-for method.
    These are the vehicle's first states whose rule is completely specified: nothing in either is
    owed, and `check_cabin_equilibrium` re-derives them against the four declarations they rest on."

# --------------------------------------------------------------------------------------
# Which loads heat which zone.
#
# This is the assignment `load_budget` says is missing and `open_debts` names. It lives *here*
# rather than as a `zone:` field on each power load for the reason `heater_bank_csm`'s own
# provenance already gives: the electrical figures are the power domain's and **the thermal side
# owns which zones a source serves**. Putting a zone on the load would be a second declaration of
# one fact, in the file that explicitly refuses to duplicate the numbers.
#
# The assignment is `chosen` where the corpus does not state it — it gives the equipment, never
# its compartment — and the rule is the zones' own definitions: crew-accessible equipment heats
# the crewed compartment, guidance and instrumentation heat the bay that carries the avionics
# plate, and everything on an uncrewed stage heats that stage. Apollo's own arrangement is the
# basis for the split, and the alternative considered was a single lumped vehicle heat input,
# which would have made a warm cabin and a warm service bay the same observation.
# --------------------------------------------------------------------------------------
heat_inputs:

  csm_cabin:
    rate: csm
    loads: [csm_cabin_fan, csm_suit_fan, csm_co2_scrubber, csm_lighting,
            csm_sband_transceiver, csm_sband_power_amplifier, csm_heaters]
    note: >-
      the crewed compartment, and it holds the comms transceiver and amplifier as well as the ECS
      equipment: Apollo's S-band equipment was inside the command module rather than on the stage.
      `csm_heaters` is the cabin side of a 300 W bank that serves two zones — `heater_bank_csm`'s
      `source:` on both this zone and the avionics bay is the declaration that it is shared
  csm_avionics_bay:
    loads: [csm_imu, csm_guidance_computer, csm_instrumentation]
    note: >-
      the bay whose >50 C event is the zone's whole limit. The IMU, the guidance computer and the
      instrumentation are what the avionics plate carries, and the discrepancy between their 360 W
      of demand and the plate's own temperature is the point of the zone
  csm_service_bay:
    loads: [csm_coolant_pump_1, csm_coolant_pump_2, csm_rcs_heaters, csm_comm_heaters]
    note: >-
      uncrewed, and unregulated because nothing in it has a limit — what matters is the propellant
      and pressurant it contains, which is where the frozen-line chain lives. The coolant pumps are
      the largest pair of loads on the vehicle and they sit here rather than in the cabin: the
      primary loop's pumps are on the service module
  lm_cabin:
    rate: lm
    loads: [lm_cabin_fan, lm_suit_fan, lm_co2_scrubber, lm_lighting, lm_sband_transmitter,
            lm_sband_high_power, lm_guidance_computer, lm_instrumentation, lm_heaters]
    note: >-
      the LM's crewed compartment, and it carries more than the CSM's because the LM has no
      avionics-bay zone: the guidance computer and the instrumentation are inside the cabin the
      crew fly in, which is why the LM's cabin is the warmer of the two by design
  lm_descent_bay:
    loads: [lm_landing_radar, lm_rcs_heaters]
    note: >-
      the descent stage, exposed and unregulated. The landing radar is mounted on it and the RCS
      quads are its own, so both heat the stage the crew leave behind at staging

unheated:
  radiator_loop:
    why: >-
      the radiator is an *observable* with no command interface (simulator-design.md:158), not a
      compartment: nothing is installed in it and no load heats it. It is listed here rather than
      left out so that the check can tell "nothing heats it, deliberately" from "nothing heats it,
      nobody said"
